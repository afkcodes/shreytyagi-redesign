  lists: ['Lists', 'Sortable data on Indian cinemas and the movies shown in them.'],
  utilities: ['Utilities', 'Web based tools to help you visualise, calculate, find or create.'],
  photos: ['Photos', 'Photo sets.'],
};
const ONE = { articles: 'Article', blogs: 'Blog', lists: 'List', utilities: 'Utility', photos: 'Photos' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const day = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const dShort = iso => day(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const dLong = iso => day(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
const plain = h => String(h).replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '')
  .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
/* next frame, or a timer when frames are paused (hidden tab) — whichever comes first */
const soon = fn => { let done = false; const run = () => { if (!done) { done = true; fn(); } }; requestAnimationFrame(run); setTimeout(run, 50); };
const link = e => e.kind === 'external' ? e.url : '#/' + e.id;
const extAttr = e => e.kind === 'external' ? ' target="_blank" rel="noopener"' : '';
$('#yr').textContent = new Date().getFullYear();

const crumb = e => `<p class="crumb"><a href="#/${e.section}">${SECTIONS[e.section][0]}</a><i>/</i><span>${esc(e.category)}</span></p>`;
const icon = {
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>',
  print: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 9V4h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v6H7z"/></svg>',
};

/* ---------------------------------------------------------------- index views */
function group(list, key) {
  const m = new Map();
  for (const e of list) { const k = key(e); if (!m.has(k)) m.set(k, []); m.get(k).push(e); }
  return m;
}
function rows(list, meta) {
  return `<ol class="rows">${list.map(e => `<li><a class="row" href="${esc(link(e))}"${extAttr(e)}>
    <time datetime="${e.date}">${dShort(e.date)}</time>
    <span class="t">${esc(e.title)}${e.kind === 'external' ? ' <span class="ext">↗</span>' : ''}</span>
    <span class="m">${esc(meta(e))}</span></a></li>`).join('')}</ol>`;
}
function viewIndex(section) {
  const list = section ? E.filter(e => e.section === section) : E;
  const byCat = section === 'lists';
  const g = group(list, e => byCat ? e.category : e.date.slice(0, 4));
  const meta = e => !section ? ONE[e.section] : byCat ? `${e.count.toLocaleString()} rows` : e.category;
  const head = section
    ? `<header class="ph"><h1>${SECTIONS[section][0]}</h1><p class="sub">${SECTIONS[section][1]}</p></header>`
    : `<header class="home"><p class="lede">Articles, lists and tools about cinema technology — IMAX, Dolby Cinema, HDR, 3D and encoding.</p>
       <p class="lede-2">Not a typical personal website: the point is to publish information and ideas that add value, not a summary of me. <a href="#/about">More about me</a>.</p></header>`;
  const body = [...g].map(([k, l]) => `<section class="grp"><h2 class="gh">${esc(k)}<span>${l.length}</span></h2>${rows(l, meta)}</section>`).join('');
  return { html: head + (body || '<p class="empty">Nothing here yet.</p>'), title: section ? SECTIONS[section][0] : '' };
}

/* ---------------------------------------------------------------- post */
function neighbours(e) {
  const l = E.filter(x => x.section === e.section && x.kind !== 'external');
  const i = l.indexOf(e);
  return [l[i - 1], l[i + 1]];
}
function pn(e) {
  const [newer, older] = neighbours(e);
  if (!newer && !older) return '';
  return `<nav class="pn" aria-label="More ${SECTIONS[e.section][0].toLowerCase()}">
    ${newer ? `<a class="prev" href="#/${newer.id}"><small>← Newer</small><span>${esc(newer.title)}</span></a>` : ''}
    ${older ? `<a class="next" href="#/${older.id}"><small>Older →</small><span>${esc(older.title)}</span></a>` : ''}</nav>`;
}
function viewPost(e) {
  const p = D.posts[e.id];
  const gal = p.gallery ? `<div class="gallery">${p.gallery.map(([t, , c], i) =>
    `<button type="button" data-photo="${i}" aria-label="Open photo ${i + 1}${c ? ': ' + esc(c) : ''}"><span class="n">${i + 1}</span><img src="${esc(t)}" alt="${esc(c)}" loading="lazy" decoding="async" onerror="this.remove()"></button>`).join('')}</div>` : '';
  const html = `<article>
    <header class="ph">${crumb(e)}<h1>${esc(p.title)}</h1>
      <p class="meta"><time datetime="${e.date}">${dLong(e.date)}</time> · ${p.mins} min read</p></header>
    <div class="prose">${p.html}</div>${gal}${pn(e)}</article>`;
  return { html, title: p.title, progress: p.mins >= 3, after: () => {
    wrapTables(main);
    if (p.math) katex().then(() => window.renderMathInElement && renderMathInElement($('.prose', main), {
      delimiters: [{ left: '\\[', right: '\\]', display: true }, { left: '\\(', right: '\\)', display: false }], throwOnError: false }));
    if (p.gallery) bindGallery(p.gallery);
  } };
}
function wrapTables(root) {
  for (const t of $$('.prose table', root)) {
    if (t.parentElement.classList.contains('tw')) continue;
    const w = document.createElement('div'); w.className = 'tw'; t.before(w); w.append(t);
  }
}
let katexP;
function katex() {
  if (katexP) return katexP;
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/';
  const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = base + 'katex.min.css'; document.head.append(css);
  const js = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.append(s); });
  return katexP = js(base + 'katex.min.js').then(() => js(base + 'contrib/auto-render.min.js')).catch(() => {});
}

/* ---------------------------------------------------------------- lists */
const coll = new Intl.Collator('en', { numeric: true, sensitivity: 'base' });
const prepared = new Map();
function prep(id) {
  if (prepared.has(id)) return prepared.get(id);
  const [head, ...data] = D.lists[id].rows;
  const txt = data.map(r => r.map(plain));
  const hay = txt.map(r => r.join(' \u0001 ').toLowerCase());

lb.addEventListener('keydown', ev => { if (ev.key === 'ArrowLeft') show(gi - 1); if (ev.key === 'ArrowRight') show(gi + 1); });
lb.addEventListener('close', () => { lbImg.removeAttribute('src'); });
})();
</script>
