gnificant consideration for the exhibitors.<\/li>\n<li>While some might attribute it to a lack of awareness, based on my numerous discussions with friends outside of X, it appears that they simply do not express any interest.<\/li>\n<li>The value proposition in comparison to IMAX.<\/li>\n<li>Geographical aspect.<\/li>\n<\/ul>\n<p>Now let's elaborate on each front.<\/p>\n<p><strong>Pricing :<\/strong><\/p>\n<p>Their Screen 7 has a 4K Laser Projection with Dolby Atmos and Screen 6 is Dolby Cinema which has a Dual Laser projection capable of projecting Dolby Vision cinema and 60+ channel Dolby Atmos.<\/p>\n<p>The movie F1 is creating waves all accross the industry, posting great occupancy numbers even after 10 days of its release. It's currently listed in both Screen 6 and Screen 7.<\/p>\n<p>While the screen 7 at City Pride is posting decent occupancies with a standard ticket price ranging from ₹150-₹250, their Screen 6 which is Dolby Cinema costs around ₹450-₹500 for their standard seating option is struggling to post good numbers.<\/p>\n<p>How many people out there would spend double or triple when the choices are great and \"great better\" because Screen 7 in itself is a pretty solid option, isn't it?<\/p>\n<p>And this is the same city where both the IMAXes are posting solid numbers for this film despite costing ₹350-₹450.<\/p>\n<p><strong>Awareness :<\/strong><\/p>\n<p>There's a saying \"When you're too used to the mid, even average starts to feel like excellence.\"<\/p>\n<p>We, as a society, have been fed mediocre or subpar cinema over the years that we've simply accepted is good for us. Nearly 10 years ago, my hometown got its first Multiplex &amp; 2 years later, its first PVR. Once they opened, I still recall my dad saying:<\/p>\n<p>\"I can't go to regular theatres now, my eyes hurt\"<\/p>\n<p>and ever since then, they have become the standard here. I recently visited these venues and they've become so old, my eyes hurt but a lot of people don't seem to care anyways since they're still better than the other single screens in the city.<\/p>\n<p>There used to be a time when I watched a lot of movies on the giant Prasads 70mm IMAX with my dad back in the day which we seem to have forgotten and we've adapted to the new substandard normal.<\/p>\n<p><strong>IMAX vs DC :<\/strong><\/p>\n<p>Let's jump back to discussing about F1 movie.<\/p>\n<p>IMAX is playing the entire movie runs in 1.90 expanded aspect ratio while standard theatres and Dolby Cinema are playing it in a Scope ratio.<\/p>\n<p>So, even if you're a movie buff, which one would you pick? Absolute best HDR or expanded aspect ratio? And I think this will be the case for a lot of future releases too, since IMAX doesn't share its DCPs.<\/p>\n<p>Now I don't know how good the city's IMAXes are but one cannot deny that IMAX is a big name brand while people barely know or understand Dolby Cinema fully. One will obviously compare both because IMAX has always been the standard and Dolby Cinema is priced on par with it.<\/p>\n<p><strong>Geography :<\/strong><\/p>\n<p>I am certainly not qualified to comment on the geography of the city and the location of Dolby Cinema, but from a quick Google Maps search, I understand that the nearest IMAX location is 20 km away from City Pride, Kharadi, and another one is 27 km away. That must account for something.<\/p>\n<p>Again, happy to be corrected on this point.<\/p>\n<p><strong>Closing Thoughts :<\/strong><\/p>\n<p>I really hope more people find out about this new format and like it. Then, it could make as much money as IMAX, or even more! If one venue and a new format do well, it'll open the door for even newer formats, more cities getting cool cinema options, and a better cinema standard all over the country!<\/p>\n<p>Please feel free to share your opinion. Let's up the cinema standard across the country!<\/p>","mins":3,"math":false},"articles/f14dxreview":{"gallery":null,"title":"F1 4DX and Movie Review","html":"<p>It’s the same stereotypical sports movie story, already done hundreds of times before. A “once-great” protagonist makes a comeback and struggles his way up. The story has no surprises, no complex characters, and no unpredictability. Many plot points, like the protagonist who is wise but arrogant in his ways, and a competitive junior who doesn’t accept his mentorship, are directly copied from Top Gun: Maverick. Overall, I really didn’t find the story fresh at all. I’m not saying that the story is bad, in fact, it did keep me engaged throughout… but it’s nothing new.<\/p>\n<p>This movie is technically a visual masterpiece. The racing scenes are some of the best-looking shots I’ve ever seen in any movie. They feel very immersive and intimate. The shots are very stylish, stable, well planned. The color-palette is very consistent. If the director’s intention was to present the most professional looking F1 shots ever, he achieved that with flying colours.<\/p>\n<p>As for surround sound, the directional sound effects were underwhelming. I expected the surrounds to be loaded with cars zipping around, but the shots weren’t designed to take advantage of that. Therefore the mixing for sound effects was mostly front-heavy. All I could hear in the surrounds was the commentary and music.<\/p>\n<p>The Hindi dub was excellent. It is one of the finest dubs I have heard. Viraj Adhav’s voice as Brad Pitt is done very professionally, well suited and soothing to the ears. Some jokes could have landed better in English but overall, it kept the essence of the movie intact.<\/p>\n<p>4DX was underwhelming. Although the seat movements were synced nicely with the moving cars, they felt exaggerated and unnatural. This is again because the shots were cut rapidly and did not suit the 4DX format. To be honest, 4DX didn’t spoil the experience, but it didn’t enhance it much either. On the other hand, movies like How to Train Your Dragon suited 4DX very well and truly enhanced the experience.<\/p>\n<ul>\n<li>Water effects were used quite a few times.<\/li>\n<li>Snow was used once for confetti.<\/li>\n<li>Lightning was used for sparking.<\/li>\n<li>Scent was used a few times.<\/li>\n<li>The seats were active only during races.<\/li>\n<\/ul>\n<p>Recommended in 4DX? Yes, but not strongly. Prefer IMAX or similarly large screens with bright 4K and deep bass.<\/p>","mins":2,"math":false},"articles/ballerina4dxreview":{"gallery":null,"title":"Ballerina 4DX and Movie Review","html":"<p>I’ve seen all #JohnWick films but only vaguely remembered the story… so maybe why I couldn’t connect much. Felt like a bland Bollywood-style revenge drama.<\/p>\n<p>Action/fights were solid. Sound mix was front-heavy except during action… great directional effects (gunshots, voices moving in surround).<\/p>\n<p>Hindi dub was fine, except for two poorly voiced kids.<\/p>\n<p>4DX was thrilling: blasts, hits, throws synced perfectly with motion seats. They timed it in a way that they slowly dip the seats (without letting us know) before major impacts, and then used that for a sharp bounce &amp; tilt back... this was really exciting and masterfully done. Lightning, snow (used thrice), wind &amp; smoke added well.<\/p>\n<p>Recommended in 4DX? Yes, but not strongly. I feel it could be better on a bigger screen with deep bass.<\/p>","mins":1,"math":false},"articles/httyd4dxreview":{"gallery":null,"title":"How To Train Your Dragon 4DX & Movie Review","html":"<p>Shrey Tyagi<br>\n<\/p><p>I hadn’t ever seen the original animated film or even any trailers for the new one (except a long-forgotten 3D teaser years ago at a cinema)… so I went in completely blind.<\/p>\n<p>The story, characters, and performances were so strong… I found myself relating not just to the protagonist but also to his father and friends at various points. The story kept me hooked… something that’s rare nowadays. It’s a very engaging and emotional story.<\/p>\n<p>The CGI, VFX, and locations were flawless… you genuinely can’t tell where the sets end and the extensions begin. Despite being about mythical creatures, it felt surprisingly real and believable.<\/p>\n<p>The 3D was outstanding… perfect conversion with zero artifacts. Strong depth throughout, and every time I removed the glasses, the background–foreground blur difference proved the quality. If this is the kind of 3D @DNEG is bringing to #Superman, I’m excited.<\/p>\n<p>Surround sound mix wasn’t the highlight… the design was good, but mixing was just okay.<\/p>\n<p>The Hindi dubbing was excellent… so natural that I forgot I was even watching a dub. No subtitles at all… which made the 3D even more immersive.<\/p>\n<p>4DX was used brilliantly… and because of the amount and length of aerial scenes, it completely suits the movie. Seat movements synced perfectly with dragon flight… strong wind… water splashes whenever you hit the sea… with that 3D, it honestly felt like I was riding Toothless (no exaggeration).<\/p>\n<p>If you’ve already watched it in IMAX, do a rewatch in 4DX. If there’s no IMAX nearby, I’d strongly recommend going for 4DX.<\/p>\n<p>It’s not just the flying scenes… even the fight scenes had good 4DX timing (though not as tight as Ballerina’s).<\/p>\n<ul>\n<li>Snow was used once when Hiccup lands in a field of cotton flowers<\/li>\n<li>Smoke was heavily used in the final climax<\/li>\n<li>Scent was strong in the forest scenes<\/li>\n<li>Lightning appeared a few times too<\/li>\n<\/ul>\n<p>Overall, a great movie… with a near-perfect 4DX + 3D experience.<\/p>","mins":1,"math":false},"blogs/amilosinginterestincinemas":{"gallery":null,"title":"Am I Losing Interest In Cinemas?","html":"<p>For a very long time, I’ve been a strong supporter of the theatrical experience. I’ve always told people to watch movies only in cinemas and to not wait for them to arrive on OTT… because a cinema experience can never be fully replicated at home. A projector illuminating a big white screen, array of surround speakers, being free of distractions in a dark room, and the communal experience. For years, I believed this deeply. And I still do.\nBut something has slowly started changing.\nNow that I am in my late 20s, life feels busier in ways it did not earlier. Work takes up a lot of time, responsibilities are increasing and all the things I want to do outside of work feel harder to fit into the day. On top of that, as a lazy lad, it only makes it worse for me to redeem free time.\nTo plan a movie outing, means getting ready (especially in winters it means 3x more time to cover up properly) before leaving the house. Then comes the travel… reaching the cinema, parking the vehicle, long walks inside the mall, and finally settling into the seat. There are trailers to sit through and then comes the long stretch of sitting in one position. If water intake is not planned properly, there is always the fear of missing some of the movie because of unavoidable washroom breaks. After the movie ends, there is the travel back home, changing clothes, and finally settling down again. All of this adds up.\nBut I have already done this a lot and never even felt it to be a discomfort. I have watched close to 300 movies in cinemas so far in my life. Over the years, I have gone out of my way to experience movies the best way possible. I have traveled to Delhi-NCR more than 50 times specifically to watch movies in premium formats. Almost 10 hours of travel just to watch one movie. A few times I have even travelled 1000+ km, just for a cinema visit.\nPeople often asked why I would travel so far just for a movie. At that time, it never felt like a big deal. For me, it was worth it. I wanted to experience cinema in its purest form, and I had the energy to do it.\nIf I tried to build that habit now, I honestly do not think I could. Today, my relationship with cinemas is changing, not because I love movies any less, but because my priorities are shifting. I now prefer going to the cinema only when a movie truly excites me. When I cannot wait for it to come home. When it offers something that only a cinema can provide. A strong spectacle. A native or excellent 3D presentation. Or when there is exceptional hype around the movie. But how often does that really happen? In a year, maybe 15 or 20 movies at most. That includes both Hindi and English movies. With 52 weeks in a year, that comes down to roughly 1 cinema visit every 2 weeks. And even that feels like a conscious choice now, not a default habit.\nAt the same time, watching movies at home has started to feel more appealing. Lying on my bed, wrapped comfortably in a quilt. Snacks on the table. Water, coffee, chips, whatever I want. A dark room. I can pause or rewind whenever I want. I can adjust the picture exactly how I like it. I can tune the bass, the surround channels, and the overall sound balance on my 5.1 home theater setup. I get 4K resolution, HDR, and proper surround activity under my full control.\nIn cinemas, that control is mostly missing. Sometimes the picture is not calibrated properly. Sometimes the sound is too low. Sometimes the surround channels feel inactive. Sometimes the bass is barely audible. These issues are out of my hands. At home, they are not. Comfort is slowly becoming more important than the experience itself.\nThis shift in my cinema preferences has not completely happened yet, but it is getting stronger day by day. I can see it coming, it’s inevitable. But I’m glad that during my early 20s, I pushed myself to experience cinema to the fullest. I traveled, explored different theaters, and watched movies the way I always wanted to. I lived that phase fully, without regret.<\/p>","mins":3,"math":false},"articles/kashmirtrains":{"gallery":null,"title":"Why Taking Full-Sized Trains to Kashmir Was Almost Impossible","html":"<p>North India begins as flat land. From Delhi to Punjab, the ground is wide and level. Trains can move fast here. Height changes very little.<\/p>\n<p>Near Jammu, the plains start to break. Low hills appear. The climb begins slowly.<\/p>\n<p>After this, the land turns hard. Mountains rise sharply and deep gorges cut through the earth. Rivers flow far below. This mountain belt acts like a wall. It is the <strong>Pir Panjal<\/strong> range. Crossing this wall is the hardest part.<\/p>\n<p>Once the wall is crossed, the land suddenly opens. The mountains fall away. A wide valley appears. This <strong>valley looks flat like plains<\/strong>. But it sits very high above sea level. It is an elevated plain surrounded by mountains. This is the Kashmir Valley.<\/p>\n<p>For the longest time, nobody could even imagine trains reaching here. Until 2005, railways in India ended at <strong>Jammu Tawi<\/strong>. Beyond Jammu, there were only roads.<\/p>\n<p>In 2005, trains climbed into the hills for the first time. Tracks reached <strong>Udhampur<\/strong>, at about 756 metres above sea level. The climb had begun.<\/p>\n<p>In July 2014, railways reached <strong>SMVD Katra<\/strong>. This station sits at 825 metres. For nearly ten years, this was the last stop. The mountains ahead were too hard.<\/p>\n<p>At the same time, railways were growing inside the Kashmir Valley itself.<\/p>\n<p>In 2009, trains started running between <strong>Banihal<\/strong> and <strong>Qazigund<\/strong>. Later that year, they reached <strong>Srinagar<\/strong>. By 2013, trains went all the way to <strong>Baramulla<\/strong>.<\/p>\n<p>But these trains running inside the Kashmir Valley were cut off from the rest of India. There was no rail link beyond the mountains.<\/p>\n<p>Between Katra and Banihal lay just 111 kilometres. This short stretch was the hardest part.<\/p>\n<p>Here, the Himalayas rise sharply. The rock is unstable and broken. Water flows inside the mountains. Many tunnels collapsed during construction. Several routes had to be changed. Progress was slow, but the line moved forward.<\/p>\n<p>In 2020, <strong>Tunnel T-44<\/strong>, over 11 kilometres long, was completed. In April 2021, <strong>Tunnel T-50<\/strong> broke through. At 12.77 kilometres, it became the <strong>longest railway tunnel in India<\/strong>.<\/p>\n<p>In the same month, steel met steel across the Chenab. The arch of the <strong>Chenab Rail Bridge<\/strong> was closed. At 359 metres above the river, it became the <strong>highest railway bridge on Earth<\/strong>.<\/p>\n<p>Soon after, the <strong>Anji Khad Bridge<\/strong>, the <strong>second highest railway bridge of India<\/strong>, joined the cliffs of Reasi. India’s first cable-stayed railway bridge stood ready.<\/p>\n<p>By 2023, tracks from Kanyakumari and Kashmir finally met.<\/p>\n<p>At Banihal railway station, trains stand at about <strong>1,702 metres above sea level<\/strong>. This is the <strong>highest broad-gauge railway station in India<\/strong>.<\/p>\n<p>Beyond Banihal, the wall ends.<\/p>\n<p>The land opens into the Kashmir Valley. Srinagar rests at around 1,585 metres. A high valley. Flat, wide, and calm.<\/p>\n<p>Once, trains did not exist here at all. Not in these gorges. Not under these mountains. Not in this valley.<\/p>\n<p>Today, steel passes through the Himalayas. It crosses deep rivers. It reaches places once thought unreachable. This is why this railway feels different. It did not just connect places. It crossed a wall.<\/p>\n<p>I am a train enthusiast and have travelled by train thousands of times. I cannot explain how proud I feel of my country and of the engineers who made this happen.<\/p>\n<p><em>Disclaimer: I wrote this article and used AI assistance for fact-checking, grammar review, and improving sentence structure and clarity. The ideas, research, and viewpoints are my own.<\/em><\/p>","mins":3,"math":false},"articles/dhurandhar2inepiqluxon":{"gallery":null,"title":"Dhurandhar 2 in 4K HDR: How EPIQ Luxon of AAA Cinemas Hyderabad Gave Me The Absolute Best Cinema Experience Of My Entire Life","html":"<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_2073.jpg\" alt=\"Me standing at entry pointing towards EPIQ LUXON logo\" loading=\"lazy\" decoding=\"async\">\n<p>My trip from Chandigarh to Hyderabad in April 2026 was planned for exactly 3.5 days. My main goal was to watch the movie <i>Michael<\/i> and <i>The Mummy<\/i> at the AMB and Prasad's HDR by Barco screens and the Allu Cinema's Dolby Cinema screen. By that time, the movie <i>Dhurandhar: The Revenge<\/i> was already out for over 1 month. It had been 5 weeks since its release. Even though it was a massive hit, it was removed from all the big premium screens. It was gone from Dolby Cinema, gone from HDR by Barco, and gone from all IMAX screens outside of Hyderabad.<\/p>\n<p>But by pure chance, there was still 1 show left on a premium screen. That screen was the EPIQ Luxon at AAA Cinemas. What happened there became the greatest cinema experience I have ever had.<\/p>\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_1970.jpeg\" alt=\"Auditorium taken from the front 1\" loading=\"lazy\" decoding=\"async\">\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_1956.jpeg\" alt=\"Auditorium taken from the front 2\" loading=\"lazy\" decoding=\"async\">\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_1958.jpeg\" alt=\"Auditorium taken from the front 3\" loading=\"lazy\" decoding=\"async\">\n<h3>The Magic of LED Cinema Screens<\/h3>\n<p>The EPIQ Luxon screen is very different from normal cinemas. It does not use a projector and a normal white screen. Instead, it uses a big LED panel. It is 10 meters wide. It has a flat aspect ratio of 1.90:1, and its resolution is 4096 by 2160. These screens are very rare in India. There are only about 5 of them in the whole country. Apart from this EPIQ Luxon in Hyderabad, there is Swagath Onyx in Bengaluru, another ONYX as an INOX Dine-in venue at M5 Ecity Mall in Bengaluru, 1 Onyx in Mumbai, and 1 Onyx in Delhi.<\/p>\n<p>The biggest benefit of this LED technology is the picture quality and brightness. The pixels do not turn off individually. However, the dimming zones are so precise that it acts almost exactly like pixels turning off. This creates pitch-black darkness and infinite contrast. Not even Dolby Cinema or HDR by Barco can match this level of contrast because they still use projectors.<\/p>\n<p>I had seen LED screens before. My first time was watching the dark movie <i>Nosferatu<\/i> in 4K at the Delhi Onyx. I was very impressed. Then I saw a small sample of <i>Pushpa 2<\/i> and was amazed by the colors, brightness, and sharpness. After that, I saw the full 4K print of <i>Ramayana<\/i> on an LED screen. I kept saying for days that IMAX was nothing compared to it.<\/p>\n<p>However, those older Onyx screens had many problems. The sound was just normal 7.1 sound, not Dolby Atmos. The speakers were average quality with no clarity and zero bass. There were no height speakers. The seating was not steep. You had to look up at a bad angle, and the seats were just average. They also could not play HDR content. This is because they do not have mastering facilities, the staff is not very technically aware, and they do not get HDR content or the license for it. EPIQ Luxon fixed every single one of these problems.<\/p>\n<p>The seating here is nicely steep, heads will never block your view. You don't need to look up even if you are sitting in the 5th row. The seats themselves are decently plush and comfortable.<\/p>\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_1966.jpeg\" alt=\"Auditorium midways sideways showing steepness\" loading=\"lazy\" decoding=\"async\">\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_1973.jpeg\" alt=\"Close up of seating\" loading=\"lazy\" decoding=\"async\">\n<h3>The Secret HDR Playback<\/h3>\n<p>The team at EPIQ is amazing. They master their own Digital Cinema Packages or DCPs whenever possible, especially for Indian movies, to provide the best HDR content. The most special detail, which I did not know at first, is that the HDR by Barco format is 100 percent compatible with the EPIQ Luxon LED screen.<\/p>\n<p>Sometimes there are licensing issues. Big studios like Warner Bros and Universal do not give licenses to play Barco HDR files on LED screens because they want to protect the director's intent. Barco HDR is a special proprietary format made for projectors. But sometimes EPIQ gets permission, like they did for <i>Project Hail Mary<\/i>, and it looked wonderful.<\/p>\n<p>For <i>Dhurandhar: The Revenge<\/i>, they were actually playing the Barco HDR DCP. This was the exact same file mastered for Prasad's and AMB cinemas. They did not label it on the BookMyShow app to avoid any legal or licensing troubles, even though they were running it with permission. Because it was hidden, I had no idea.<\/p>\n<p>My friend Rohith Kumar told me they were playing the HDR by Barco DCP. I completely refused to believe him. He tried to convince me 3 or 4 times. Finally, he got solid proof from the cinema's programming team. Only then did I believe him.<\/p>\n<h3>First Impressions and Mind-Blowing Picture Quality<\/h3>\n<p>I sat in the 5th row, which is the J row, because I wanted to closely experience the picture quality. From the 5th row, it is very easy to see if a movie is 2K or 4K. As soon as the movie started and the text appeared on the screen, there was no doubt. It was a true 4K DCP.<\/p>\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_2045.jpeg\" alt=\"Dhurandhar playing while the entire auditorium is visible\" loading=\"lazy\" decoding=\"async\">\n<p>I had previously seen movies from the 4th row at PXL Mohali. I remember how the text there looked blurry and low-resolution. But here, the text was hyper-sharp. Because the screen had infinite contrast, the background was at a perfect zero nits of brightness. The white text was so bright and its edges were so sharp that it looked like someone had physically pasted a sticker on the screen. It was that realistic.<\/p>\n<p>Then the first scene opened. It was a scene where Ranveer Singh stands with his family to take a photo. My condition instantly worsened in a good way. My breath stopped. I could not breathe properly. I did not say much because I was speechless. I just made sounds of amazement like \"Oooooh teri... sssssss. Awwwww\" and \"Arey baap re\". I started laughing and muttering to myself. I lost all control of my senses and felt like I had gone crazy. I love picture quality, high bitrates, and HDR. So seeing this level of detail, camera grain, and perfect colors was like finding pure gold for a person like me.<\/p>\n<p>The camera used for this movie was the ARRI Alexa 35. It is a top-tier camera with better image quality and dynamic range than the IMAX-certified ARRI Alexa LF. They also used anamorphic lenses. This means they used almost the full image sensor area. Because of the style in which the movie was shot, it was not possible for every shot to look equally sharp. Some portions were soft because of the stylistic lens choice. But there were many shots that were completely in focus. Whenever the shots in focus came, the sharpness was incredible. Even when parts were not in focus, the picture quality had a very high-fidelity texture utilizing the 4K resolution and high bitrate very nicely.<\/p>\n<h3>The True Power of High Bitrate<\/h3>\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_2058.jpeg\" alt=\"Dhurandhar content playing on screen 1\" loading=\"lazy\" decoding=\"async\">\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_2011.jpeg\" alt=\"Dhurandhar content playing on screen 2\" loading=\"lazy\" decoding=\"async\">\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_1989.jpeg\" alt=\"Dhurandhar content playing on screen 3\" loading=\"lazy\" decoding=\"async\">\n<p>One of the most important things for picture quality is the bitrate. Bitrate means how much data is given to the image. A normal 2K DCP for <i>Dhurandhar: The Revenge<\/i> playing across India was only 122 Mbps. But the file I was watching was a massive 880 GB file with a bitrate of 500 Mbps.<\/p>\n<p>To help you understand how crazy this is, here is a simple breakdown of the sizes without using complicated tables:<\/p>\n<ul>\n<li>A 4K HDR Blu-ray has an average bitrate of about 80 Mbps. This equals 10 Megabytes per second. This means each frame is around 400 Kilobytes.<\/li>\n<li>An IMAX Quality movie has an average bitrate of about 250 Mbps. This equals 31.25 Megabytes per second. This means each frame is around 1.3 Megabytes.<\/li>\n<li>The EPIQ Luxon file for this movie had an overall compressed average bitrate of 470 Mbps. This equals 58.75 Megabytes per second. This means every single frame of this movie was 2.44 Megabytes on average.<\/li>\n<\/ul>\n<p>Please note that we are talking about overall average bitrates. Some frames can go even much higher in size, and some can go low if the frame does not need it. For this 880 GB version, we can assume some frames could be even 4 Megabytes or higher during high detail scenes.<\/p>\n<p>That is a very high-quality image, almost equal to lossless quality. Because the frames change at 24 frames per second, it is impossible for a human eye to tell the difference between this and the raw uncompressed camera file. I was watching the movie in the exact same quality that the camera originally captured.<\/p>\n<p>The screen also played at an amazing brightness. Normal cinemas are recommended to target 48 nits of brightness, but they usually only manage 30 to 35 nits. This EPIQ Luxon screen had a peak brightness of 300 nits. Seeing bright specular highlights at 300 nits alongside pitch-black shadows creates the ultimate HDR experience.<\/p>\n<h3>Perfect Studio-Grade Sound<\/h3>\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_1974.jpeg\" alt=\"Surround speakers\" loading=\"lazy\" decoding=\"async\">\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_1976.jpeg\" alt=\"Surround subwoofer\" loading=\"lazy\" decoding=\"async\">\n<p>The picture quality was only half of the magic. The sound was a perfectly tuned Dolby Atmos system. They used the maximum premium speakers (all are Dolby's own SLS branded speakers), and everything was aligned perfectly. The bass was incredibly strong but also very clean and tight.<\/p>\n<p>When bass is bad, it sounds boomy and echoes. Some frequencies sound too loud while others are muted. Here, every bass frequency was perfect. It felt like sitting in a high-quality audio studio or listening through very expensive headphones. Out of all the cinemas I have visited, only the Dolby Cinema in Pune came close to this. I experienced very tight and perfect bass in Pune during an F1 screening and some scenes of <i>Dune<\/i>. EPIQ Luxon managed to replicate that exact same expensive sound experience.<\/p>\n<p>Even though I was sitting very close to the screen in the 5th row, the Dolby Atmos height effects were ultra-clear. The sound objects moved perfectly around and above me. It was not a static sound mix. The movie makers designed the sound to move, and the auditorium translated it flawlessly.<\/p>\n<p>There are subwoofers in the surround also. And even they are very powerful. So bass is not just coming from the front, but also attacking you from all around you.<\/p>\n<h3>My Extreme Emotional Reactions<\/h3>\n<p>When I combine the best audio experience of my life with the best picture quality of my life, the result was pure heaven. During the \"Aari Aari\" song and action scene featuring Ranveer Singh, I reached a level of pure joy. It felt almost like a combination of an orgasm and deep emotion happening at the same time. I was so happy that I could not catch my breath. My breathing became heavy, my heart started beating very fast, and I started crying. My voice cracked. Tears literally came to my eyes, and drops of tears finally fell from my eyes.<\/p>\n<p>Later in the movie, there was a song titled \"Didi\". That scene showed dry mountain valleys, stones, and a large crowd of people. The visual details were so high in that scene that I got emotional and cried all over again.<\/p>\n<p>I kept thanking God again and again. I realized that the show I was watching on that Thursday was the absolute last show of the movie in Barco HDR at EPIQ Luxon. It was not going to play the next day. I felt like I was experiencing a piece of history. I knew that whenever this movie comes on TV, OTT, or Blu-ray, the quality will never match what I was seeing. The people of the world watched it in 2K. Some lucky ones saw it in IMAX, Dolby Cinema, or Barco HDR projectors. But I was watching the absolute highest bitrate print in the world on one of the best picture quality cinema technologies in the world.<\/p>\n<p>When the interval happened, my emotions were completely overflowing. I turned to my friend Rohith and praised him endlessly. I told him I was so thankful. I told him I would do whatever he asks. I said I would give my life for him. I even told him he was above God for me at that moment. I know I said crazy things, but I was just so emotional. I had to admit that I only got this experience because Rohith pushed me to believe him.<\/p>\n<h3>Unforgettable Scenes and Surprised Friends<\/h3>\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_1962.jpeg\" alt=\"Ultra wide shot of screen and auditorium from the back\" loading=\"lazy\" decoding=\"async\">\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_1977.jpeg\" alt=\"Wide shot of screen and auditorium from the back\" loading=\"lazy\" decoding=\"async\">\n<p>After the interval, my eyes were glued to the screen. I could not look away. The HDR really shined in specific moments. Whenever there was a bullet spark, a bursting firecracker, clouds in the background, a shiny light, a reflection on a car, a reflection on someone's glasses, or splashing water, the screen would shine beautifully. It was not just blindly bright all over. The overall brightness was normal, and only the shiny parts hit you with extreme brightness.<\/p>\n<p>Sometimes the brightness was so strong that it made people jump in their seats. My friend Chaturvedi ji was sitting on my left. Bad words came out of his mouth due to genuine excitement and shock. The same thing happened to my friend Rahul sitting on my side. He arrived a little late and originally said he had no interest in the movie. But once he sat down, he did not move an inch. Bad words also came out of his mouth due to pure shock and excitement. He admitted that the experience was totally worth it. Venkat Kishore was also with us, watching the movie with a huge smile on his face. We are all cinephiles, and we were all smiling and enjoying it deeply.<\/p>\n<p>Two specific scenes stood out the most:<\/p>\n<ul>\n<li><strong>The Fake Note Dealer Scene:<\/strong> The entire scene is red. There is a massive red light on the roof from a sign board, during rain. That scene looks exactly like the movie <i>The Batman<\/i>. Ranveer Singh kills the fake note dealer here. The contrast, the deep color red, and the blacks were the best part of that scene, along with extreme specular highlights.<\/li>\n<li><strong>The Last Dark Scene:<\/strong> Ranveer is walking on a dark road in the Margalla hills. A car comes and Jameel Jamali picks up Ranveer. It is a very dark scene. I remember IMAX and PXL Mohali failed to show it clearly. But here at EPIQ Luxon, I actually laughed out loud. It was a very dark scene exactly as the director intended, but every single detail was 100 percent visible. It was absolute perfection.<\/li>\n<\/ul>\n<h3>The Ambience, Transparency, and The AAA Brand<\/h3>\n<p>I must explain that AAA Cinemas stands for Asian Allu Arjun. This company is a collaboration between Asian Cinemas and Allu Arjun. AAA is located in the Ameerpet area. There is another cinema just called Allu Cinema located in Kokapet, which is only run by Allu Arjun, but this one is different.<\/p>\n<p>This cinema is a hidden gem. People always praise bigger cinemas. Yes, big screens like PCX Screen 6, Dolby Cinema with its 75-foot screen, and IMAX have their own charm because of the huge field of view. But EPIQ Luxon leaves them far behind in picture quality. If you look back at the second-best screen in the race for picture quality, it is so far behind that you cannot even see it.<\/p>\n<p>The AAA Cinemas team is also very honest. They are one of the most transparent cinema companies in India. The manager told me they want people to know exactly what technology they are paying for. Outside every auditorium, they put clear logos showing if it is a projector or LED, if it is 4K, and exactly which company made the speakers.<\/p>\n<p>The cinema has a very good lobby area. Instead of the royal or luxury theme of PVR, they use a modern black theme design which is unique and minimalist. It looks very cool. The food is also great and cheap. I ate a white sauce pasta there, and it was delicious. The staff is extremely polite and helpful.<\/p>\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_2030.jpeg\" alt=\"White sauce pasta from AAA Cinemas\" loading=\"lazy\" decoding=\"async\">\n<p>The combination of the EPIQ brand and Asian Cinemas is incredible. EPIQ focuses heavily on perfect auditorium design and makes their own DCPs. They care about content. When you mix their auditorium design and content care with this LED technology, it creates an unbeatable experience.<\/p>\n<h3>The SDR Test with Michael<\/h3>\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_2304.jpeg\" alt=\"Michael playing on screen 1\" loading=\"lazy\" decoding=\"async\">\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_2302.jpeg\" alt=\"Michael playing on screen 2\" loading=\"lazy\" decoding=\"async\">\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_2311.jpeg\" alt=\"Michael playing on screen 3\" loading=\"lazy\" decoding=\"async\">\n<p>A day after watching <i>Dhurandhar: The Revenge<\/i>, I went back to watch the movie <i>Michael<\/i>. Because it was a Warner Bros movie, they did not get permission to play the Barco HDR file. They had to play the normal SDR version.<\/p>\n<p>Even in SDR, the LED screen defeated everything else. An SDR movie on this LED screen looks better, sharper, and has better contrast than the HDR versions playing on Dolby Cinema or Barco HDR projectors. The technology itself is just supreme. If you ever get a chance to watch a movie here, just go. Do not worry if it is HDR or SDR. Both will look incredible.<\/p>\n<h3>The Only Small Flaw<\/h3>\n<p>There are no dead pixels, no lines, and no screen imperfections at all. However, there is 1 tiny flaw. The bass is so incredibly strong that it shakes the actual physical frame around/behind the scren.<\/p>\n<p>During heavy bass moments in <i>Dhurandhar: The Revenge<\/i>, the left side of the frame where probably the speakers/subwoofers are hung, started to vibrate. The speakers themselves do not distort, but the extreme power makes the metal frame rattle. It causes a slight rattling noise. For comparison, if you've tried a strong bass subwoofer in your home, when the bass is strong, it can rattle your windows and doors. Something similar happens here, the frame simply cannot handle the power. That is the only minor issue.<\/p>\n<p>Unlike projector screens, LED panels are not acoustically transparent. So it is not possible to place stage speakers behind the screen. Therefore, stage speakers are placed on the sides and bottom of the screen. Due to that, it is not possible to make the viewing experience wall to wall and edge to edge. There is always some space (around 1.5 feet) between screen and walls/floor/ceiling. This can look unpleasant to those who love immersive experiences. But honestly, once lights are off, due to extreme contrast, it's not noticeable.<\/p>\n<h3>An Experience of a Century<\/h3>\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_2070.jpeg\" alt=\"Dhurandhar playing during last credits with light on 1\" loading=\"lazy\" decoding=\"async\">\n<img src=\"https://shreytyagi.com/articles/dhurandhar2inepiqluxonimages/IMG_2033.jpeg\" alt=\"Dhurandhar playing during last credits with light on 2\" loading=\"lazy\" decoding=\"async\">\n<p>I have watched movies on Onyx, ScreenX, and even documentaries on IMAX 15/70mm film formats. But this experience crossed every boundary. My expectations the first time watching this movie were very high, so I rated it a 4 out of 5. After seeing it a second time in IMAX, I raised it to 4.5. But watching it here in 4K HDR with studio-grade Dolby Atmos deserves an 8 or 9 out of 5. It breaks the normal rating scale.<\/p>\n<p>I want to say a huge thank you to the managers of the cinema, Jyesth Narang, the executive director of Asian Cinemas, the director Aditya Dhar for making such a movie, and the team at Prasad's Chennai who did the HDR grading and made this DCP. You have given me a core memory that I will keep alive until the day I die.<\/p>\n<p><i>Dhurandhar: The Revenge<\/i> is a movie that will be remembered by the world for centuries because of the global records it has broken. And I got to watch the highest quality DCP of this movie (in the world) in the highest quality cinema format in the world (that was playing this movie). Yes, what I experienced was the most ultimate supreme way to experience this movie, it cannot get any better than this in the entire world for this movie.<\/p>\n<p>My friend Anurag also watched the HDR version of <i>Baahubali: The Epic<\/i> on this exact screen. I had not told him about my feelings, but he told me he also became very emotional by the time his movie ended. This screen just does that to people who love cinema.<\/p>\n<p>I spent money to travel from Chandigarh to Hyderabad, stayed for exactly 3.5 days, and traveled back. But those 4 hours sitting inside the EPIQ Luxon screen completely recovered the cost and effort of my entire trip. Everything else on the trip was just a bonus. I am filled with deep gratitude, and I will never forget this.<\/p>\n<p><em>Disclaimer: I wrote this article and used AI assistance for grammar review, and improving sentence structure and clarity. The ideas, research, and viewpoints are my own.<\/em><\/p>","mins":15,"math":false},"articles/killingthefrictionbetweenimaginationandexecution":{"gallery":null,"title":"AI: Killing The Friction Between Imagination And Execution","html":"<p>\nEvery major technological leap in human history has first been criticized\nfor “making humans weaker.”\n<\/p>\n<p>\nWhen vehicles became common, people said humans had stopped walking long\ndistances and were losing fitness. But faster transportation connected\ncities, boosted trade, saved time, and accelerated civilization itself.\n<\/p>\n<p>\nThen came calculators. People feared that mental math skills would disappear\nbecause nobody would calculate by hand anymore. Yet calculators made\naccounting, engineering, science, and global commerce dramatically faster\nand more accurate.\n<\/p>\n<p>\nWhen television and radio became popular, people argued that humans had\nstopped reading newspapers and books, and that communication skills would\ndecline. But information suddenly became accessible to millions — even to\npeople who could not read. News spread faster than ever before.\n<\/p>\n<p>\nLater, when the internet arrived, people worried that libraries would\nbecome irrelevant. Instead of reading one book in one building, humans\nsuddenly gained access to knowledge from across the world within seconds.\nThe internet did not reduce human knowledge — it multiplied humanity’s\naccess to it.\n<\/p>\n<p>\nNow the same fear is being repeated with AI.\n<\/p>\n<p>\nPeople say AI is reducing creativity, critical thinking, writing ability,\nart skills, and manual effort. But history shows that tools do not destroy\nhuman capability — they shift human focus toward higher-level thinking.\n<\/p>\n<p>\nIf someone wants to visualize an idea, the real goal is not spending ten\nhours drawing it manually. The real goal is to see the idea, analyze it,\nimprove it, and use it. AI allows humans to reach that stage instantly.\n<\/p>\n<p>\nIf a team has a brilliant business idea, the objective is not wasting weeks\nformatting documents or presentations. The real objective is communicating\nthe idea clearly to the customer. AI can generate the first draft in\nminutes, while humans focus on strategy, improvement, and decision-making.\n<\/p>\n<p>Similarly:<\/p>\n<ul>\n<li>\nScientists can test thousands of possibilities faster instead of spending\nyears doing repetitive calculations.\n<\/li>\n<li>\nFilmmakers can visualize scenes instantly instead of waiting weeks for\nrough concepts.\n<\/li>\n<li>\nArchitects can generate multiple building designs in minutes and focus\nmore on practicality and innovation.\n<\/li>\n<li>\nDoctors can analyze massive medical datasets faster and identify patterns\nhumans may miss.\n<\/li>\n<li>\nStudents can learn complex topics interactively instead of struggling\nalone for hours.\n<\/li>\n<\/ul>\n<p>\nAI is not replacing human imagination. It is removing friction between\nimagination and execution.\n<\/p>\n<p>\nHumans still decide the vision, the purpose, the ethics, the taste, the\ndirection, and the final judgment. AI simply becomes a powerful extension\nof human capability — just like vehicles extended movement, calculators\nextended calculation, and the internet extended access to knowledge.\n<\/p>\n<p>\nEvery revolutionary technology initially looks dangerous because it changes\nold skills and old systems. But over time, humanity adapts and evolves\naround it.\n<\/p>\n<p>\nAI is not the end of human intelligence. It may become one of the biggest\naccelerators of human evolution ever created — a tool that allows humanity\nto solve problems, create ideas, and achieve things at a speed that earlier\ngenerations could not even imagine.\n<\/p>\n<p>\nThe invention of AI may ultimately hold the same significance for humanity\nas the discovery of fire and the invention of the wheel.\n<\/p>\n<p><em>Disclaimer: I wrote this article and used AI assistance for grammar review, and improving sentence structure and clarity. The ideas, research, and viewpoints are my own.<\/em><\/p>","mins":2,"math":false},"articles/3dexplained":{"gallery":null,"title":"3D Cinema Explained In The Simplest Way Possible","html":"<p>A normal movie screen is flat.<\/p>\n<p>It has height and width. But 3D cinema tries to add something extra: <strong>DEPTH<\/strong>.<\/p>\n<p>It makes the world feel like it is not only sitting on the screen, but sometimes stretching behind it, and sometimes even coming slightly toward you.<\/p>\n<h3>The Whole Trick Began With Our Eyes<\/h3>\n<p>Your left eye and right eye are not in the exact same position. They sit a few centimetres apart, so each eye sees the world from a slightly different angle. Your brain takes both views and joins them into one image.<\/p>\n<p>That tiny difference between the two eye views helps your brain understand distance.<\/p>\n<p>3D movies copy that natural trick.<\/p>\n<p>Instead of showing only one image, a 3D movie shows two versions of the same shot: one for your <strong>LEFT EYE<\/strong> and one for your <strong>RIGHT EYE<\/strong>.<\/p>\n<p>The 3D glasses are not \"creating\" the 3D by themselves. The glasses are just a filter. Their job is to make sure the left-eye image goes only to your left eye, and the right-eye image goes only to your right eye.<\/p>\n<p>Then your brain combines both images and creates the feeling of depth.<\/p>\n<p>That is why, if you remove 3D glasses during a 3D movie, the image often looks blurry or double. You are seeing both eye images at the same time without separation.<\/p>\n<h3>3D Animation and 3D Cinema Are Not the Same Thing<\/h3>\n<p>This is one of the most common misunderstandings.<\/p>\n<p>A CGI character can be made in 3D software, but the movie can still be shown as normal 2D.<\/p>\n<p>That is different from stereoscopic 3D cinema.<\/p>\n<p>Stereoscopic 3D means the theatre is actually giving separate images to both eyes. It is not just about whether the movie was made using computer graphics. It is about how the final image is shown to the audience.<\/p>\n<ul>\n<li>A fully animated film can be shown in 2D.<\/li>\n<li>A live-action film can be shown in 3D.<\/li>\n<\/ul>\n<p>The key is not the animation style. The key is whether your left eye and right eye are receiving slightly different images.<\/p>\n<h3>How 3D Glasses Work<\/h3>\n<p>There are different types of 3D glasses.<\/p>\n<p>Old red-blue glasses were called anaglyph 3D. They separated the two images using colour. The effect worked, but the colour quality was weak.<\/p>\n<p>Modern cinema 3D usually uses polarized glasses or advanced filtering systems. Some systems separate the direction of light. Dolby 3D uses colour separation. Active shutter 3D works differently: the glasses rapidly open and close each lens in sync with the screen.<\/p>\n<p>But the main idea is always the same:<\/p>\n<ul>\n<li>Two eyes.<\/li>\n<li>Two slightly different images.<\/li>\n<li>The brain combines them.<\/li>\n<li>Depth is created.<\/li>\n<\/ul>\n<p>That is 3D cinema in its simplest form.<\/p>\n<h3>Good 3D Is Not Just “Things Flying Into Your Face”<\/h3>\n<p>The biggest misunderstanding about 3D is that it is only about pop-out moments.<\/p>\n<ul>\n<li>A sword coming out of the screen.<\/li>\n<li>A bullet flying toward the audience.<\/li>\n<li>Water drops, debris, hands, creatures, arrows, or explosions jumping forward.<\/li>\n<\/ul>\n<p>These moments can be fun, but they are only one part of 3D. Good 3D is not just about throwing objects at your face.<\/p>\n<p>There are three simple depth zones in 3D cinema:<\/p>\n<ol>\n<li><strong>On the screen<\/strong> — the normal flat screen position.<\/li>\n<li><strong>Behind the screen<\/strong> — the image feels like a window into a deeper world.<\/li>\n<li><strong>In front of the screen<\/strong> — objects feel like they are coming toward the audience.<\/li>\n<\/ol>\n<p>The \"front of screen\" effect is what most people remember because it is flashy. But if a movie uses too much of it, the experience can become tiring.<\/p>\n<p>Real premium 3D is usually about layers.<\/p>\n<ul>\n<li>Foreground.<\/li>\n<li>Middle ground.<\/li>\n<li>Background.<\/li>\n<\/ul>\n<p>A good 3D image should feel like a real space, not like cardboard cutouts placed at different distances.<\/p>\n<p>You should feel volume inside the world.<\/p>\n<p>That is why some 3D movies feel magical. They are not just throwing things at you. They are building a world with depth.<\/p>\n<p>You feel like you are looking through a window into another place.<\/p>\n<h3>Native 3D vs Converted 3D<\/h3>\n<p>There are two major ways to make a 3D movie.<\/p>\n<p>The first is <strong>native 3D<\/strong>. Native 3D means the movie was captured or rendered using two cameras or two virtual camera views, similar to two human eyes.<\/p>\n<p>The second is <strong>converted 3D<\/strong>. Converted 3D means the movie was originally made in 2D, and artists later create depth in post-production. They separate objects, make depth maps, and build a second-eye view.<\/p>\n<p>Many people think native 3D is always good and converted 3D is always bad. That is not fully true.<\/p>\n<p>Bad native 3D can still be uncomfortable if the cameras are not aligned properly. Good converted 3D can look excellent if the artists have enough time, budget, and creative control.<\/p>\n<p>So the real question is not only: \"Was it native or converted?\"<\/p>\n<p>The real question is: <strong>Was the 3D designed carefully?<\/strong><\/p>\n<h3>Why Bad 3D Feels Bad<\/h3>\n<p>Bad 3D usually fails because of simple things.<\/p>\n<ul>\n<li>The picture may be too dark.<\/li>\n<li>The glasses may be dirty or low quality.<\/li>\n<li>The theatre calibration may be weak.<\/li>\n<li>Too much depth may be pushed at once.<\/li>\n<li>Fast cuts may keep jumping depth suddenly.<\/li>\n<li>The left-eye and right-eye images may not match properly.<\/li>\n<\/ul>\n<p>A rushed conversion can make everything look like flat layers instead of real space. This is why the same 3D movie can look amazing in one theatre and dull in another.<\/p>\n<p>3D is not only about the movie file. It is also about projection, screen quality, brightness, calibration, glasses, and even where you sit.<\/p>\n<h3>Why Some People Get Headaches From 3D<\/h3>\n<p>In real life, your eyes focus on a real object and also point toward that same object.<\/p>\n<p>But in cinema 3D, your eyes are physically focusing on the flat screen, while the 3D effect asks your eyes to point as if objects are in front of or behind that screen.<\/p>\n<p>A small amount of this is fine. Too much of it becomes uncomfortable.<\/p>\n<p>That is why good 3D has a \"depth budget.\" The intention behind having a depth budget in stereo conversion is not directly to control the 3D depth, but more related to the effort required in shifting the pixels. Depth budget decides how much maximum will the images/pixels be shifted in an image for depth creation. Shifting more pixels needs more painting (digitally, like content aware fill) of the empty area… hence more effort in creating those extra details. So higher depth budget means you can shift more pixels and you can have higher depth due to that. Low depth budget means easy job for the artists, but lower 3D depth. Filmmakers cannot just make everything extremely deep. They have to control how much depth the audience’s eyes can comfortably handle.<\/p>\n<p>Good 3D should feel immersive. It should not feel like your eyes are doing a workout.<\/p>\n<h3>Brightness Matters More Than People Think<\/h3>\n<p>Another big issue with 3D is brightness.<\/p>\n<p>3D often looks darker than 2D because the glasses and projection system split or filter light. Your eyes are not receiving the full brightness of a normal 2D show.<\/p>\n<p>So a bright projector, a good screen, proper calibration, and clean glasses matter a lot. This is one reason why theatre quality matters so much for 3D.<\/p>\n<p>A good 3D presentation can look beautiful, sharp, and immersive. A bad 3D presentation can look dull, dark, and flat.<\/p>\n<p>Same movie. Different theatre. Completely different experience.<\/p>\n<h3>Your Seat Also Changes the 3D Experience<\/h3>\n<p>Where you sit can affect how 3D feels.<\/p>\n<ul>\n<li>If you sit too close, your eyes may struggle with the depth.<\/li>\n<li>If you sit too far, the 3D impact may become weaker.<\/li>\n<\/ul>\n<p>Usually, a centre seat at a balanced distance gives the cleanest 3D experience. Not too close. Not too far. Centred to the screen.<\/p>\n<p>That is usually the safest position for a comfortable and strong 3D show.<\/p>\n<h3>3D Is Not Automatically a Gimmick<\/h3>\n<p>At the end of the day, 3D is not automatically a gimmick. It becomes a gimmick when it is used lazily.<\/p>\n<p>But when it is planned properly, 3D is a filmmaking language. Just like sound design is not only loud explosions, 3D is not only pop-out moments.<\/p>\n<ul>\n<li>It can guide your attention.<\/li>\n<li>It can create scale.<\/li>\n<li>It can make worlds feel bigger.<\/li>\n<li>It can make action clearer.<\/li>\n<li>It can make fantasy, animation, and sci-fi feel more immersive.<\/li>\n<\/ul>\n<p>The simplest explanation is this:<\/p>\n<ul>\n<li>2D shows you one picture.<\/li>\n<li>3D gives each eye a slightly different picture.<\/li>\n<li>Your brain joins them.<\/li>\n<li>That difference creates depth.<\/li>\n<\/ul>\n<p>Great 3D means depth with purpose. Bad 3D means depth without care.<\/p>\n<p>That is why not every 3D movie is worth the premium ticket. But when 3D is designed, converted, graded, projected, and watched properly, it can still be one of the most magical cinema experiences possible. 👓🎬<\/p>\n<h3>Technical Grounding<\/h3>\n<ul>\n<li>Stereoscopic 3D works by giving the left and right eyes slightly different images, which the brain fuses into a single image with depth.<\/li>\n<li>Parallax controls whether objects feel like they are on the screen, behind the screen, or in front of the screen.<\/li>\n<li>Polarized and filtered 3D glasses separate the two eye images, which is why the picture looks doubled without glasses.<\/li>\n<li>Excessive depth can cause discomfort because the eyes are still focusing on the flat cinema screen while the 3D effect asks them to converge as if objects are at different distances.<\/li>\n<li>Brightness also matters because 3D glasses and projection systems reduce the amount of light reaching the viewer’s eyes, which is why proper theatre calibration is extremely important.<\/li>\n<\/ul>\n<p><i>THANK YOU Aniket Bhosale for your 3D knowledge<\/i><\/p>","mins":7,"math":false},"articles/x265encodingexplained":{"gallery":null,"title":"Mastering Archival Encoding: x265, Dolby Vision, and the Power of Apple Silicon","html":"<img src=\"https://shreytyagi.com/articles/encoding_masterclass/IMG_COVER.jpg\" alt=\"Mac Studio Terminal running x265 encode\" loading=\"lazy\" decoding=\"async\">\n<p>In the world of high-fidelity video engineering, preserving the absolute raw quality of a camera sensor while keeping file sizes manageable is the ultimate pursuit. Whether capturing vlogs on an iPhone 17 Pro in Dolby Vision or archiving cinematic masters, the tools we use dictate the legacy of the footage.<\/p>\n<h3>The Great Debate: Hardware vs. Software Encoding<\/h3>\n<p>Today, everyone loves hardware encoders. Apple's VideoToolbox, Nvidia's NVENC, and Intel's QuickSync are blisteringly fast. They can chew through 4K video faster than real-time. But speed comes at a heavy cost: <strong>Efficiency and Precision.<\/strong><\/p>\n<p>Hardware encoders are rigidly hardcoded into the silicon. They use massive bitrates to brute-force video quality, and they completely lack the deep, granular mathematical tools required for pristine HDR shadow preservation. For true archival quality—where every microscopic film grain and specular highlight matters—we must abandon the GPU and return to the CPU. <strong>x265<\/strong> is the absolute king of software encoding. It is mathematically exhaustive, perfectly compliant, and capable of achieving transparent cinematic quality at incredibly low file sizes.<\/p>\n<hr>\n<p class=\"aside\">The interactive encoding generator from this article isn’t rebuilt in this prototype. <a href=\"https://shreytyagi.com/articles/x265encodingexplained.html\" target=\"_blank\" rel=\"noopener\">Open it on shreytyagi.com ↗<\/a><\/p>","mins":1,"math":false},"articles/youtube_av1_encoding":{"gallery":null,"title":"Why YouTube's 4K AV1 HDR Streams Surpass Apple TV+ and Netflix: Codec Math, Bitrate Evolution & Real-World Analysis","html":"<img src=\"assets/articles-youtube_av1_encoding-01-096bac.png\" alt=\"YouTube 4K AV1 HDR Stream Bitrate Graph peaking at 166,510 kbps\" loading=\"lazy\" decoding=\"async\">\n<p>There is a widespread belief in the video streaming community that YouTube aggressively starves its 4K videos of bitrate compared to paid subscription platforms like <i>Apple TV+<\/i> and <i>Netflix<\/i>. While that is often true for standard 8-bit SDR uploads, YouTube treats 4K 10-bit HDR content in a completely different way. When delivering 4K 30fps HDR videos through its hardware-accelerated AV1 10-bit pipeline (<i>av01 Main@L5.0<\/i>, itag 701), YouTube regularly allocates average bitrates around 25 to 27.7 Mbps, with peak bitrates surging past 60 to 77 Mbps—and even hitting 166.51 Mbps during complex frames.<\/p>\n<p>When you combine those massive raw bitrates with the superior compression efficiency of the AV1 codec over HEVC and VP9.2, YouTube's 4K HDR streams comfortably surpass the 4K HDR video quality of both Apple TV+ and Netflix. In this article, I will break down the exact percentage improvements from one codec to another for both PQ and HLG HDR formats, trace how YouTube evolved its AV1 rollout and boosted its encoding bitrates over time, and prove it using actual MediaInfo logs and packet-level bitrate graphs from 15 videos on my YouTube channel.<\/p>\n<h3>The Benchmark Setup: Comparing VP9.2, HEVC, and AV1 at 25 Mbps Average and 70 Mbps Peak<\/h3>\n<p>To make a fair, apples-to-apples comparison, let us start with a representative benchmark specification: a <strong>4K HDR (3840 by 2160) 30fps, 10-bit 4:2:0<\/strong> video compressed using Variable Bitrate (VBR) that <strong>averages around 25 Mbps<\/strong> and <strong>peaks around 70 Mbps<\/strong>. The three codecs in consideration are <strong>VP9.2<\/strong> (VP9 Profile 2, 10-bit), <strong>HEVC<\/strong> (Main 10, 10-bit), and <strong>AV1<\/strong> (Main Profile, 10-bit).<\/p>\n<p>At 25 Mbps for 4K 30fps (which equals roughly 0.100 bits per pixel per frame on average, spiking to 0.281 bits per pixel at 70 Mbps), all three codecs are already operating high on the quality curve near visual transparency. Because of this, we must look at two distinct metrics:<\/p>\n<ul>\n<li><strong>Perceptual Visual Quality Gain at a Fixed 25 Mbps Average / 70 Mbps Peak:<\/strong> How much cleaner the image actually looks to the human eye at this exact bitrate—specifically in retaining fine film grain, dark shadow gradations, and fast-moving textures without macroblocking or color banding.<\/li>\n<li><strong>Raw Coding Efficiency (BD-Rate / Effective Bitrate Value):<\/strong> How much more compression efficiency each codec extracts per megabit, or how high the bitrate of an older codec would need to be to match the exact visual fidelity of the newer codec.<\/li>\n<\/ul>\n<p>Furthermore, HDR does not mean PQ only. We must evaluate both <strong>PQ (SMPTE ST 2084 / HDR10)<\/strong> and <strong>HLG (ARIB STD-B67)<\/strong> because they distribute 10-bit codewords very differently:<\/p>\n<ul>\n<li><strong>PQ (SMPTE ST 2084):<\/strong> PQ is an absolute, display-referred logarithmic curve mapped all the way up to 10,000 nits. For a standard 1,000-nit master, roughly 25 percent of the top 10-bit codewords go completely unused, squeezing shadows and midtones into a steep non-linear curve. Because older encoders like VP9.2 lack advanced PQ-aware luma adaptive quantization compared to HEVC and AV1, VP9.2 suffers a larger quality penalty on PQ content.<\/li>\n<li><strong>HLG (ARIB STD-B67):<\/strong> HLG is a relative, scene-referred hybrid curve that uses a standard gamma curve in the bottom 50 percent of the signal (shadows and midtones) and a logarithmic curve in the top 50 percent (highlights), utilizing the full 10-bit codeword range. Because HLG's lower half behaves like traditional SDR gamma, VP9.2 handles dark gradients better on HLG than on PQ, narrowing the gap slightly, while HEVC and AV1 still hold a strong lead in the compressed logarithmic upper-half highlights and fine textures.<\/li>\n<\/ul>\n<p>Taking the lowest quality codec first as <strong>A (VP9.2)<\/strong>, the middle codec as <strong>B (HEVC)<\/strong>, and the best codec as <strong>C (AV1)<\/strong>, here is the step-by-step percentage improvement:<\/p>\n<ul>\n<li><strong>PQ Visual Quality (@ 25/70 Mbps):<\/strong> HEVC (B) is <strong>+6.5%<\/strong> over VP9.2 (A). AV1 (C) is <strong>+13.0%<\/strong> over VP9.2 (A) and <strong>+6.1%<\/strong> over HEVC (B).<\/li>\n<li><strong>HLG Visual Quality (@ 25/70 Mbps):<\/strong> HEVC (B) is <strong>+5.0%<\/strong> over VP9.2 (A). AV1 (C) is <strong>+10.5%<\/strong> over VP9.2 (A) and <strong>+5.2%<\/strong> over HEVC (B).<\/li>\n<li><strong>PQ Coding Efficiency (BD-Rate):<\/strong> HEVC (B) is <strong>+11.0%<\/strong> over VP9.2 (A). AV1 (C) is <strong>+36.0%<\/strong> over VP9.2 (A) and <strong>+22.5%<\/strong> over HEVC (B).<\/li>\n<li><strong>HLG Coding Efficiency (BD-Rate):<\/strong> HEVC (B) is <strong>+9.0%<\/strong> over VP9.2 (A). AV1 (C) is <strong>+32.0%<\/strong> over VP9.2 (A) and <strong>+21.1%<\/strong> over HEVC (B).<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Comparison<\/th>\n<th>PQ Visual<\/th>\n<th>HLG Visual<\/th>\n<th>PQ BD-Rate<\/th>\n<th>HLG BD-Rate<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>A: VP9.2<\/strong><\/td>\n<td>0% (Base)<\/td>\n<td>0% (Base)<\/td>\n<td>0% (Base)<\/td>\n<td>0% (Base)<\/td>\n<\/tr>\n<tr>\n<td><strong>B (HEVC) vs A<\/strong><\/td>\n<td><strong>+6.5%<\/strong><\/td>\n<td><strong>+5.0%<\/strong><\/td>\n<td><strong>+11.0%<\/strong><\/td>\n<td><strong>+9.0%<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>C (AV1) vs A<\/strong><\/td>\n<td><strong>+13.0%<\/strong><\/td>\n<td><strong>+10.5%<\/strong><\/td>\n<td><strong>+36.0%<\/strong><\/td>\n<td><strong>+32.0%<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>C (AV1) vs B<\/strong><\/td>\n<td><strong>+6.1%<\/strong><\/td>\n<td><strong>+5.2%<\/strong><\/td>\n<td><strong>+22.5%<\/strong><\/td>\n<td><strong>+21.1%<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>In practical megabits, because AV1 is <strong>21.1% more efficient than HEVC<\/strong> and <strong>32.0% more efficient than VP9.2<\/strong> for 4K 30fps HLG content, a 25.00 Mbps average / 70.00 Mbps peak AV1 HLG stream packs the exact same visual density as a <strong>30.28 Mbps average / 84.77 Mbps peak HEVC stream<\/strong>, or a <strong>33.00 Mbps average / 92.40 Mbps peak VP9.2 stream<\/strong>.<\/p>\n<h3>How YouTube's AV1 Rollout and Bitrate Allocation Improved Over Time<\/h3>\n<p>One crucial detail I noticed while inspecting the MediaInfo logs of my own videos is that YouTube's AV1 encoding strategy has changed dramatically over the years—both in terms of <i>which videos receive an AV1 encode<\/i> and <i>how much bitrate YouTube gives them<\/i>.<\/p>\n<p>Historically, YouTube rolled out AV1 in four distinct stages:<\/p>\n<ul>\n<li><strong>Stage 1 (Initial Testing &amp; Ultra-High Views Only):<\/strong> In the beginning, AV1 encoding was strictly reserved for internal testing playlists and a tiny handful of videos with massive view counts.<\/li>\n<li><strong>Stage 2 (General Rollout for High-View Videos):<\/strong> Next, YouTube opened AV1 encoding across the platform, but because software AV1 encoding was computationally expensive, only videos that crossed a high view-count threshold received AV1 streams.<\/li>\n<li><strong>Stage 3 (Mandatory AV1 for All 8K Videos):<\/strong> As 8K TVs and modern GPUs adopted hardware AV1 decoding, YouTube started generating AV1 encodes for all 8K videos by default, regardless of views.<\/li>\n<li><strong>Stage 4 (Universal AV1 for All 4K Videos + Higher Bitrate Allocation):<\/strong> Finally, backed by custom hardware encoding ASICs, YouTube expanded AV1 to all 4K videos. Currently, almost every 4K video uploaded to YouTube gets AV1 encoding automatically.<\/li>\n<\/ul>\n<p>Even more fascinating is the jump in bitrate over time. When I checked the exact <code>Encoded date<\/code> and <code>Bits/(Pixel*Frame)<\/code> metadata across 15 of my 4K 30fps 10-bit HLG videos, I found a clear split between my earlier AV1 encodes from <strong>2024–2025<\/strong> and my newer AV1 encodes from <strong>September–October 2026<\/strong>:<\/p>\n<ul>\n<li><strong>Earlier AV1 Era (Sep 2024 – Dec 2025, 3 Videos):<\/strong> Capped around <strong>20.34 to 20.73 Mbps<\/strong> (averaging <strong>20.57 Mbps<\/strong> and <strong>0.083 BPP<\/strong>), with peaks averaging <strong>56.12 Mbps<\/strong>. Equivalent to <strong>24.91 / 67.96 Mbps in HEVC<\/strong> and <strong>27.15 / 74.08 Mbps in VP9.2<\/strong>.<\/li>\n<li><strong>Late-2026 Era (Sep – Oct 2026, 10 Graphed / 12 Total Videos):<\/strong> Boosted to <strong>23.66 to 27.70 Mbps<\/strong>. The 10 graphed videos average <strong>25.88 Mbps<\/strong> (<strong>0.104 BPP<\/strong>) and <strong>72.94 Mbps peak<\/strong> (or <strong>26.05 Mbps<\/strong> / <strong>0.105 BPP<\/strong> across all 12 MediaInfo logs). Equivalent to <strong>31.34 / 88.33 Mbps in HEVC<\/strong> and <strong>34.16 / 96.28 Mbps in VP9.2<\/strong>.<\/li>\n<li><strong>Percentage Jump Over Time:<\/strong> YouTube increased its 4K30 AV1 HDR average bitrate by <strong>+25.9%<\/strong> (or <strong>+26.6%<\/strong> across all 12 MediaInfo files), boosted pixel density by <strong>+25.5%<\/strong>, and expanded average peak bitrate headroom by <strong>+30.0%<\/strong>.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Encoding Era<\/th>\n<th>BPP<\/th>\n<th>AV1 (Avg / Peak)<\/th>\n<th>HEVC Eq. (+21.1%)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>2024–2025 (3 Vids)<\/strong><\/td>\n<td>0.083<\/td>\n<td><strong>20.57<\/strong> / 56.12 Mbps<\/td>\n<td><strong>24.91<\/strong> / 67.96 Mbps<\/td>\n<\/tr>\n<tr>\n<td><strong>Late-2026 (10 Vids)<\/strong><\/td>\n<td>0.104<\/td>\n<td><strong>25.88<\/strong> / 72.94 Mbps<\/td>\n<td><strong>31.34<\/strong> / 88.33 Mbps<\/td>\n<\/tr>\n<tr>\n<td><strong>Late-2026 (All 12)<\/strong><\/td>\n<td>0.105<\/td>\n<td><strong>26.05<\/strong> / — Mbps<\/td>\n<td><strong>31.55<\/strong> / — Mbps<\/td>\n<\/tr>\n<tr>\n<td><strong>Era Gain (%)<\/strong><\/td>\n<td><strong>+25.5%<\/strong><\/td>\n<td><strong>+25.9%<\/strong> / <strong>+30.0%<\/strong><\/td>\n<td><strong>+6.43<\/strong> / <strong>+20.37 Mbps<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Master Chronological Summary of All 15 YouTube 4K 30fps HDR (HLG) Videos<\/h3>\n<p>Below is the compact chronological summary sorted by UTC <code>Encoded date<\/code>. All bitrate values are in <strong>Mbps<\/strong> formatted as <strong>Average / Peak<\/strong> (full video titles, file sizes, durations, BPP, and kbps figures are listed in the individual video breakdowns below):<\/p>\n<table>\n<thead>\n<tr>\n<th>Video (4K30 HLG) D 4K)","1.43:1 &amp; 1.90:1"],["57","Vāranāsi (3D &amp; 2D 4K)","1.90:1"]],"sort":0,"order":"asc","wide":false},"lists/indiandolbycinemamovies":{"title":"Indian Dolby Cinema Movies","intro":"<p>A list of Indian Movies graded in HDR with Dolby Vision and released in Dolby Cinemas in their proprietary 108nits HDR format.<\/p>","note":"","rows":[["#","Movie","Ratio"],["1","RRR","1.90:1"],["1","RRR","2.39:1"],["2","Pushpa: The Rule","2.39:1"],["3","Game Changer","2.39:1"],["4","War 2","2.39:1"],["5","Kantara: A Legend - Chapter One","2.39:1"],["6","Baahubali: The Epic","1.90:1"],["6","Baahubali: The Epic","2.39:1"],["7","Rajasaab","2.39:1"],["8","Mana Shankara Vara Prasad Garu","2.39:1"],["9","Border 2","2.39:1"],["10","Ustaad Bhagat Singh","2.39:1"],["11","Dhurandhar: The Revenge","2.39:1"],["12","Biker","1.90:1"],["12","Biker","2.39:1"],["13","Swayambhu","2.39:1"],["14","Dacoit","1.90:1"],["14","Dacoit","2.39:1"],["15","Karuppu","2.39:1"],["16","Drishyam 3","2.39:1"],["17","Peddi","1.90 &amp; 2.39:1"],["17","Peddi","2.39:1"],["18","Nagabandham","2.39:1"],["19","The Paradise","2.39:1"],["20","Toxic","1.90:1"],["21","Namit Malhotra's Ramayana","1.90:1"],["21","Namit Malhotra's Ramayana","2.39:1"],["22","Vāranāsi","1.90:1"],["22","Vāranāsi","2.39:1"]],"sort":0,"order":"asc","wide":false},"lists/indianhdrbybarcomovies":{"title":"Indian HDR by Barco Movies","intro":"<p>A list of Indian Movies graded in HDR and released in HDR by Barco Cinemas in their proprietary 300nits HDR format.<\/p>","note":"","rows":[["#","Movie"],["1","Dhurandhar: The Revenge"],["2","Biker"],["3","Dacoit"],["4","Peddi"],["5","Toxic"],["6","The Paradise"],["7","Swayambhu"],["8","Ramayana - Part 1"],["9","Vaaranaasi"]],"sort":0,"order":"asc","wide":false}},"tools":{"utilities/bitratecalculator":{"title":"Bitrate Calculator","intro":"<p>Make sure to verify the system from which the size was noted. For example, a file which shows up as 100 GB on a Windows machine will show up as 107.37 GB on a Mac machine because different operating systems use different mathematics for calculating the size, i.e., either the 1024-base or 1000-base.<\/p>"},"utilities/requestinfinityvision":{"title":"Avengers: Doomsday — \"Infinity Vision\" (1.85:1 Flat) Cinema Letter Generator","byline":"Shrey Tyagi • Cinema Technology Initiative","intro":"<p>Since <i>Avengers: Doomsday<\/i> is not releasing in IMAX, large non-IMAX flat screens (45+ ft wide) are our best way to watch the movie in its full <strong>1.85:1 Expanded Aspect Ratio<\/strong> without black bars. However, Disney will only send the 1.85:1 Flat DCP to cinemas that apply for <strong>Infinity Vision<\/strong> certification beforehand. Fill in the details below to generate a ready-to-print 1-page letter you can hand over or email to your local cinema management.<\/p>","letter":"<div class=\"tofrom\">\n<div class=\"cell\">\n<strong>TO:<\/strong><br>\nCinema Management &amp; Projection Team<br>\n<span data-out=\"outCinemaDetails\">[Cinema Name &amp; Address]<\/span>\n<\/div>\n<div class=\"cell right\">\n<strong>FROM:<\/strong><br>\n<span data-out=\"outHeaderName\">[Your Name]<\/span><br>\n<span data-out=\"outHeaderContact\">[Your Phone] | [Your Email]<\/span>\n<\/div>\n<\/div>\n<div class=\"subject\">\nSUBJECT: How to Get the Full-Screen (1.85:1) Version of <em>Avengers: Doomsday<\/em> for Your <span class=\"screen-label-cap\">Flat Screen<\/span>\n<\/div>\n<p><strong>Dear Management &amp; Projection Team,<\/strong><\/p>\n<p><strong>Avengers: Doomsday<\/strong> is not releasing in IMAX. Because of this, moviegoers are looking for large, tall screens that can play the movie full-screen without black bars. Your <strong><span class=\"screen-label\">flat screen<\/span><\/strong> is one of the only screens in the entire region that can do this—<strong>but only if you apply to Disney for \"Infinity Vision\" certification beforehand.<\/strong><\/p>\n<div class=\"sec\">1. The Basics: Scope vs. Flat on Your Screen<\/div>\n<ul>\n<li><strong>Scope (2.39:1 — Wide Format):<\/strong> About 95% of movies come in this wide format. Because your <strong><span class=\"screen-label\">flat screen<\/span><\/strong> is built tall, playing a Scope movie leaves <strong>big black bars at the top and bottom<\/strong>.<\/li>\n<li><strong>Flat (1.85:1 — Tall Format):<\/strong> This taller format <strong>fills 100% of your <span class=\"screen-label\">flat screen<\/span><\/strong> from top to bottom with <strong>zero black bars<\/strong>, giving audiences a massive, full-screen picture.<\/li>\n<\/ul>\n<div class=\"pair\">\n<div class=\"fig\">\n<div class=\"figt bad\">❌ Scope (2.39:1) on Your <span class=\"screen-label-cap\">Flat Screen<\/span><\/div>\n<div class=\"frame\" data-n=\"0\"><\/div>\n<div class=\"figc\">Leaves thick black bars on top &amp; bottom of your tall screen.<\/div>\n<\/div>\n<div class=\"fig\">\n<div class=\"figt good\">✅ Flat (1.85:1) on Your <span class=\"screen-label-cap\">Flat Screen<\/span><\/div>\n<div class=\"frame\" data-n=\"1\"><\/div>\n<div class=\"figc\">Fills 100% of your entire screen height &amp; width.<\/div>\n<\/div>\n<\/div>\n<div class=\"sec\">2. The Catch with <em>Avengers: Doomsday<\/em> (\"Infinity Vision\")<\/div>\n<p>Marvel is releasing <em>Avengers: Doomsday<\/em> in two DCP versions: a standard <strong>Scope (2.39:1)<\/strong> version and an <strong>Expanded Flat (1.85:1)<\/strong> version. Both versions are also offered under Marvel's <strong>\"Infinity Vision\"<\/strong> certification depending on a cinema's screen shape:<\/p>\n<ul>\n<li><strong>If you DO NOT apply for Infinity Vision:<\/strong> Disney will only send you the standard <strong>Scope (2.39:1)<\/strong> DCP. Your tall <strong><span class=\"screen-label\">flat screen<\/span><\/strong> will be forced to play the movie with big black bars on top and bottom.<\/li>\n<li><strong>If you APPLY for Infinity Vision:<\/strong> Because you have a tall <strong><span class=\"screen-label\">flat screen<\/span><\/strong>, Disney will approve and send you the exclusive <strong>1.85:1 Expanded Flat DCP<\/strong>, filling your entire screen.<\/li>\n<\/ul>\n<div class=\"pair\">\n<div class=\"fig\">\n<div class=\"figt bad\">Without Infinity Vision (Scope 2.39:1 DCP)<\/div>\n<img src=\"https://shreytyagi.com/utilities/IMG_0149.jpeg\" alt=\"Avengers Doomsday Scope 2.39:1 with Black Bars on Flat Screen\" loading=\"lazy\" decoding=\"async\" class=\"photo\">\n<div class=\"figc\">Standard Scope (2.39:1) — Cropped frame with top &amp; bottom black bars on your <span class=\"screen-label\">flat screen<\/span>.<\/div>\n<\/div>\n<div class=\"fig\">\n<div class=\"figt good\">With Infinity Vision (Flat 1.85:1 DCP)<\/div>\n<img src=\"https://shreytyagi.com/utilities/IMG_0153.jpeg\" alt=\"Avengers Doomsday Expanded Flat 1.85:1 Full Screen\" loading=\"lazy\" decoding=\"async\" class=\"photo\">\n<div class=\"figc\">Infinity Vision Flat (1.85:1) — Full Expanded Aspect Ratio filling your entire <span class=\"screen-label\">flat screen<\/span>.<\/div>\n<\/div>\n<\/div>\n<div class=\"sec\">3. Your Screen Already Meets All Marvel Requirements<\/div>\n<p>To get <strong>Infinity Vision<\/strong> certification from Disney, an auditorium only needs:<\/p>\n<div class=\"req\">\n<ul>\n<li><strong>Screen Width:<\/strong> At least <strong>45 feet wide<\/strong><\/li>\n<li><strong>Brightness:<\/strong> Standard <strong>14 fL<\/strong> (2D) / <strong>6 fL<\/strong> (3D)<\/li>\n<\/ul>\n<ul>\n<li><strong>Audio:<\/strong> <strong>7.1 Surround<\/strong> or <strong>Dolby Atmos<\/strong><\/li>\n<li><strong>Flat Screen:<\/strong> Qualifies for the <strong>1.85:1 Flat DCP<\/strong><\/li>\n<\/ul>\n<\/div>\n<p>Your auditorium already meets every single requirement—<strong>no new equipment or hardware changes are needed.<\/strong><\/p>\n<div class=\"sec\">4. Why This Will Bring Huge Crowds to Your Cinema<\/div>\n<p>Very few cinemas in a massive geographical radius have a 45+ ft tall <strong><span class=\"screen-label\">flat screen<\/span><\/strong>. If you get certified and play the <strong>1.85:1 Flat version<\/strong>, fans from neighboring cities and towns will travel long distances specifically to your cinema to watch <em>Avengers: Doomsday<\/em> full-screen.<\/p>\n<div class=\"callout\">\n<strong>What You Need to Do:<\/strong>\n<ol>\n<li><strong>Apply to Disney/Marvel Distribution Now:<\/strong> Request <strong>Infinity Vision certification<\/strong> for your <strong><span class=\"screen-label\">flat screen<\/span><\/strong> well ahead of release.<\/li>\n<li><strong>Request the 1.85:1 Flat DCP:<\/strong> Once approved, ensure your programming and projection team specifically orders and plays the <strong>1.85:1 Flat version<\/strong> (not the Scope version) on your <strong><span class=\"screen-label\">flat screen<\/span><\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"signoff\">\n<strong>Best Regards,<\/strong><br>\n<strong data-out=\"outFooterName\">[Your Name]<\/strong> — <span data-out=\"outFooterContact\">[Your Phone] | [Your Email]<\/span>\n<\/div>"}},"about":"<p>Hello! I’m <strong>Shrey Tyagi<\/strong>, a Technology Analyst with 4+ years of experience in SAP MII application support, currently working with Infosys for the Kraft Heinz client. Beyond my professional life, I’m a passionate traveler, content creator, and lifelong learner with a deep interest in cinema technology and video production.<\/p>\n<h3>Professional Background<\/h3>\n<p>Over the years, I’ve specialized in SAP MII application support, collaborating closely with multiple teams including MTI cluster, BI, networking, and IBM teams. My work involves streamlining processes, troubleshooting complex issues, and ensuring smooth project continuity. I have also explored cloud upgrades, video editing, and audio production as part of my professional toolkit.<\/p>\n<h3>Skills &amp; Expertise<\/h3>\n<ul>\n<li>SAP MII Application Support &amp; Enhancement<\/li>\n<li>Business Stakeholder Communication &amp; Coordination<\/li>\n<li>Video Editing, 4K HDR Color Grading, VR 360, and 3D Videography<\/li>\n<li>Audio Mixing (5.1 Surround Sound) &amp; Post Production Tools: DaVinci Resolve, Audacity, FFmpeg<\/li>\n<li>Proficient in Project Documentation and Knowledge Transfer<\/li>\n<\/ul>\n<h3>Hobbies &amp; Interests<\/h3>\n<p>I have a strong passion for travel and exploration, having journeyed across India to places like Andaman Islands, Kashmir, Sikkim, Himachal Pradesh, Tamil Nadu, and many more. I also enjoy filmmaking, photography, technology, and learning about the latest cinema and visual technologies.<\/p>\n<h3>Personal Life &amp; Philosophy<\/h3>\n<p>I enjoy learning new skills, exploring cultures, and challenging myself through travel and creative projects. I am a vegetarian and maintain a healthy lifestyle with a focus on wholesome food, including fruits, salads, and plant-based proteins. Public speaking is another area I actively pursue, having been part of Infosys Toastmasters since 2022.<\/p>\n<p>Thanks for visiting my page! Feel free to reach out via <a href=\"mailto:business@shreytyagi.com\">email<\/a> or connect with me on <a href=\"https://www.linkedin.com/in/iamshreytyagi/\" target=\"_blank\" rel=\"noopener\">LinkedIn<\/a>.<\/p>","year":2026};</script>
<script>
(() => {
'use strict';

/* ---------------------------------------------------------------- basics */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const main = $('#main');
const E = D.entries;
const byId = new Map(E.map(e => [e.id, e]));
const SECTIONS = {
  articles: ['Articles', 'Long reads on cinema formats, reviews and technology.'],
