<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shrey Tyagi</title>
<meta name="description" content="Articles, lists and tools about cinema technology — IMAX, Dolby Cinema, HDR, 3D and encoding.">
<meta name="theme-color" content="#f0ece3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400..700;1,400..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  /* theme before first paint: stored choice, else the system */
  try { var t = localStorage.getItem('st-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* ==========================================================================
   shreytyagi.com — minimal redesign on hanji tokens
   paper / charcoal grounds · scarlet (cinnabar) as the only accent
   Figtree for words · DM Mono for dates and numbers
   ========================================================================== */
:root{
  --bg:#f0ece3; --bg-soft:#f7f5f0; --surface:#fbfaf8;
  --tint:rgba(22,19,15,.055); --tint-2:rgba(22,19,15,.09);
  --line:rgba(22,19,15,.1); --line-2:rgba(22,19,15,.18);
  --fg:#16130f; --fg-dim:#5c5853; --fg-mute:#8a867f;
  --accent:#b81f18; --accent-soft:#e8d2c8; --on-accent:#fff;
  --font:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --measure:720px; --wide:1180px; --gutter:20px; --bar:60px; --stick:60px;
  --r-xs:8px; --r-sm:12px; --r-pill:999px;
  --ease:cubic-bezier(.33,1,.68,1); --fast:140ms;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111114; --bg-soft:#1b1b1e; --surface:#222225;
    --tint:rgba(255,255,255,.06); --tint-2:rgba(255,255,255,.1);
    --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.17);
    --fg:#f1efec; --fg-dim:#b7b5b4; --fg-mute:#85837f;
    --accent:#ff5a52; --accent-soft:#321b1d; --on-accent:#16130f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111114; --bg-soft:#1b1b1e; --surface:#222225;
  --tint:rgba(255,255,255,.06); --tint-2:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.17);
  --fg:#f1efec; --fg-dim:#b7b5b4; --fg-mute:#85837f;
  --accent:#ff5a52; --accent-soft:#321b1d; --on-accent:#16130f;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--bar) + 20px)}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);
  font:400 16px/1.55 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-feature-settings:"ss01"}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
img,svg{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
main:focus,main:focus-visible{outline:none}
input[type=search]::-webkit-search-cancel-button{display:none}
::selection{background:var(--accent-soft)}
kbd{font:500 11px/1 var(--mono);padding:3px 5px;border-radius:5px;border:1px solid var(--line-2);color:var(--fg-dim);background:var(--bg-soft)}
.skip{position:absolute;left:-999px;top:8px;z-index:50;padding:8px 12px;border-radius:var(--r-xs);background:var(--fg);color:var(--bg)}
.skip:focus{left:8px}
.wrap{width:100%;max-width:calc(var(--measure) + 2*var(--gutter));margin:0 auto;padding:0 var(--gutter)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px);
  border-bottom:1px solid transparent;transition:border-color var(--fast),transform 220ms var(--ease)}
.bar.scrolled{border-bottom-color:var(--line)}
.bar-in{display:flex;align-items:center;gap:18px;height:var(--bar)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:15.5px;letter-spacing:-.01em;white-space:nowrap}
.seal{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--accent);color:#fff;
  font:700 10px/1 var(--font);letter-spacing:.04em;transform:rotate(-4deg)}
.nav{display:flex;align-items:center;gap:20px;margin-left:auto}
.nav a{position:relative;text-decoration:none;color:var(--fg-dim);font-size:14.5px;font-weight:500;padding:6px 0;transition:color var(--fast)}
.nav a:hover,.nav a[aria-current="page"]{color:var(--fg)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--accent)}
.tools{display:flex;align-items:center;gap:6px}
.icon-btn,.search-btn{display:inline-flex;align-items:center;gap:8px;height:34px;border:1px solid var(--line-2);background:transparent;
  border-radius:var(--r-pill);cursor:pointer;color:var(--fg-dim);transition:color var(--fast),background var(--fast)}
.search-btn{padding:0 6px 0 10px;font-size:14px}
.search-btn span{display:none}
.icon-btn{width:34px;justify-content:center}
.icon-btn:hover,.search-btn:hover{color:var(--fg);background:var(--tint)}
.icon-btn svg,.search-btn svg{width:16px;height:16px}

@media (max-width:820px){
  .bar-in{flex-wrap:wrap;height:auto;row-gap:0;padding-top:10px}
  .tools{margin-left:auto}
  .nav{order:3;width:calc(100% + 2*var(--gutter));margin:0 calc(-1*var(--gutter));padding:4px var(--gutter) 2px;gap:20px;
    overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:8px 0 10px;flex:none}
  .search-btn span,.search-btn kbd{display:none}
  .search-btn{width:34px;padding:0;justify-content:center}
  .bar.hide{transform:translateY(-100%)}
}

/* ---------- page ---------- */
main{flex:1;width:100%;max-width:calc(var(--measure) + 2*var(--gutter));margin:0 auto;padding:44px var(--gutter) 96px;outline:none}
main.is-wide{max-width:calc(var(--wide) + 2*var(--gutter))}
main.is-wide > :not(.tw):not(.tbar){max-width:var(--measure)}
body.wide .bar-in{max-width:calc(var(--wide) + 2*var(--gutter))}
.foot{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:center;padding-top:22px;padding-bottom:40px;
  border-top:1px solid var(--line);font-size:13.5px;color:var(--fg-dim);max-width:calc(var(--measure) + 2*var(--gutter))}
.foot nav{display:flex;flex-wrap:wrap;gap:16px}
.foot a{text-decoration:none}
.foot a:hover{color:var(--fg)}

/* home lede */
.home{margin:6px 0 40px}
.lede{font-size:clamp(21px,3.2vw,25px);line-height:1.4;letter-spacing:-.015em;font-weight:450;margin:0;text-wrap:pretty}
.lede-2{color:var(--fg-dim);margin:14px 0 0;font-size:15.5px;text-wrap:pretty}
.lede-2 a{text-decoration-color:var(--line-2);text-underline-offset:3px}
.lede-2 a:hover{text-decoration-color:var(--accent)}

/* page header */
.ph{margin-bottom:34px}
.crumb{display:flex;gap:7px;margin:0 0 14px;font:400 13px/1.4 var(--mono);color:var(--fg-dim)}
.crumb a{text-decoration:none}
.crumb a:hover{color:var(--fg);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.crumb i{font-style:normal;color:var(--fg-mute)}
h1{font-size:clamp(29px,5vw,40px);line-height:1.12;letter-spacing:-.025em;font-weight:620;margin:0;text-wrap:balance}
.meta{margin:14px 0 0;font:400 13px/1.4 var(--mono);color:var(--fg-dim)}
.sub{margin:12px 0 0;color:var(--fg-dim);font-size:16px;text-wrap:pretty}

/* index rows */
.grp + .grp{margin-top:34px}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--line);
  font:500 13px/1 var(--mono);color:var(--fg-dim);letter-spacing:.01em}
.gh span{color:var(--fg-mute)}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:16px;align-items:baseline;padding:9px 10px;margin:0 -10px;border-radius:10px;text-decoration:none;
  transition:background var(--fast)}
.row:hover{background:var(--tint)}
.row time{font:400 13px/1.4 var(--mono);color:var(--fg-dim);white-space:nowrap}
.row .t{font-weight:500;font-size:16px;line-height:1.4;letter-spacing:-.005em;text-wrap:pretty}
.row .m{font-size:13px;color:var(--fg-dim);white-space:nowrap}
.ext{color:var(--fg-mute);font-weight:400}
@media (max-width:560px){
  .row{grid-template-columns:auto 1fr;grid-template-areas:"t t" "d m";gap:2px 6px;padding:10px;}
  .row .t{grid-area:t}.row time{grid-area:d}.row .m{grid-area:m;justify-self:start}
  .row .m::before{content:"· ";color:var(--fg-mute)}
}

/* ---------- prose ---------- */
.prose{font-size:18px;line-height:1.7;overflow-wrap:break-word}
.prose > :first-child{margin-top:0}
.prose p{margin:0 0 1.1em;text-wrap:pretty}
.prose h2{font-size:23px;line-height:1.25;letter-spacing:-.015em;font-weight:620;margin:2em 0 .6em;text-wrap:balance}
.prose h3{font-size:19.5px;line-height:1.3;letter-spacing:-.01em;font-weight:620;margin:1.8em 0 .5em;text-wrap:balance}
.prose h4{font-size:17px;font-weight:620;margin:1.6em 0 .4em}
.prose ul,.prose ol{margin:0 0 1.2em;padding-left:1.3em}
.prose li{margin:.35em 0;padding-left:.2em}
.prose li::marker{color:var(--fg-mute)}
.prose li > p{margin:0}
.prose a{text-decoration-line:underline;text-decoration-color:color-mix(in srgb,var(--accent) 55%,transparent);text-underline-offset:3px;text-decoration-thickness:1px}
.prose a:hover{text-decoration-color:var(--accent);text-decoration-thickness:2px}
.prose strong{font-weight:620}
.prose img{width:100%;height:auto;margin:1.7em 0;border-radius:var(--r-sm);background:var(--tint)}
.prose hr{border:0;height:1px;background:var(--line);margin:2.4em 0}
.prose blockquote{margin:1.4em 0;padding-left:18px;border-left:2px solid var(--accent);color:var(--fg-dim)}
.prose code{font:400 .86em/1.5 var(--mono);background:var(--tint);padding:2px 5px;border-radius:6px}
.prose pre{font:400 13.5px/1.6 var(--mono);background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px;overflow-x:auto}
.prose pre code{background:none;padding:0}
.prose sub,.prose sup{font-size:.7em}
.prose iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:var(--r-sm);margin:1.6em 0}
.prose .tw{margin:1.6em 0}
.prose table{font-size:15px;line-height:1.45}
.aside,.prose .aside{font-size:15.5px;line-height:1.55;background:var(--tint);border-radius:var(--r-sm);padding:14px 16px}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}

/* reading progress — CSS scroll timeline, no JS */
.progress{position:fixed;inset:0 0 auto 0;height:2px;z-index:30;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);pointer-events:none}
@supports (animation-timeline:scroll()){
  .progress{animation:grow linear both;animation-timeline:scroll(root)}
  @keyframes grow{to{transform:scaleX(1)}}
}
@supports not (animation-timeline:scroll()){.progress{display:none}}

/* prev / next */
.pn{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:56px;padding-top:20px;border-top:1px solid var(--line)}
.pn a{text-decoration:none;padding:10px;margin:-10px;border-radius:10px;transition:background var(--fast)}
.pn a:hover{background:var(--tint)}
.pn a.next{text-align:right;grid-column:2}
.pn small{display:block;font:400 12.5px/1.4 var(--mono);color:var(--fg-dim);margin-bottom:4px}
.pn span{font-weight:500;line-height:1.4;text-wrap:pretty}
@media (max-width:560px){.pn{grid-template-columns:1fr}.pn a.next{grid-column:1}}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;margin-top:28px}
.gallery button{all:unset;cursor:pointer;aspect-ratio:1;border-radius:var(--r-xs);overflow:hidden;background:var(--tint);position:relative}
.gallery button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gallery img{width:100%;height:100%;object-fit:cover}
.gallery .n{position:absolute;inset:auto auto 6px 8px;font:500 11px/1 var(--mono);color:var(--fg-dim)}
.lb{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:rgba(10,9,8,.94);color:#f1efec}
.lb::backdrop{background:transparent}
.lb img{position:absolute;inset:56px 16px 56px;width:calc(100% - 32px);height:calc(100% - 112px);object-fit:contain}
.lb .lb-top{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font:400 13px/1 var(--mono)}
.lb button{all:unset;cursor:pointer;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:#f1efec;background:rgba(255,255,255,.08)}
.lb button:hover{background:rgba(255,255,255,.16)}
.lb .prev,.lb .next{position:absolute;top:50%;translate:0 -50%}
.lb .prev{left:12px}.lb .next{right:12px}

/* ---------- data tables ---------- */
.tbar{display:flex;align-items:center;gap:14px;margin:0 0 12px}
.filter{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-pill);
  background:var(--bg-soft);color:var(--fg-dim);transition:border-color var(--fast)}
.filter:focus-within{border-color:var(--fg-dim)}
.filter svg{width:15px;height:15px;flex:none}
.filter input{all:unset;flex:1;min-width:0;font-size:15px;color:var(--fg)}
.filter input::placeholder{color:var(--fg-mute)}
.count{font:400 13px/1 var(--mono);color:var(--fg-dim);white-space:nowrap}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tw.flow{overflow:visible}
.tw.flow .data td{overflow-wrap:anywhere}
.tw.scroll{max-height:calc(100dvh - var(--bar) - 90px);overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);overscroll-behavior:contain}
table.data,.prose table{width:100%;border-collapse:separate;border-spacing:0}
.data{font-size:14.5px;line-height:1.45}
.data th{position:sticky;top:var(--stick);z-index:2;background:var(--bg);text-align:left;padding:0;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:bottom}
.tw.scroll .data th{top:0}
.data th button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;padding:10px 14px 9px 0;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--fg-dim);letter-spacing:.005em}
.data th button:hover{color:var(--fg)}
.data th button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.data th[aria-sort] button{color:var(--fg)}
.data th .ar{font:500 12px/1 var(--mono);color:var(--accent);width:10px}
.data td{padding:9px 14px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tw.scroll .data td,.tw.scroll .data th button{padding-left:14px}
.data td.num,.data th.num button{text-align:right;justify-content:flex-end;font-variant-numeric:tabular-nums}
.data td.num,.data td.mono{font-family:var(--mono);font-size:13.5px}
.data td.rep{color:var(--fg-mute)}
.data tbody tr:hover td{background:var(--tint)}
.data td a{text-decoration-color:color-mix(in srgb,var(--accent) 55%,transparent);text-underline-offset:3px}
.tw.scroll .data td{white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.tw.scroll .data .s0,.tw.scroll .data .s1{position:sticky;left:0;z-index:1;background:var(--bg)}
.tw.scroll .data th.s0,.tw.scroll .data th.s1{z-index:3}
.tw.scroll .data .s1{left:var(--c0,0px);box-shadow:1px 0 0 var(--line)}
.tw.scroll .data .s0:only-child,.tw.scroll .data .s0.solo{box-shadow:1px 0 0 var(--line)}
.data tbody tr:hover td.s0,.data tbody tr:hover td.s1{background:color-mix(in srgb,var(--fg) 5.5%,var(--bg))}
.empty{padding:28px 0;color:var(--fg-dim)}
.note{margin-top:22px;font-size:15px;color:var(--fg-dim)}
.intro{font-size:16.5px;line-height:1.65;color:var(--fg);margin-bottom:28px}
.intro ul{margin-bottom:0}

/* ---------- tools ---------- */
.form{display:grid;gap:22px;margin:30px 0 0}
.fl{display:block;font-size:13px;font-weight:600;color:var(--fg-dim);margin-bottom:8px}
.seg{display:inline-flex;padding:3px;border-radius:var(--r-pill);background:var(--tint);gap:2px;flex-wrap:wrap}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:7px 14px;border-radius:var(--r-pill);font-size:14px;font-weight:500;color:var(--fg-dim);transition:background var(--fast),color var(--fast)}
.seg span small{font-weight:400;color:var(--fg-mute);margin-left:6px}
.seg input:checked + span{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:1px}
.units{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.unit,.input{display:flex;align-items:center;height:46px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--bg-soft);transition:border-color var(--fast)}
.unit:focus-within,.input:focus-within{border-color:var(--fg-dim)}
.unit input{all:unset;flex:1;min-width:0;width:100%;padding:0 0 0 14px;font:400 17px/1 var(--mono);color:var(--fg)}
.unit input::placeholder{color:var(--fg-mute)}
.unit span{padding:0 14px 0 6px;font:500 13px/1 var(--mono);color:var(--fg-dim)}
.result{display:flex;align-items:baseline;gap:10px;margin:34px 0 0;padding:22px 0 0;border-top:1px solid var(--line)}
.result b{font:500 clamp(40px,8vw,56px)/1 var(--mono);letter-spacing:-.03em}
.result span{font-size:17px;color:var(--fg-dim)}
.result.idle b{color:var(--fg-mute)}
.result-2{margin:8px 0 0;font:400 13.5px/1.5 var(--mono);color:var(--fg-dim)}
details.work{margin-top:22px}
details.work summary{cursor:pointer;font-size:14.5px;font-weight:500;color:var(--fg-dim);list-style:none;display:inline-flex;gap:6px;align-items:center}
details.work summary::-webkit-details-marker{display:none}
details.work summary::before{content:"+";font:500 14px/1 var(--mono);color:var(--accent);width:12px}
details.work[open] summary::before{content:"−"}
details.work pre{margin:12px 0 0;font:400 13px/1.75 var(--mono);background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;overflow-x:auto;white-space:pre}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid2 .full{grid-column:1/-1}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.input input,.input textarea{all:unset;flex:1;min-width:0;width:100%;padding:0 14px;font-size:15.5px;color:var(--fg)}
.input textarea{padding:12px 14px;white-space:pre-wrap;line-height:1.45}
.input:has(textarea){height:auto;min-height:92px;align-items:stretch}
.input ::placeholder{color:var(--fg-mute)}
.hint{margin:6px 0 0;font-size:13px;color:var(--fg-dim)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:26px 0 36px}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:var(--r-pill);border:0;cursor:pointer;
  background:var(--fg);color:var(--bg);font-size:15px;font-weight:600;transition:transform 120ms var(--ease),opacity var(--fast)}
.btn:hover{opacity:.9}.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.actions small{color:var(--fg-dim);font-size:13px;max-width:44ch}

/* the printable letter: always white paper */
.sheet-wrap{margin:0 calc(-1*var(--gutter));padding:0 var(--gutter)}
.sheet{background:#fff;color:#16130f;border-radius:6px;padding:46px 50px;font-size:13.5px;line-height:1.55;
  box-shadow:0 0 0 1px rgba(22,19,15,.08),0 18px 44px -22px rgba(0,0,0,.4);max-width:794px}
.sheet p{margin:0 0 9px}
.sheet ul,.sheet ol{margin:0 0 9px;padding-left:20px}
.sheet li{margin:3px 0}
.sheet strong{font-weight:650}

},{"id":"photos/hdrheictest","section":"photos","category":"Test","title":"HDR HEIC Test","date":"2025-10-21","kind":"post"},{"id":"lists/indianimaxdmrmovies","section":"lists","category":"Cinemas","title":"Indian IMAX DMR Movies","date":"2025-08-27","kind":"list","count":58},{"id":"lists/indiandolbycinemamovies","section":"lists","category":"Cinemas","title":"Indian Dolby Cinema Movies","date":"2025-08-27","kind":"list","count":29},{"id":"articles/noimaxweapons","section":"articles","category":"Movies","title":"No IMAX for Weapons in India?","date":"2025-08-01","kind":"post"},{"id":"articles/whyavatar2k","section":"articles","category":"Movies","title":"Why even new Avatar movies are done in 2K?","date":"2025-07-31","kind":"post"},{"id":"articles/mahavatarnarsimhareview","section":"articles","category":"Movie Review","title":"Mahavatar Narsimha - Masterpiece with Technical issues","date":"2025-07-27","kind":"post"},{"id":"articles/war2dolbycinema","section":"articles","category":"Movies","title":"War 2 - India's First Dolby Cinema movie?","date":"2025-07-24","kind":"post"},{"id":"blogs/myfavouriteimaxexperiences","section":"blogs","category":"Movies","title":"My Favouite IMAX Memories and What Made Them Special","date":"2025-07-22","kind":"post"},{"id":"articles/supermanhindivsenglish","section":"articles","category":"Movie Review","title":"Superman - Hindi Dub vs English Dub Comparison","date":"2025-07-13","kind":"post"},{"id":"articles/superman3dreview","section":"articles","category":"Movie Review","title":"Superman - 3D Review","date":"2025-07-12","kind":"post"},{"id":"articles/supermanmoviereview","section":"articles","category":"Movie Review","title":"Superman - Movie Review","date":"2025-07-11","kind":"post"},{"id":"articles/lowoccupancyatdolbycinema","section":"articles","category":"Cinemas","title":"Why occupancies low at Dolby Cinema?","date":"2025-07-08","kind":"post"},{"id":"articles/dolbycinemaindiareview","section":"articles","category":"Cinemas","title":"Dolby Cinema Pune: Complete In-Depth Review","date":"2025-07-05","kind":"post"},{"id":"articles/f14dxreview","section":"articles","category":"Movies","title":"F1 - 4DX Review","date":"2025-06-28","kind":"post"},{"id":"articles/ballerina4dxreview","section":"articles","category":"Movies","title":"Ballerina - 4DX Review","date":"2025-06-28","kind":"post"},{"id":"articles/httyd4dxreview","section":"articles","category":"Movies","title":"How To Train Your Dragon - 4DX Review","date":"2025-06-28","kind":"post"},{"id":"articles/howmuchextrainimax","section":"articles","category":"Cinemas","title":"Calculating Effective % Extra IMAX Image for Variable Aspect Ratio Movies","date":"2025-04-16","kind":"post"},{"id":"lists/biggestscreensofindia","section":"lists","category":"Cinemas","title":"Biggest Screens of India","date":"2025-03-31","kind":"list","count":7},{"id":"lists/imaxcinemasofindia","section":"lists","category":"Cinemas","title":"IMAX Cinemas of India","date":"2025-03-27","kind":"list","count":37},{"id":"lists/seenatimax","section":"lists","category":"Movies","title":"I've Seen At IMAX","date":"2025-03-27","kind":"list","count":54},{"id":"lists/flatscreensofindia","section":"lists","category":"Cinemas","title":"Flat Screens of India","date":"2025-03-26","kind":"list","count":72},{"id":"lists/imaxmovies","section":"lists","category":"Movies","title":"IMAX Movies","date":"2025-03-26","kind":"list","count":36},{"id":"articles/moviereviews/crazxy","section":"articles","category":"Movie Review","title":"Crazxy","date":"2025-03-22","kind":"post"},{"id":"blogs/arareexperienceattheairforcestationinbhuj","section":"blogs","category":"Travel","title":"A Rare Experience At Air Force Station Bhuj","date":"2025-03-22","kind":"post"},{"id":"articles/moviereviews/rockyaurranikiipremkahaani","section":"articles","category":"Movie Review","title":"Rocky Aur Raani Ki Prem Kahaani","date":"2023-07-07","kind":"post"}],"posts":{"articles/moviereviews/rockyaurranikiipremkahaani":{"gallery":null,"title":"Rocky Aur Rani Kii Prem Kahaani - Movie Review","html":"<p>\nThe fact that a Karan Johar directorial is coming to cinemas was sufficient to get me excited. But I did not expect that the movie is going to be so so good! Read on to know why!\n<\/p>\n<p>\nThe movie starts with a quick introduction to the main characters followed by a party song which will take you by surprise. The story proceeds and you get proper Karan Johar movie vibes. This was missing in his previous directorial, Ae Dil Hai Mushkil. Everyone's performance is good but it is Ranveer's perfection that keeps you hooked. The story feels fresh considering the kind of romance films we have been getting lately. But 30 minutes into the film you realise that this romance is a side-track and family drama takes the center stage throughout the rest of the movie. This is why I would recommend you to watch it with your family.\n<\/p>\n<p>\nThis is an important film every Indian must watch. With it's brilliant script, it gives a very strong message that will jolt you. It is fresh, entertaining and has the right blend of drama, comedy, romance and emotions. It's technically brilliant. It looks and sounds great. I noticed that the picture looked AI enhanced in a way that there was no grain and there is a slight oil painting look. As for parental guidance, there is one indirect sex joke in a conversation using Indian classical beat notations. There are few uses of words like \"Intercourse\" and \"Orgasm\" and \"Lund\" in a non-sexual and out of context manner. There are few uses of the abusive words like \"Bhen Di\" and \"Bhencho\". There is one erotic rain dance sequence, some casual making out scenes and plenty of kissing scenes. So some people might get a little uncomfortable but such never last long enough so majority of Indian audience would be fine watching along with family (just check out the ceiling when required ha ha).\n<\/p>\n<p>\nKaran Johar as a director is back and this will go down as one his better films.\n<\/p>","mins":2,"math":false},"articles/moviereviews/crazxy":{"gallery":null,"title":"Crazxy - Movie Review","html":"<p>\nGiven that Sohum Shah was behind Tumbbad and Ship Of Theseus, I had high expectations with Crazxy. A stylish opening introduces the plot where Sohum must deliver 5cr for an important task, while simultaneously dealing with his kidnapped daughter, also demanding the same amount.\n<\/p>\n<p>\nThis parallel narrative created an engaging sense of thrilling suspense, leaving viewers guessing if it is a coincidence or were these two connected… However, as the movie progressed, it became increasingly dull, excitement goes down as nothing interesting really happens.\n<\/p>\n<p>\nThe climax was underwhelming and unintentionally funny, especially as it attempted to address a certain social issue, which I think they ended up mocking instead. The acting by Soham was lackluster with minimal expressions and range, making it hard to connect with his character.\n<\/p>\n<p>\nThe songs in the later half of the movie, which although only run in the background, were randomly placed and did not help the movie. The movie’s concept had potential and could’ve been something excellent, but due to lazy writing in second half and even lazier acting… it fails!\n<\/p>","mins":1,"math":false},"blogs/arareexperienceattheairforcestationinbhuj":{"gallery":null,"title":"A Rare Experience at the Air Force Station in Bhuj","html":"<p>Thanks to my <strong>Tauji<\/strong>, who is a <i>Warrant Officer in the Indian Air Force<\/i>, I had the rare opportunity to visit the <strong>Air Force Station in Bhuj<\/strong>. He arranged special permission for us, making this visit an unforgettable experience. His office was quite <strong>big<\/strong>, and from there, we were taken to different parts of the base.<\/p>\n<p>One of the most exciting moments was seeing the <strong>runway<\/strong> and the parked aircraft. Some aircraft had <i>grass on top for camouflage<\/i>, a fascinating technique to make them blend into the surroundings. But the highlight of the visit was the detailed demonstration of a <strong>Jaguar fighter aircraft<\/strong>.<\/p>\n<p>Initially, some <strong>airmen<\/strong> explained various aspects of the aircraft. Later, a <strong>pilot arrived<\/strong>, likely on the orders of the <strong>Commanding Officer (CO)<\/strong>, whom we met briefly for a simple <i>hi-hello<\/i>. The pilot’s explanation was an extremely <strong>rare opportunity<\/strong>, as he shared intricate details about the aircraft’s systems, avionics, and weapons.<\/p>\n<p><strong>Exploring the Jaguar Fighter Aircraft<\/strong><\/p>\n<p>The Jaguar aircraft has several unique features. At the very front, there is a <strong>big stick-like structure<\/strong> with something hanging like a <i>flag<\/i>, which helps indicate wind direction or air pressure. Below that, there is a <strong>sensor<\/strong>.<\/p>\n<p>The <strong>wings<\/strong> contain <i>fuel storage units<\/i>. Each wing has two <strong>holders<\/strong>, which can carry different equipment. The <strong>inside holder<\/strong> can hold <i>missiles<\/i>, <i>weapons<\/i>, or <i>extra fuel tanks<\/i>. The extra fuel is used <strong>first<\/strong>, and only after it is depleted, the fuel from the wings is consumed. These extra tanks can also be <strong>dropped<\/strong> if needed. However, the <strong>outside holder<\/strong> can only carry <i>missiles<\/i>.<\/p>\n<p>Additionally, the aircraft can carry <strong>three extra fuel tanks<\/strong>: one under each wing and one below the aircraft’s body. The <strong>wings<\/strong> also have <i>small sticks<\/i> designed to <strong>discharge static electricity<\/strong>, which builds up when passing through clouds.<\/p>\n<p>At the rear, there are <strong>two engine exhausts<\/strong> that expel <i>fire<\/i>. These <strong>exhaust openings<\/strong> can expand. On the front side of the wings, there is an <strong>air intake<\/strong> that was <i>closed<\/i> on the ground to prevent birds or debris from entering. However, it opens during flight.<\/p>\n<p>A yellow <strong>staircase<\/strong> is used by pilots to climb into the cockpit. First, the airman and pilot climbed up, and then I followed. Inside, the pilot began explaining the <strong>cockpit controls<\/strong>.<\/p>\n<p><strong>Inside the Jaguar’s Cockpit<\/strong><\/p>\n<p>The <strong>joystick<\/strong> is used for <i>3D steering<\/i>, allowing full control over movement. To the left of the pilot’s seat, there is a <strong>throttle<\/strong>, which controls how much fuel enters the engine. The more fuel that goes in, the faster the aircraft moves.<\/p>\n<p>The cockpit is equipped with several <strong>complex avionics controls<\/strong>. The instruments include a meter that shows <i>altitude<\/i>, one that indicates <i>horizon tilt<\/i>, and another that measures <i>drift while turning<\/i>. There is also a speedometer, an <strong>altimeter<\/strong> that displays height above sea level, and a <strong>ground proximity meter<\/strong> that measures height from the ground.<\/p>\n<p>For example, if the aircraft is flying at <i>10,000 meters above sea level<\/i> while passing over an <i>8,000-meter-high mountain<\/i>, the sea-level altimeter will read <strong>10,000 meters<\/strong>, but the ground proximity meter will indicate <strong>2,000 meters<\/strong>, ensuring precise altitude tracking.<\/p>\n<p>The pilot also explained the aircraft’s <strong>communication system<\/strong>. It has <strong>two connectivity channels<\/strong>: one for <i>ground control<\/i> and another for a different function. The volume of these communication channels can be adjusted.<\/p>\n<p>Near the throttle, there is a special <strong>control<\/strong> where the pilot must insert <i>two fingers<\/i> to activate a <strong>speed boost<\/strong>. This provides a sudden burst of acceleration. When I jokingly asked if this would allow the aircraft to reach <i>Mach 10<\/i>, the pilot laughed and said it was impossible, mentioning that such speeds are only seen in movies.<\/p>\n<p>To the right of the cockpit, there were more <strong>complex controls<\/strong> that I couldn’t fully understand. Below the pilot’s seat is the <strong>ejection system<\/strong>, which is extremely dangerous. If triggered on the ground, the pilot would be launched into the air and fall back down, which could be fatal.<\/p>\n<p>The cockpit is <strong>very tight and claustrophobic<\/strong>. The instrument panel is positioned flat, with all critical information being <strong>projected onto a glass screen<\/strong> at a <i>45-degree angle<\/i>. This allows the pilot to view both the readings and the sky at the same time, similar to how <i>Iron Man’s Jarvis<\/i> appears as a projection in mid-air.<\/p>\n<p><strong>Other Areas We Explored<\/strong><\/p>\n<p>During the visit, we also got to see the <strong>pilots’ dressing room<\/strong>, a <strong>mini-museum<\/strong> inside the Air Force office building, a <strong>briefing room<\/strong>, and a <strong>projector room<\/strong>. Later, we returned to <strong>Tauji’s office<\/strong>, where we were served <strong>tea<\/strong> and met his <strong>subordinate<\/strong>, who was from <i>Mathura<\/i>.<\/p>\n<p><strong>A Close Encounter with a Commercial Aircraft<\/strong><\/p>\n<p>One thing I was hoping to see was a <strong>commercial aircraft<\/strong>. Initially, there was no fixed schedule for one, so I wasn’t expecting it. However, just as we were leaving, we had an <strong>unexpected and intense experience<\/strong>.<\/p>\n<p>Our car was approaching a <strong>crossing where the road intersected with the aircraft taxiway<\/strong>. Suddenly, a <strong>Vistara commercial aircraft<\/strong> came taxiing towards us, preparing for takeoff. There were <strong>no barricades or safety measures<\/strong>, making it a <i>dangerous moment<\/i>. We were nearly on a collision course before we quickly stopped, watching as the aircraft took off just meters away.<\/p>\n<p>This moment was a complete <strong>surprise<\/strong> and made the visit even more thrilling. What started as an opportunity to see military aircraft turned into an experience where I also witnessed a commercial takeoff up close.<\/p>\n<p><strong>Final Thoughts<\/strong><\/p>\n<p>This visit to the <strong>Air Force Station in Bhuj<\/strong> was a once-in-a-lifetime experience. From learning about the <strong>Jaguar fighter jet<\/strong> in such detail to unexpectedly witnessing a commercial takeoff so close, every moment was incredible. A huge thanks to <strong>Tauji<\/strong> for making this possible!<\/p>","mins":4,"math":false},"articles/howmuchextrainimax":{"gallery":null,"title":"Calculating Effective % Extra IMAX Image for Variable Aspect Ratio Movies","html":"<p>IMAX advertises 26% extra image for their expanded aspect ratio movies. But that holds true only if the entire movie is expanded. If the movie only has 10-20% scenes expanded, is it not wrong to say 26% more? Because for 80%-90% of the runtime you'll still be watching the exact same image as non-IMAX venues! So to calculate the effective % extra image, we need to consider the duration of IMAX scenes. This is a formula I made to calculate this. So if,\n<\/p><ul>\n<li>D<sub>f<\/sub> = Duration of Full Movie<\/li>\n<li>D<sub>i<\/sub> = Duration of IMAX Scenes<\/li>\n<li>D<sub>o<\/sub> = Duration of Opening Credits<\/li>\n<li>D<sub>e<\/sub> = Duration of End Credits<\/li>\n<li>A<sub>n<\/sub> = Aspect Ratio of non-IMAX Scenes<\/li>\n<li>A<sub>i<\/sub> = Aspect Ratio of IMAX Scenes<\/li>\n<\/ul><p>Then the Effective % Extra IMAX Image =\n<\/p>\n<p>\n\\[\n\\frac{D_i}{D_f - D_o - D_e} \\times \\left( \\frac{A_n}{A_i} - 1 \\right) \\times 100\n\\]\n<\/p>\n<p>For example, the movie Sinners which had 25 mins of IMAX footage and a runtime of 137 mins. If you're watching at an IMAX 1.43:1 venue, then values will be:\n<\/p><ul>\n<li>D<sub>f<\/sub> = 137<\/li>\n<li>D<sub>i<\/sub> = 25<\/li>\n<li>D<sub>o<\/sub> = 1<\/li>\n<li>D<sub>e<\/sub> = 5<\/li>\n<li>A<sub>n<\/sub> = 2.76<\/li>\n<li>A<sub>i<\/sub> = 1.43<\/li>\n<\/ul><p>So the Effective % Extra IMAX Image =\n<\/p>\n<p>\n\\[\n\\frac{25}{137 - 1 - 5} \\times \\left( \\frac{2.76}{1.43} - 1 \\right) \\times 100\n\\]\n<\/p>\n<p> = 17.7% <\/p>\n<p>Whereas, if you're watching at an IMAX 1.90:1 venue, then the value of A<sub>i<\/sub> will be 1.90 and rest all values will be same.<\/p>\n<p>So the Effective % Extra IMAX Image =<\/p>\n<p>\n\\[\n\\frac{25}{137 - 1 - 5} \\times \\left( \\frac{2.76}{1.90} - 1 \\right) \\times 100\n\\]\n<\/p>\n<p> = 8.6% <\/p>\n<p>Another example, the movie Blade Runner 2049 was expanded to 1.90:1 ratio at IMAX venues for the entire duration while non-IMAX venues got 2.39:1 for the entire duration. The values will be:\n<\/p><ul>\n<li>D<sub>f<\/sub> = 146 (removing opening and end credits)<\/li>\n<li>D<sub>i<\/sub> = 152<\/li>\n<li>D<sub>o<\/sub> = 1<\/li>\n<li>D<sub>e<\/sub> = 5<\/li>\n<li>A<sub>n<\/sub> = 2.39<\/li>\n<li>A<sub>i<\/sub> = 1.90<\/li>\n<\/ul><p>So the Effective % Extra IMAX Image =\n<\/p>\n<p>\n\\[\n\\frac{146}{152 - 1 - 5} \\times \\left( \\frac{2.39}{1.90} - 1 \\right) \\times 100\n\\]\n<\/p>\n<p> = 26% <\/p>\n<p>So as you can see, only if the entire movie is expanded, it would be correct to say terms like 26% extra image at IMAX. Otherwise, the percentage would be far lower. The percentage also helps to decide how worth is it to watch a movie at IMAX than non-IMAX cinemas if extra image is the only thing being considered.\n<\/p>","mins":2,"math":true},"photos/hdrheictest":{"gallery":[["https://shreytyagi.com/photos/hdrheictest/thumbs/1%20Medium.heic","https://shreytyagi.com/photos/hdrheictest/1.HEIC",""],["https://shreytyagi.com/photos/hdrheictest/thumbs/2%20Medium.heic","https://shreytyagi.com/photos/hdrheictest/2.HEIC",""],["https://shreytyagi.com/photos/hdrheictest/thumbs/3%20Medium.heic","https://shreytyagi.com/photos/hdrheictest/3.HEIC",""],["https://shreytyagi.com/photos/hdrheictest/thumbs/4%20Medium.heic","https://shreytyagi.com/photos/hdrheictest/4.HEIC",""],["https://shreytyagi.com/photos/hdrheictest/thumbs/5%20Medium.heic","https://shreytyagi.com/photos/hdrheictest/5.HEIC",""],["https://shreytyagi.com/photos/hdrheictest/thumbs/6%20Medium.heic","https://shreytyagi.com/photos/hdrheictest/6.HEIC",""],["https://shreytyagi.com/photos/hdrheictest/thumbs/7%20Medium.heic","https://shreytyagi.com/photos/hdrheictest/7.HEIC",""],["https://shreytyagi.com/photos/hdrheictest/thumbs/8%20Medium.heic","https://shreytyagi.com/photos/hdrheictest/8.HEIC",""],["https://shreytyagi.com/photos/hdrheictest/thumbs/9%20Medium.heic","https://shreytyagi.com/photos/hdrheictest/9.HEIC",""],["https://shreytyagi.com/photos/hdrheictest/thumbs/10%20Medium.heic","https://shreytyagi.com/photos/hdrheictest/10.HEIC",""],["https://shreytyagi.com/photos/hdrheictest/thumbs/11%20Medium.heic","https://shreytyagi.com/photos/hdrheictest/11.HEIC",""],["https://shreytyagi.com/photos/hdrheictest/thumbs/12%20Medium.heic","https://shreytyagi.com/photos/hdrheictest/12.HEIC",""],["https://shreytyagi.com/photos/hdrheictest/thumbs/13%20Medium.heic","https://shreytyagi.com/photos/hdrheictest/13.HEIC",""],["https://shreytyagi.com/photos/hdrheictest/thumbs/14%20Medium.heic","https://shreytyagi.com/photos/hdrheictest/14.HEIC",""],["https://shreytyagi.com/photos/hdrheictest/thumbs/15%20Medium.heic","https://shreytyagi.com/photos/hdrheictest/15.HEIC",""],["https://shreytyagi.com/photos/hdrheictest/thumbs/16%20Medium.heic","https://shreytyagi.com/photos/hdrheictest/16.HEIC",""],["https://shreytyagi.com/photos/hdrheictest/thumbs/17%20Medium.heic","https://shreytyagi.com/photos/hdrheictest/17.HEIC",""]],"title":"HDR HEIC Test","html":"<p>Photos will not show unless your browser supports HEIC.<\/p>\n<p>After clicking on thumbnail or clicking on next/prev button, wait 10-20 seconds for the photo to load if your connection is slow since some of them are around 5MB in size.<\/p>\n<p>Tap on an image a few times if HDR effect is missing.<\/p>","mins":1,"math":false},"articles/noimaxweapons":{"gallery":null,"title":"No IMAX for Weapons","html":"<p>I’ve received official confirmation that Weapons will NOT be released in IMAX in India. With 100% on Rotten Tomatoes and critics calling it the most original and terrifying horror movie in years, it’s unfortunate that Indian audiences won’t get to experience it in the best way. I understand this news may disappoint many, but the decision stems from factors beyond anyone’s control. Certain practical constraints have made an IMAX release unfeasible in India. That said, do seek it out at premium non-IMAX 4K Atmos venues or the best possible screen you can find!<\/p>","mins":1,"math":false},"articles/whyavatar2k":{"gallery":null,"title":"Why are even the new Avatar movies still finished in 2K instead of 4K? Explained:","html":"<p>Let’s break down the computational demand of rendering CGI at different formats and settings.<\/p>\n<p><strong>Resolution Comparison:<\/strong><\/p>\n<ul>\n<li>2K = 2048 × 1080 = 2,211,840 pixels/frame<\/li>\n<li>4K = 4096 × 2160 = 8,847,360 pixels/frame<\/li>\n<\/ul>\n<p>→ 4K has exactly 4× the pixels of 2K.<\/p>\n<p>Now, suppose rendering CGI at 2K resolution, 24 frames per second (fps) requires γ units of processing power. Then:<\/p>\n<p>Rendering the same scene in 4K at 24fps = 4γ<\/p>\n<hr>\n<p><strong>What happens with 3D?<\/strong><\/p>\n<p>In 3D, every frame must be rendered twice — one for each eye (left and right). So for 2K 3D at 24fps, the processing power required becomes:<\/p>\n<p>2K 3D at 24fps = 2γ<\/p>\n<hr>\n<p><strong>What happens with higher frame rates?<\/strong><\/p>\n<p>Doubling the frame rate from 24fps to 48fps means twice as many frames to render, so:<\/p>\n<p>2K 3D at 48fps = 4γ<\/p>\n<hr>\n<p><strong>Key Insight:<\/strong><\/p>\n<p>2K 3D 48fps = 4K 2D 24fps = 4γ<\/p>\n<p>So even though it’s “only” 2K, 3D and high frame rate together push it to the same rendering load as 4K.<\/p>\n<hr>\n<p><strong>Why Most Animations Are Still in 2K (Even in 2025)<\/strong><\/p>\n<p>Even today in 2025, the vast majority of animated films — including Hollywood blockbusters — are rendered in 2K, 2D, 24fps. Why? Because jumping to 4K multiplies the processing load 4×, making it impractical or prohibitively expensive for most studios.<\/p>\n<p>But James Cameron’s Avatar films are the rare exception. They are rendered in 2K, 3D, 48fps, which already matches the rendering burden of 4K, 2D, 24fps (4γ).<\/p>\n<hr>\n<p><strong>Why Not Render Avatar in 4K?<\/strong><\/p>\n<p>Because that would mean:<\/p>\n<p>4K × 3D × 48fps = 8K 2D 24fps worth of processing power = 16γ<\/p>\n<p>That’s four times more demanding than what even Avatar currently uses — and way beyond what modern render farms can handle. Rendering at that scale could overwhelm even the most advanced systems and “blow up the machines”, as the saying goes.<\/p>\n<p><em>Disclaimer: The content of this write-up is original but has been enhanced with AI for better flow and presentation.<\/em><\/p>","mins":1,"math":false},"articles/mahavatarnarsimhareview":{"gallery":null,"title":"Mahavatar Narsimha 3D Hindi Review","html":"<p>Mahavatar Narsimha 3D Hindi Review – A Beautiful Masterpiece of an Animated Movie Ruined by AI’s Horrendous 2D-to-3D Conversion and Uncomfortable AI Face Swapping<\/p>\n<p>Before I elaborate on the long list of flaws, please first know that this is a superbly imagined movie with jaw-dropping cinematography, stylish camera work, beautiful visuals, intelligent screenplay, fast-paced editing, classy action, and commendable direction. The shot selection feels very cinematic.<\/p>\n<p>Although the animation quality clearly looks low-budget in many scenes, you can see the care and effort that went into creating everything. It is truly enjoyable to watch and remains engaging throughout. The dialogues, music, and sound effects are the strongest elements. It’s such a feel-good yet heart-wrenching film that I couldn’t help but join my hands and chant “Om Namah Bhagavate Vasudevaya” during the climax scene.<\/p>\n<p>Now, that said, here are the unfortunate massive flaws:<\/p>\n<ol>\n<li>\n<p><strong>AI-Enhanced Faces Look Unpleasant<\/strong><br>\nThey have used AI to enhance the faces of most human-like characters (except the demons), especially the eyes. This makes the faces look overly artificial and unpleasant. The uncanny valley effect is very strong in most scenes featuring those characters. Even the demons appear to have slight AI enhancement in their eyes in some moments.<\/p>\n<\/li>\n<li>\n<p><strong>AI Lip-Sync Is Inconsistent<\/strong><br>\nThey have attempted to use AI for syncing the lip movements with the dialogues. This effort is a hit and miss. At times, the lip movements appear strange and unnatural.<\/p>\n<\/li>\n<li>\n<p><strong>Noticeable Frame Drops and Judder<\/strong><br>\nThere are frequent frame drops and visible judder throughout the movie. This gives the film a low-quality feel and becomes distracting after a point.<\/p>\n<\/li>\n<li>\n<p><strong>Terrible 2D-to-3D Conversion<\/strong><br>\nThis is not a native 3D movie. It was originally rendered in 2D and later put through a low-grade AI 2D-to-3D conversion software. The result is the worst 3D experience I have ever seen. The 3D is not just poor, it is fundamentally wrong. Backgrounds sometimes appear in the foreground. Depth is assigned incorrectly to random objects. Edges of objects are surrounded by rotoscoping artifacts. At certain times, it feels completely flat. Other times, it turns into a disorienting and messy 3D hallucination. This creates a huge distraction for anyone familiar with how proper 3D should work. Casual viewers may simply feel that wearing 3D glasses reduces the blur and accept it as fine. In reality, the 3D is a terrible flaw that ruins the charm of an otherwise beautiful animation.<\/p>\n<\/li>\n<li>\n<p><strong>Gimmicky Black Bars and Frame Breaks<\/strong><br>\nIn many scenes, the filmmakers have added black bars to the top and bottom with objects appearing to break through the frame. This suggests that some design effort went into planning for a 3D experience. Ironically, there is no proper 3D effect… only the frame breaks. The size of the black bars keeps changing, which makes the whole thing look gimmicky. This creative choice felt completely unnecessary and even irritating.<\/p>\n<\/li>\n<li>\n<p><strong>Poor Framing for Scope Aspect Ratio<\/strong><br>\nAlthough the film is presented in scope (2.39:1), it was clearly designed in a taller aspect ratio. As a result, several shots suffer from poor headroom, with character heads getting cropped more than they should. This makes the framing feel awkward and careless.<\/p>\n<\/li>\n<\/ol>\n<p><strong>Conclusion<\/strong><br>\nPlease watch this movie. It is visually and emotionally powerful. However, do not watch it in 3D, not even by mistake. Choose the 2D version instead so you can enjoy the story without all the distractions.<\/p>\n<p>This movie now comes first in my WORST 3D EXPERIENCE list.<\/p>","mins":3,"math":false},"articles/war2dolbycinema":{"gallery":null,"title":"War 2 in Dolby Cinema","html":"<p>War 2 becomes world’s first Indian Hindi movie to be released in Dolby Cinema format.<\/p>\n<p>This is ALSO the first Indian Dolby Cinema format movie to be released in Dolby Cinema format in India (as Dolby Cinema opened in India just a few weeks ago). But this is NOT the first Indian movie to get a Dolby Cinema format release because Indian Telugu movies #RRR, #Pushpa2 and #GameChanger released in Dolby Cinema format overseas already (not in India).<\/p>\n<p>The movie is set to release in 3 weeks which is why I think it might be an SDR to HDR post conversion instead of native HDR. Nevertheless it would be much better this way than to show normal SDR DCPs (non-Dolby Cinema formatted) in Dolby Cinema screens. The movie is being graded in Dolby Vision at @AnnapurnaStdios in Hyderabad.<\/p>\n<p>People of Pune MUST NOT MISS this Dolby Cinema experience at Citypride, Kharadi. Prefer Dolby Cinema over IMAX since there is no expanded ratio in this movie and @YRF does great Atmos mixes.<\/p>\n<p>Hindi cinema, especially YRF studio, loves 2K DCPs. But as a shocking exception this time, as far as I got to know, #War2 will most likely get a 4K HDR DCP for Dolby Cinema venues. The non-VFX shots are native 4K resolution while the VFX shots are done in 3K resolution.<\/p>\n<p>IMAX too will get a 4K DCP, but for that, I can’t confirm if that’ll be true 4K, i.e., if a 4K master has been sent to IMAX by YRF. Because even if IMAX receives 2K content, they always upscale to 4K before making a DCP.<\/p>","mins":1,"math":false},"blogs/myfavouriteimaxexperiences":{"gallery":null,"title":"My Top 5 Most Memorable IMAX Experiences","html":"<p>IMAX has given me my most memorable cinema experiences and will continue to be my go to for special movies. This post touches upon my top 5 most memorable experiences in short. So, I’ve had 39 IMAX visits so far (33 different movies). Out of all of them, only two visits ever made me feel emotional because of the surreal audio visual experience. Yes, the “fidelity” made me emotional, not the movie’s story!<\/p>\n<ul>\n<li>\n<p>The first was #Avatar (2022 re-release in IMAX 3D at Select CityWalk, Delhi). I had the best possible seat. The 3D was clean, the colors were vibrant, the picture was bright, and the sound was crisp. During the tree destruction scene, I remember just sitting there, stunned, thinking, “I can’t believe cinema can feel this good.”<\/p>\n<\/li>\n<li>\n<p>The second was #Sinners (2025) during my third watch (first was Select Citywalk, which was decent) at Priya IMAX. They had increased the brightness for this dark-looking film, and it made a world of difference. It was noticeable brighter than SCW IMAX. When the “I Lied to You” sequence ended, my heart was beating at a dangerously fast pace. I was almost about to cry. The pristine visuals, the moving powerful 12-channel sound, and the massive field of view just overwhelmed me.<\/p>\n<\/li>\n<li>\n<p>#Titanic 3D (2023 re-release) at Select CityWalk, despite being scope throughout, looked bright and beautiful. During the ship-sinking scene, I remember being thrilled to the core.<\/p>\n<\/li>\n<li>\n<p>#Interstellar 2025 re-release at Priya IMAX felt far more impactful than my previous watch at Select CityWalk in 2023. The new DCP was much better, and the venue had superior sound and field of view. I was having a blast!<\/p>\n<\/li>\n<li>\n<p>#MissionImpossibleTheFinalReckoning at Priya had thunderous moving 12-channel sound and incredible immersion. I genuinely enjoyed the sound design throughout the entire film.<\/p>\n<\/li>\n<\/ul>\n<p>These five are my top IMAX memories. But only Avatar 3D (at Select CityWalk) and Sinners (at Priya) made me feel something deep… just because the experience was that good.<\/p>","mins":1,"math":false},"articles/supermanhindivsenglish":{"gallery":null,"title":"Superman Hindi dub vs English comparison","html":"<p>I’ve seen both versions of Superman now, and honestly, the Hindi dub holds up really well. In fact, some lines even felt better written in Hindi than the original English ones.<\/p>\n<ul>\n<li>That viral “Chhoti bacchi ho kya” line happens in a scene where characters are naming punk rock bands. Since most Indians wouldn’t get those US band references, the dub replaced them with Desi movie names like Baaghi and Heropanti. It actually worked and felt fun, not cringe.<\/li>\n<li>“Brain beats brawn” becomes “Akal sabse balwaan,” which fits perfectly in tone and rhythm.<\/li>\n<li>In a scene where Superman is lying down exhausted, Mr. Terrific says “This ain’t playtime” in English, which felt flat. In Hindi, “Apne gaon ki khatiya samajh ke lete hai kya?” landed funnier and more desi.<\/li>\n<li>“I make mistakes, and that makes me human” becomes “Haan mujhse galtiyan hoti hain, lekin galtiyaan insaano se hi hoti hain,” which hit harder and felt more sincere.<\/li>\n<\/ul>\n<p>All in all, I was fully entertained by the Hindi version. After watching both, I actually prefer the Hindi dub.<\/p>","mins":1,"math":false},"articles/superman3dreview":{"gallery":null,"title":"Superman 3D Review","html":"<p>Just watched this for the second time (English this time) on the same PXL flat screen in CP67 Mohali (also the same seat), so I think I have sufficient experience now to give my opinion on the 3D. This movie is a perfect example of how 3D can actually add value, without necessarily needing those gimmicky pop-out effects. The shots are crafted in a way that 3D clearly enhances the experience (not like Jurassic World: Rebirth where 3D was not adding any value).<\/p>\n<p>Here’s what stood out:<\/p>\n<ul>\n<li>There are tons of close-ups using special wide-angle lenses that focus really close, which gives a soft background blur. In 3D, these faces look much more dimensional (sculpted). You can feel the curve of the nose, the eyes, and the distance from the background.<\/li>\n<li>Many fight scenes also use crazy camera angles that move in and out or spin around, and those movements feel so much better with 3D depth.<\/li>\n<li>Even the aerial shots are composed with 3D in mind.<\/li>\n<\/ul>\n<p>I haven’t seen the 2D version, but I completely understand why James Gunn said he prefers the 3D version. The film is extremely bright — so bright that in many shots, highlights are completely blown out with no detail. But this brightness works in 3D’s favor. Even on the dullest 3D screens, this film won’t look dim. You can wear two pairs of 3D glasses and still not feel the brightness is low. That’s how bright it is.<\/p>\n<p>As for the stereo conversion:<\/p>\n<ul>\n<li>It’s mostly very good. No artifacts anywhere.<\/li>\n<li>Most shots that could benefit from 3D do benefit from it.<\/li>\n<li>The depth feels inconsistent. Some close-ups have amazing depth, while many long shots (zoomed-in shots) or some (not all) over-the-shoulder shots have noticeably lower depth.<\/li>\n<li>Many stereo supervisors use hyper stereo in those shots to add more parallax, but they haven’t done such things here — that’s the only area I feel could’ve been improved.<\/li>\n<\/ul>\n<p>That said, in some wide shots like the ones showing Jarhanpur mob or that epic opening shot, they do use hyperstereo, and you can clearly feel multiple layers in the image. Those moments really shine apart from the close-ups that I loved the most.<\/p>\n<p>Overall, I won’t call it the best 3D conversion ever. Films like Deadpool 3, GOTG2, Avengers Endgame and Thor Ragnarok had stronger stereo depth. But this one is still really good because the content and style of this movie so strongly suits 3D! Definitely worth watching in 3D at least once. Good job, DNEG!<\/p>","mins":2,"math":false},"articles/supermanmoviereview":{"gallery":null,"title":"Superman Movie Review","html":"<p>I really liked how smartly this reboot has been handled by James Gunn. It felt just like MCU did in Spider-Man Homecoming, where they didn’t waste time redoing the origin story. Same here. They never show how Superman came from another planet or how his parents died, but all of that is still there in the background, told very subtly. So even if someone has never seen a Superman movie, they’ll get the idea, and for people who have already seen the origin a million times, it won’t feel repetitive. The story jumps right into the present but still keeps you emotionally connected. They don’t formally introduce Lois Lane, Lex Luthor or any characters, but somehow you start understanding them naturally while watching. It doesn’t even feel like a reboot. You can just imagine this as a continuation of Man of Steel with a new cast and it will still work perfectly. That’s the best part.<\/p>\n<p>Because think about it, how many times will you show a new world that doesn’t have superheroes and then there is one and then many more… we have seen those progressions many times in many movies now. Just deal with it — there is this Earth and there are superheroes here, that’s it! There are many new characters and meta-humans in this world, but they just exist, and Gunn has placed them so naturally that it doesn’t feel forced at all. Within 15 minutes you feel like you know this world already.<\/p>\n<p>At the heart of it, the story is about Superman figuring out his purpose and dealing with emotions and how the world sees him. Yes, he needs to save the world and we know he will eventually save the world — what’s new about that? That’s why the story is such that we are more worried about Superman’s emotions and his journey of self-exploration more than him saving the world.<\/p>\n<p>Interestingly, the story is also about Lex Luthor dealing with similar emotions in his own way (you notice that in the end). That emotional angle really connects with today’s generation because we all somewhere care about how we’re perceived. Even with all the larger-than-life elements, the movie feels grounded.<\/p>\n<p>Now talking about action:<\/p>\n<ul>\n<li>The flight scenes are super well done. The camera stays very close to Superman, the POV shots make you feel the speed and intensity, and it actually feels like he’s flying.<\/li>\n<li>The visuals are colourful and bright — exactly how they should be in a Superman film.<\/li>\n<li>Lots of wide-angle shots are used, but very close to the actors’ faces, with soft blur in the background. It gives a very intimate feel.<\/li>\n<li>Gunn isn’t scared of keeping the camera right in the actor’s face, and that really helps in making us feel their emotions.<\/li>\n<li>The humour is nice — not dark like the old DC movies. It’s colourful, light and fun just like it should be.<\/li>\n<li>Music is great too.<\/li>\n<\/ul>\n<p>The Hindi dub is also very well done. Some jokes have been adapted to Indian references and honestly it didn’t feel odd at all. I still want to watch it once in English just to compare, but even in Hindi, it felt like a serious professional job.<\/p>\n<p>Overall I genuinely loved the film. It felt new, yet familiar, emotional but fun, and something I’d happily rewatch in theatres at least three times. James Gunn has done a brilliant job with this one.<\/p>\n<p>Overall an action-filled cinematic experience with a good story I thoroughly enjoyed!<\/p>","mins":3,"math":false},"articles/dolbycinemaindiareview":{"gallery":null,"title":"Dolby Cinema Pune: Complete In-Depth Review","html":"<p>This is such a new and premium technology for India that it would be disrespectful to reduce it to a small write-up. So I request you to unblock 20 minutes time from your day and read this entire article which took me 7 hours to write! I promise, it will answer all your questions and you won’t be able to resist sharing it further!<\/p>\n<hr>\n<p>The Dolby Cinema at City Pride Multiplex, Kharadi, Pune is India’s first Dolby Cinema and screened its first feature movie (F1) on 3rd July 2025.<\/p>\n<p>So firstly, those who don’t know about Dolby Cinema, please don’t confuse it with Dolby Surround, Dolby 5.1, Dolby 7.1 or Dolby Atmos because those are separate sound-only technologies which have been in India for decades. Dolby Cinema is something entirely different because it uses Dolby Vision technology for projecting movies in HDR at cinemas, which is a huge achievement! Furthermore, they are able to achieve nearly pure blacks and extreme contrast ratios that no other cinema technology can even come close to (except ONYX/Luxon LED cinemas, but they can’t be compared with this since Dolby Cinema is a projection technology). The entire audi of Dolby Cinema is designed by Dolby themselves. So not only the sound, but also architecture, seats, colours, screen, projectors, speakers… each and everything is designed by Dolby.<\/p>\n<p>Please note that ONLY the audi 6 is Dolby Cinema. Audi 7 has a 4K laser projector with Dolby Atmos sound but that audi is NOT a Dolby Cinema. Audi 1-5 don’t even have Dolby Atmos sound. So for Dolby Cinema, make sure you’re booking tickets for audi 6.<\/p>\n<p>It features an unusual 2.1:1 aspect ratio screen which does NOT go floor to ceiling but does go wall-to-wall. The width as measured by me and Kaustubh Debnath using a laser measuring device came out to be approximately 55ft wide and 26.2ft tall. This is a hybrid between 2.39:1 and 1.85:1. So neither flat ratio nor scope ratio content can fill the screen. But both ratio content will have very small black bars. The projector and system have been designed to automatically adjust based on DCP ratio. It, however, does not have adjustable lens and CANNOT do a custom zoom to fill the screen if the movie is 2:1 or 2.1:1 inside a flat 1.85:1 container. So if the movie is 2.39:1, it will cover the width; if the movie is 1.85:1, it will cover the screen height; but if the movie is inside a container with hardcoded black bars, the movie will be window-boxed.<\/p>\n<p>This cinema uses dual 4K laser projectors that support up to 4K HDR 120fps in 3D as well as 2D. The projectors can go much brighter but are limited to 108 nits (31 foot Lamberts) for HDR presentations. That’s the peak brightness which the provided content is mastered to be played at.<\/p>\n<p>Since it supports 88% Rec.2020 colourspace, they use proprietary Dolby Wide Colour Gamut which can show much deeper shades of colours than P3 colourspace (which all other cinemas use).<\/p>\n<p>This cinema has a 61-channel Dolby Atmos sound setup (29.18.14). There are 5 full-range front speakers and 10 front-subwoofers (2 below each of these speakers) behind the screen. Then there are 9 speakers on the left wall, 9 on the right wall, 6 on the back wall and 18 speakers on the ceiling. There are 2 surround-left subwoofers and 2 surround-right subwoofers. The special thing is that all the surround speakers and subwoofers are hidden behind the acoustically transparent wall (except 2 back-center speakers near the projector). The audi has a spaceship-style dual door entrance where there is kind of an airlock in between and you have to open two doors to enter the audi. This isolates all possible sound from the lobby area or other auditoriums.<\/p>\n<p>The floor, ceiling, seats, walls… everything is darkest matte black, because it helps in the contrast ratio. Due to government mandate, they had to put blue strips on stairs but they face upwards, so have minimal interference with screen. Plus, they dim the strips during the movie.<\/p>\n<p>The seats here are NOT the same premium seats which Dolby Cinema is famous for in USA. Also, their famous butt-kicker bass vibration system is NOT used in these seats. They‘re just above average comfortable seats. PVR PXLs have better seats!<\/p>\n<p>The seating is not very steep but steep enough to prevent heads blocking the screen. Actually, Dolby Atmos sounds good if the audi is deeper, there is a longer side wall to show off the pin point accuracy of audio objects. But deep audis have to sacrifice seating steepness to be able to adjust enough rows till the end. Due to the same reason, the screen doesn’t feel as immersive as IMAXs. But this doesn’t mean that it looks small. Sit half way back and screen looks huge, you don’t have to tilt your head up either.<\/p>\n<p>One of the most important aspects is 3D. Since Dolby Cinema uses dual projectors, there is no alternate flickering that happens in IMAX with Laser and RealD. This makes the 3D smoother. Further, it uses sophisticated colour filter technology in the 3D glasses which is superior to the circular polarised technology used with most new 3D laser projectors. Due to the quality and high-end technology there is absolutely zero ghosting and no noticeable loss in brightness. It looks as good in 3D as in 2D!<\/p>\n<p>There is something also special about the way Dolby Cinema handles motion. 24 fps content feels judder free even in shaky scenes or fast panning scenes. Sometimes it almost feels like HFR even if it isn’t.<\/p>\n<hr>\n<p>I visited the Dolby Cinema on 3rd and 4th July and was fortunate enough to see 10 demos and 2 movies in HDR! Below is the detailed account of everything they showed and how the experience for each of them was!<\/p>\n<p>1. Dolby Cinema Universe (Demo Trailer in 2D Scope 4K HDR Atmos)<\/p>\n<p>Since it was Dolby’s demo, it definitely looked and sounded good. However, since it barely had any real footage, hard to appreciate or understand HDR. It was like a bright, colourful and contrast-rich demo with a lot of moving audio elements and some deep bass moments.<\/p>\n<p>2. Top Gun: Maverick (Darkstar Take-Off Clip in 2D Scope 4K HDR Atmos)<\/p>\n<p>HDR and wide colour gamut became slightly more noticeable here… in reflections on Cruise’s helmet, specular highlights on the plane’s body, the display screens on the plane, etc. Fake film grain emulation was strongly noticeable and so were the true 4K details. Sound was loud and thundering, there weren’t enough of them but there definitely were some not-so-obvious overhead effects.<\/p>\n<p>3. Dune: Part Two (Spice Harvester Attack Clip in 2D Scope 4K HDR Atmos)<\/p>\n<p>HDR was not that noticeable here but since I’ve studied Dune: Part Two too many times in IMAX in SDR and at home in Dolby Vision, I knew that highlight details are getting recovered very well here in Dolby Cinema. But otherwise, to the untrained eye, it would just look like a super bright version, not HDR. The sound was the highlight here. It was loud but still no distortion at all, very crystal clear and satisfying. Audio objects could be distinctly felt at different locations of the audi.<\/p>\n<p>4. The Batman (Penguin Car Chase Clip in 2D Scope 4K HDR Atmos)<\/p>\n<p>This is the scene where the blacks were shown off. This is a movie infamous for being too dark and hardly anything being visible in night shots. But here at Dolby Cinema, it felt like a different movie altogether. It was dark yet so clearly visible, pleasing to the eye, nobody can complain. The 4K detail, the colours and the specular highlights were decently noticeable in the car lights and explosions. But the Atmos sound is what blew my mind away. I have never experienced audio so immersive. When the car crashes and tumbles, it felt like I was inside it! Sound rotated top to right to bottom to left like a front-load washing machine! And when finally there is a scene where suddenly a car flies and falls in front of the screen, it clearly swooshes from the back to top and then ends in the front. Undoubtedly the best Atmos experience of my life in these 5 minutes.<\/p>\n<p>5. Darkest Hour (Churchill’s Speech Clip in 2D Flat 4K HDR Atmos)<\/p>\n<p>This is a clip where they again showed off every aspect of their projector. The scene when the room goes all red, there’s a red bulb that shines and appears super HDR bright. The reds in the room and the face are so deep red that it is simply not possible with P3 colorspace only… you do need Rec.2020 colourspace here. And also pure red is the toughest colour to show brightly, so that’s where HDR helps again. The shadows in some scenes were extremely dark, yet you could see various shades of grey, without straining your eyes! Sound was not the key highlight of this clip, but dialogues were crispy! I loved this demo the most.<\/p>\n<p>6. Barbie (Dance The Night Clip in 2D Flat 4K HDR Atmos)<\/p>\n<p>Yet another HDR + Rec.2020 show-off but now in a bright scene. All the colours pop, yet the faces have absolutely perfect skin tones. The dance scene has lights go on and off again and again, some lights shining and shimmering in the background. They all took full advantage of HDR and looked very pleasing. Sound was not the highlight of the clip but the music did have some Atmos effects here and there.<\/p>\n<p>7. Pushpa 2 The Rule (Sooseki Telugu Song Clip in 2D Scope 4K HDR Atmos)<\/p>\n<p>I have seen this movie in Dolby Vision at home and I hated it because the contrast ratio is too high, so blacks get crushed if your device is not premium enough. My TV struggles a lot with the shadows of Pushpa 2 in Dolby Vision. This is something also mentioned by the guy who was hosting the event for us; he said that this movie has a very high contrast ratio. But here is the thing: this is Dolby Cinema and it was a cakewalk for it to handle such high contrast grading. Everything in this clip… the shadow detail, the contrast, the colours, the 4K detail, the specular highlights (from reflections off the ornaments, background lights) looked spectacular! It can be treated as an AV demo for high-end devices and projectors. I noticed many Atmos object effects too in the music (including one overhead panning). I wish I could see the whole movie once in Dolby Cinema, it was that good!<\/p>\n<p>8. Spider-Man: No Way Home (Electro’s Entry Clip in 3D Scope 2K HDR Atmos)<\/p>\n<p>This is again one of those super dark infamous scenes, where even in IMAX I struggled to see anything clearly. On my Bravia in Dolby Vision, I can only hear stuff but can’t see anything, it’s THAT dark. But in Dolby Cinema… what is dark? It was handling this scene in HDR so comfortably that I was shocked this time even more than with The Batman clip. And oh, this was 3D, which should ideally become an abomination for a super dark scene, right? But even with the glasses on, there was negligible loss of brightness. You’ll have to check many times to realise the 2–3% dimming. And the most important thing is that 99% projectors produce ghosting (double images even with glasses on) in 3D if the scene is too dark with a small bright element. That’s exactly what happens when Electro appears in this super dark scene. You know, I tried my best to look at every corner of the screen, every element, every angle possible… but couldn’t find any ghosting… not even 0.1% of ghosting. How can they achieve the absolute perfect 3D? That’s partially also because of the colour filter technology they use for 3D (instead of the polarised filters in other cinemas). Among all the clips shown, this was the most challenging clip to do in 3D, and Dolby Cinema passed with “flying colours”. The Dolby Atmos sound was also pretty good, although I didn’t feel any overheads, there were plenty of object-based effects in the 2D space which were exciting enough.<\/p>\n<p>9. The Super Mario Bros. Movie (Rainbow Car Chase Clip in 3D Scope 2K HDR Atmos)<\/p>\n<p>This was the second 3D test, but in a bright and vibrant scene. Since this is a native 3D animation, the 3D enhanced the 3D shape of these three dimensional animated characters. Of course, there was again no ghosting, but what this scene showed off more was the wide colour gamut. The characters were riding a rainbow! Every possible colour in the world was there on it, and it looked absolutely delicious to watch. I don’t recall any standout overhead effects in this clip but the sound was very enjoyable, clean, and full.<\/p>\n<p>10. Dolby Cinema Universe 3D (Demo Trailer in 3D Scope 4K HDR Atmos)<\/p>\n<p>This was the 3D version of the same demo shown in the beginning. The live-action shots were clearly post-converted from 2D to 3D. Other CGI shots could very well have been natively rendered in 3D. But the main thing is that I felt no loss in contrast, colours, or brightness in the 3D version; reassuring that 3D and 2D both are equally good in this cinema. 3D doesn’t affect the picture or colour quality in Dolby Cinema, unlike IMAX where colours and brightness visibly get duller after wearing glasses.<\/p>\n<p>11. F1 (Entire Movie in 2D Scope 4K HDR Atmos)<\/p>\n<p>This is a movie by Apple: the real HDR junkies! And as expected, the HDR in this movie blew me away. It’s actually funny that this movie was wayyyy better than every demo shown before. Throughout the demos, I kept feeling like “Okay, you are showing HDR, and I can feel it a bit, but why can’t I feel the kind of HDR-popping specular highlights which I feel on OLED TVs? Like those sparkling kind?” Well… I felt exactly that kind of HDR in this movie. The clouds were shining in HDR and highlights were getting recovered (I can say that because I have already seen this movie once in 2K Laser 5.1). Every tube light, every lamp, every light in the stadium and on the cars, was SHINING… just as it is supposed to be in HDR. The overall brightness of scenes did not go very bright (which many HDR graders notoriously do). Raising the overall scene brightness for a long time can cause pain in the eyes. So instead of raising the full scene’s brightness, it was throughout kept in a comfortable range and graded in a way that only the specular highlights went beyond the SDR range… creating a “dynamic” and realistic image while not hurting the eyes. This was reference-level HDR, which you can show to new learners and tell them: “See, that’s how HDR is done!”. Dolby Cinema proved that it can make you feel, using a projector, the same kind of HDR you feel on OLEDs. The 4K too was reference level here. No unnecessary fake film emulation to ruin detail… just crispy clean true 4K. Doing such crisp 4K with dual projectors is tough because laser alignment needs to be done, and no matter how precise you do it, even half a millimeter offset can reduce the sharpness (according to me). So despite being a dual projection system, it is the sharpest projection I have ever seen… sharper than every premium cinema and IMAX I have ever been to!<\/p>\n<p>Now about the Atmos sound in F1. On my first viewing of F1 in 5.1, I had complained that the mix hardly used any effects like zipping cars around in surround. But here, in this highly calibrated Atmos system, I realised that there actually were a decent number of such effects… just that they were very subtle and could be missed easily on sub-par systems. But not here. In Dolby Cinema, you can actually hear the detail in sound, just like the director intended. I know this is the kind of cheeky line brands use to sell their sound technologies, but I’m getting a firsthand experience of it now. Cars did zip around in surround. Not just cars, there was a shot of inside the car (facing Brad Pitt) and with each turn his car took, crowd cheer changed direction from side left to side right! There was a scene in the beginning with loads of fireworks, and they all popped in the height channels. The movie had a lot of super-loud moments but never became annoying since there is no distortion.<\/p>\n<p>But yeah, overall, although it was undoubtedly a weakly done Atmos mix, it was still able to sound very good because of the impeccable hardware, the calibration, and audi architecture. You know, I hadn’t liked the movie much in my first viewing in 4DX 2K Laser 5.1 in Mohali… but this time in Dolby Cinema, I ended up loving the experience! This speaks “volumes” about how much the experience matters for the story to be felt. I didn’t feel the craving for the expanded image we get in IMAX. After this experience, I have realised that given a choice between expanded image vs expanded dynamic range, I’d always choose the latter.<\/p>\n<p>12. Jurassic World: Rebirth (Full Movie in 3D Scope 2K HDR Atmos)<\/p>\n<p>As I have already highlighted the advantages of Dolby Cinema’s 3D before, the same applies for this entire movie too. It was a clean 3D image, no ghosting even in dark and challenging scenes. For example, in a dark scene when the character suddenly lights up a red flare, this could have easily faced ghosting issues in 3D, but not here. All dark scenes were comfortably visible with 3D glasses. The movie was shot on film, and you can immediately tell that this was a 2K DCP. But surprisingly, the 2K doesn’t look pixelated, it looks good despite not being as detailed as 4K. I don’t know what kind of upscaling their projection system uses internally, but it works better than IMAX’s 2K-to-4K upscaled DMR content. While IMAX does slight smoothening to make the pixels disappear on their 4K projectors, Dolby Cinema handles it in a way that looks much better.<\/p>\n<p>In this movie, the HDR is not as spectacular as in F1, it is not graded to look that way. But whenever needed, like specular highlights reflecting off car edges, or bright sun shining, bright red flares, etc., the HDR is taken advantage of. I feel that the HDR grading is very subtle for this movie, the colours do not pop much, and it is likely a stylistic choice and partially also because of the limitations of using film. Film cannot capture a lot of dynamic range. If a scene is in bright day, the shadows will be crushed and appear black with little to no detail. Similarly, there are numerous scenes where highlights could have been recovered in HDR: like the bright day visible outside the cave’s mouth, the clouds, hard sunlit faces; but this movie has all those things clipped and at many times it doesn’t even feel like HDR.<\/p>\n<p>Same goes for the 3D conversion. The movie was clearly not shot keeping 3D in mind, so there are almost no scenes that take much advantage of 3D. The parallax is not bad, especially in close-up shots and the shots where we see deep down from a mountain top. But despite that, the 3D feels average at best, partially because of the modest parallax in 3D conversion and partially because of the fact that the shots are not designed for 3D. But overall, due to the excellent 3D technology of Dolby Cinema, the 3D experience was still very satisfying. Dolby’s 3D glasses are big, premium and comfortable.<\/p>\n<p>The movie’s Dolby Atmos sound was not upto the mark though. Apart from few deep bass roars and few subtle directional effects, there were almost no overhead effects. The mix was front heavy. What stood out was the dynamic range in the sound, even the loudest roars were clear, absolutely no distortion.<\/p>\n<hr>\n<p>Conclusion:<\/p>\n<p>If I have to conclude Dolby Cinema in one word, it is “perfection”. LED cinemas might be able to achieve similar blacks, but the “feel” of a cinema is with projectors. And Dolby Cinema brings out the best in terms of content as well as hardware quality with their godly projectors. This is an ultra-premium audio-visual technology (IMAX is nowhere close). And those who are technically aware about how HDR and Atmos works, they are gonna fall in love with how Dolby Cinema does real magic!<\/p>\n<hr>\n<p>Thank you if you read this whole article. I travelled 68 hours in train from Chandigarh to Pune and back, ONLY for this Dolby Cinema, and I have written almost everything I could, in this article. I have not used any kind of AI at all gor writing this. I have tried to be as factually correct as possible but my apologies in advance if there are any errors.<\/p>\n<hr>\n<p>I would firstly like to thank Mr. Denzil Diaz for getting a Dolby Cinema DCP of F1 mastered for India specifically for this one-time show. He is the leading supporter and promoter of premium cinema formats in India with WB and Universal’s distribution.<\/p>\n<p>Then I’d like to thank the staff of Citypride Kharadi and the Dolby team for letting us record videos and take pictures of Dolby Cinema as much we wanted. They gave us all the information we wanted, and hosted us warmly.<\/p>\n<p>I would also like to thank my friends Mr. Aniket Bhosale, Mr. Dheeraj Deshmukh, Mr Kaustubh Debnath, Mr R Rahul and Mr. Chaturvedi for their help, guidance and support to make my Pune Dolby Cinema visit a success.<\/p>\n<p>I don’t know if and when I’d be able to visit a Dolby Cinema again, but the HDR and Surround Sound enthusiast in me is fully satisfied and is carrying core memories back to Chandigarh to cherish forever.<\/p>","mins":17,"math":false},"articles/lowoccupancyatdolbycinema":{"gallery":null,"title":"Dolby Cinema, Pune - A curious case of why occupancies are too low?","html":"<ul>\n<li>The matter of pricing has consistently been a si
