<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shrey Tyagi</title>
<meta name="description" content="Articles, lists and tools about cinema technology — IMAX, Dolby Cinema, HDR, 3D and encoding.">
<meta name="theme-color" content="#f0ece3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400..700;1,400..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  /* theme before first paint: stored choice, else the system */
  try { var t = localStorage.getItem('st-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* ==========================================================================
   shreytyagi.com — minimal redesign on hanji tokens
   paper / charcoal grounds · scarlet (cinnabar) as the only accent
   Figtree for words · DM Mono for dates and numbers
   ========================================================================== */
:root{
  --bg:#f0ece3; --bg-soft:#f7f5f0; --surface:#fbfaf8;
  --tint:rgba(22,19,15,.055); --tint-2:rgba(22,19,15,.09);
  --line:rgba(22,19,15,.1); --line-2:rgba(22,19,15,.18);
  --fg:#16130f; --fg-dim:#5c5853; --fg-mute:#8a867f;
  --accent:#b81f18; --accent-soft:#e8d2c8; --on-accent:#fff;
  --font:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --measure:720px; --wide:1180px; --gutter:20px; --bar:60px; --stick:60px;
  --r-xs:8px; --r-sm:12px; --r-pill:999px;
  --ease:cubic-bezier(.33,1,.68,1); --fast:140ms;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111114; --bg-soft:#1b1b1e; --surface:#222225;
    --tint:rgba(255,255,255,.06); --tint-2:rgba(255,255,255,.1);
    --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.17);
    --fg:#f1efec; --fg-dim:#b7b5b4; --fg-mute:#85837f;
    --accent:#ff5a52; --accent-soft:#321b1d; --on-accent:#16130f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111114; --bg-soft:#1b1b1e; --surface:#222225;
  --tint:rgba(255,255,255,.06); --tint-2:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.17);
  --fg:#f1efec; --fg-dim:#b7b5b4; --fg-mute:#85837f;
  --accent:#ff5a52; --accent-soft:#321b1d; --on-accent:#16130f;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--bar) + 20px)}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);
  font:400 16px/1.55 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-feature-settings:"ss01"}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
img,svg{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
main:focus,main:focus-visible{outline:none}
input[type=search]::-webkit-search-cancel-button{display:none}
::selection{background:var(--accent-soft)}
kbd{font:500 11px/1 var(--mono);padding:3px 5px;border-radius:5px;border:1px solid var(--line-2);color:var(--fg-dim);background:var(--bg-soft)}
.skip{position:absolute;left:-999px;top:8px;z-index:50;padding:8px 12px;border-radius:var(--r-xs);background:var(--fg);color:var(--bg)}
.skip:focus{left:8px}
.wrap{width:100%;max-width:calc(var(--measure) + 2*var(--gutter));margin:0 auto;padding:0 var(--gutter)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px);
  border-bottom:1px solid transparent;transition:border-color var(--fast),transform 220ms var(--ease)}
.bar.scrolled{border-bottom-color:var(--line)}
.bar-in{display:flex;align-items:center;gap:18px;height:var(--bar)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:15.5px;letter-spacing:-.01em;white-space:nowrap}
.seal{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--accent);color:#fff;
  font:700 10px/1 var(--font);letter-spacing:.04em;transform:rotate(-4deg)}
.nav{display:flex;align-items:center;gap:20px;margin-left:auto}
.nav a{position:relative;text-decoration:none;color:var(--fg-dim);font-size:14.5px;font-weight:500;padding:6px 0;transition:color var(--fast)}
.nav a:hover,.nav a[aria-current="page"]{color:var(--fg)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--accent)}
.tools{display:flex;align-items:center;gap:6px}
.icon-btn,.search-btn{display:inline-flex;align-items:center;gap:8px;height:34px;border:1px solid var(--line-2);background:transparent;
  border-radius:var(--r-pill);cursor:pointer;color:var(--fg-dim);transition:color var(--fast),background var(--fast)}
.search-btn{padding:0 6px 0 10px;font-size:14px}
.search-btn span{display:none}
.icon-btn{width:34px;justify-content:center}
.icon-btn:hover,.search-btn:hover{color:var(--fg);background:var(--tint)}
.icon-btn svg,.search-btn svg{width:16px;height:16px}

@media (max-width:820px){
  .bar-in{flex-wrap:wrap;height:auto;row-gap:0;padding-top:10px}
  .tools{margin-left:auto}
  .nav{order:3;width:calc(100% + 2*var(--gutter));margin:0 calc(-1*var(--gutter));padding:4px var(--gutter) 2px;gap:20px;
    overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:8px 0 10px;flex:none}
  .search-btn span,.search-btn kbd{display:none}
  .search-btn{width:34px;padding:0;justify-content:center}
  .bar.hide{transform:translateY(-100%)}
}

/* ---------- page ---------- */
main{flex:1;width:100%;max-width:calc(var(--measure) + 2*var(--gutter));margin:0 auto;padding:44px var(--gutter) 96px;outline:none}
main.is-wide{max-width:calc(var(--wide) + 2*var(--gutter))}
main.is-wide > :not(.tw):not(.tbar){max-width:var(--measure)}
body.wide .bar-in{max-width:calc(var(--wide) + 2*var(--gutter))}
.foot{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:center;padding-top:22px;padding-bottom:40px;
  border-top:1px solid var(--line);font-size:13.5px;color:var(--fg-dim);max-width:calc(var(--measure) + 2*var(--gutter))}
.foot nav{display:flex;flex-wrap:wrap;gap:16px}
.foot a{text-decoration:none}
.foot a:hover{color:var(--fg)}

/* home lede */
.home{margin:6px 0 40px}
.lede{font-size:clamp(21px,3.2vw,25px);line-height:1.4;letter-spacing:-.015em;font-weight:450;margin:0;text-wrap:pretty}
.lede-2{color:var(--fg-dim);margin:14px 0 0;font-size:15.5px;text-wrap:pretty}
.lede-2 a{text-decoration-color:var(--line-2);text-underline-offset:3px}
.lede-2 a:hover{text-decoration-color:var(--accent)}

/* page header */
.ph{margin-bottom:34px}
.crumb{display:flex;gap:7px;margin:0 0 14px;font:400 13px/1.4 var(--mono);color:var(--fg-dim)}
.crumb a{text-decoration:none}
.crumb a:hover{color:var(--fg);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.crumb i{font-style:normal;color:var(--fg-mute)}
h1{font-size:clamp(29px,5vw,40px);line-height:1.12;letter-spacing:-.025em;font-weight:620;margin:0;text-wrap:balance}
.meta{margin:14px 0 0;font:400 13px/1.4 var(--mono);color:var(--fg-dim)}
.sub{margin:12px 0 0;color:var(--fg-dim);font-size:16px;text-wrap:pretty}

/* index rows */
.grp + .grp{margin-top:34px}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--line);
  font:500 13px/1 var(--mono);color:var(--fg-dim);letter-spacing:.01em}
.gh span{color:var(--fg-mute)}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:16px;align-items:baseline;padding:9px 10px;margin:0 -10px;border-radius:10px;text-decoration:none;
  transition:background var(--fast)}
.row:hover{background:var(--tint)}
.row time{font:400 13px/1.4 var(--mono);color:var(--fg-dim);white-space:nowrap}
.row .t{font-weight:500;font-size:16px;line-height:1.4;letter-spacing:-.005em;text-wrap:pretty}
.row .m{font-size:13px;color:var(--fg-dim);white-space:nowrap}
.ext{color:var(--fg-mute);font-weight:400}
@media (max-width:560px){
  .row{grid-template-columns:auto 1fr;grid-template-areas:"t t" "d m";gap:2px 6px;padding:10px;}
  .row .t{grid-area:t}.row time{grid-area:d}.row .m{grid-area:m;justify-self:start}
  .row .m::before{content:"· ";color:var(--fg-mute)}
}

/* ---------- prose ---------- */
.prose{font-size:18px;line-height:1.7;overflow-wrap:break-word}
.prose > :first-child{margin-top:0}
.prose p{margin:0 0 1.1em;text-wrap:pretty}
.prose h2{font-size:23px;line-height:1.25;letter-spacing:-.015em;font-weight:620;margin:2em 0 .6em;text-wrap:balance}
.prose h3{font-size:19.5px;line-height:1.3;letter-spacing:-.01em;font-weight:620;margin:1.8em 0 .5em;text-wrap:balance}
.prose h4{font-size:17px;font-weight:620;margin:1.6em 0 .4em}
.prose ul,.prose ol{margin:0 0 1.2em;padding-left:1.3em}
.prose li{margin:.35em 0;padding-left:.2em}
.prose li::marker{color:var(--fg-mute)}
.prose li > p{margin:0}
.prose a{text-decoration-line:underline;text-decoration-color:color-mix(in srgb,var(--accent) 55%,transparent);text-underline-offset:3px;text-decoration-thickness:1px}
.prose a:hover{text-decoration-color:var(--accent);text-decoration-thickness:2px}
.prose strong{font-weight:620}
.prose img{width:100%;height:auto;margin:1.7em 0;border-radius:var(--r-sm);background:var(--tint)}
.prose hr{border:0;height:1px;background:var(--line);margin:2.4em 0}
.prose blockquote{margin:1.4em 0;padding-left:18px;border-left:2px solid var(--accent);color:var(--fg-dim)}
.prose code{font:400 .86em/1.5 var(--mono);background:var(--tint);padding:2px 5px;border-radius:6px}
.prose pre{font:400 13.5px/1.6 var(--mono);background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px;overflow-x:auto}
.prose pre code{background:none;padding:0}
.prose sub,.prose sup{font-size:.7em}
.prose iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:var(--r-sm);margin:1.6em 0}
.prose .tw{margin:1.6em 0}
.prose table{font-size:15px;line-height:1.45}
.aside,.prose .aside{font-size:15.5px;line-height:1.55;background:var(--tint);border-radius:var(--r-sm);padding:14px 16px}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}

/* reading progress — CSS scroll timeline, no JS */
.progress{position:fixed;inset:0 0 auto 0;height:2px;z-index:30;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);pointer-events:none}
@supports (animation-timeline:scroll()){
  .progress{animation:grow linear both;animation-timeline:scroll(root)}
  @keyframes grow{to{transform:scaleX(1)}}
}
@supports not (animation-timeline:scroll()){.progress{display:none}}

/* prev / next */
.pn{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:56px;padding-top:20px;border-top:1px solid var(--line)}
.pn a{text-decoration:none;padding:10px;margin:-10px;border-radius:10px;transition:background var(--fast)}
.pn a:hover{background:var(--tint)}
.pn a.next{text-align:right;grid-column:2}
.pn small{display:block;font:400 12.5px/1.4 var(--mono);color:var(--fg-dim);margin-bottom:4px}
.pn span{font-weight:500;line-height:1.4;text-wrap:pretty}
@media (max-width:560px){.pn{grid-template-columns:1fr}.pn a.next{grid-column:1}}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;margin-top:28px}
.gallery button{all:unset;cursor:pointer;aspect-ratio:1;border-radius:var(--r-xs);overflow:hidden;background:var(--tint);position:relative}
.gallery button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gallery img{width:100%;height:100%;object-fit:cover}
.gallery .n{position:absolute;inset:auto auto 6px 8px;font:500 11px/1 var(--mono);color:var(--fg-dim)}
.lb{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:rgba(10,9,8,.94);color:#f1efec}
.lb::backdrop{background:transparent}
.lb img{position:absolute;inset:56px 16px 56px;width:calc(100% - 32px);height:calc(100% - 112px);object-fit:contain}
.lb .lb-top{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font:400 13px/1 var(--mono)}
.lb button{all:unset;cursor:pointer;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:#f1efec;background:rgba(255,255,255,.08)}
.lb button:hover{background:rgba(255,255,255,.16)}
.lb .prev,.lb .next{position:absolute;top:50%;translate:0 -50%}
.lb .prev{left:12px}.lb .next{right:12px}

/* ---------- data tables ---------- */
.tbar{display:flex;align-items:center;gap:14px;margin:0 0 12px}
.filter{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-pill);
  background:var(--bg-soft);color:var(--fg-dim);transition:border-color var(--fast)}
.filter:focus-within{border-color:var(--fg-dim)}
.filter svg{width:15px;height:15px;flex:none}
.filter input{all:unset;flex:1;min-width:0;font-size:15px;color:var(--fg)}
.filter input::placeholder{color:var(--fg-mute)}
.count{font:400 13px/1 var(--mono);color:var(--fg-dim);white-space:nowrap}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tw.flow{overflow:visible}
.tw.flow .data td{overflow-wrap:anywhere}
.tw.scroll{max-height:calc(100dvh - var(--bar) - 90px);overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);overscroll-behavior:contain}
table.data,.prose table{width:100%;border-collapse:separate;border-spacing:0}
.data{font-size:14.5px;line-height:1.45}
.data th{position:sticky;top:var(--stick);z-index:2;background:var(--bg);text-align:left;padding:0;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:bottom}
.tw.scroll .data th{top:0}
.data th button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;padding:10px 14px 9px 0;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--fg-dim);letter-spacing:.005em}
.data th button:hover{color:var(--fg)}
.data th button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.data th[aria-sort] button{color:var(--fg)}
.data th .ar{font:500 12px/1 var(--mono);color:var(--accent);width:10px}
.data td{padding:9px 14px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tw.scroll .data td,.tw.scroll .data th button{padding-left:14px}
.data td.num,.data th.num button{text-align:right;justify-content:flex-end;font-variant-numeric:tabular-nums}
.data td.num,.data td.mono{font-family:var(--mono);font-size:13.5px}
.data td.rep{color:var(--fg-mute)}
.data tbody tr:hover td{background:var(--tint)}
.data td a{text-decoration-color:color-mix(in srgb,var(--accent) 55%,transparent);text-underline-offset:3px}
.tw.scroll .data td{white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.tw.scroll .data .s0,.tw.scroll .data .s1{position:sticky;left:0;z-index:1;background:var(--bg)}
.tw.scroll .data th.s0,.tw.scroll .data th.s1{z-index:3}
.tw.scroll .data .s1{left:var(--c0,0px);box-shadow:1px 0 0 var(--line)}
.tw.scroll .data .s0:only-child,.tw.scroll .data .s0.solo{box-shadow:1px 0 0 var(--line)}
.data tbody tr:hover td.s0,.data tbody tr:hover td.s1{background:color-mix(in srgb,var(--fg) 5.5%,var(--bg))}
.empty{padding:28px 0;color:var(--fg-dim)}
.note{margin-top:22px;font-size:15px;color:var(--fg-dim)}
.intro{font-size:16.5px;line-height:1.65;color:var(--fg);margin-bottom:28px}
.intro ul{margin-bottom:0}

/* ---------- tools ---------- */
.form{display:grid;gap:22px;margin:30px 0 0}
.fl{display:block;font-size:13px;font-weight:600;color:var(--fg-dim);margin-bottom:8px}
.seg{display:inline-flex;padding:3px;border-radius:var(--r-pill);background:var(--tint);gap:2px;flex-wrap:wrap}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:7px 14px;border-radius:var(--r-pill);font-size:14px;font-weight:500;color:var(--fg-dim);transition:background var(--fast),color var(--fast)}
.seg span small{font-weight:400;color:var(--fg-mute);margin-left:6px}
.seg input:checked + span{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:1px}
.units{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.unit,.input{display:flex;align-items:center;height:46px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--bg-soft);transition:border-color var(--fast)}
.unit:focus-within,.input:focus-within{border-color:var(--fg-dim)}
.unit input{all:unset;flex:1;min-width:0;width:100%;padding:0 0 0 14px;font:400 17px/1 var(--mono);color:var(--fg)}
.unit input::placeholder{color:var(--fg-mute)}
.unit span{padding:0 14px 0 6px;font:500 13px/1 var(--mono);color:var(--fg-dim)}
.result{display:flex;align-items:baseline;gap:10px;margin:34px 0 0;padding:22px 0 0;border-top:1px solid var(--line)}
.result b{font:500 clamp(40px,8vw,56px)/1 var(--mono);letter-spacing:-.03em}
.result span{font-size:17px;color:var(--fg-dim)}
.result.idle b{color:var(--fg-mute)}
.result-2{margin:8px 0 0;font:400 13.5px/1.5 var(--mono);color:var(--fg-dim)}
details.work{margin-top:22px}
details.work summary{cursor:pointer;font-size:14.5px;font-weight:500;color:var(--fg-dim);list-style:none;display:inline-flex;gap:6px;align-items:center}
details.work summary::-webkit-details-marker{display:none}
details.work summary::before{content:"+";font:500 14px/1 var(--mono);color:var(--accent);width:12px}
details.work[open] summary::before{content:"−"}
details.work pre{margin:12px 0 0;font:400 13px/1.75 var(--mono);background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;overflow-x:auto;white-space:pre}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid2 .full{grid-column:1/-1}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.input input,.input textarea{all:unset;flex:1;min-width:0;width:100%;padding:0 14px;font-size:15.5px;color:var(--fg)}
.input textarea{padding:12px 14px;white-space:pre-wrap;line-height:1.45}
.input:has(textarea){height:auto;min-height:92px;align-items:stretch}
.input ::placeholder{color:var(--fg-mute)}
.hint{margin:6px 0 0;font-size:13px;color:var(--fg-dim)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:26px 0 36px}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:var(--r-pill);border:0;cursor:pointer;
  background:var(--fg);color:var(--bg);font-size:15px;font-weight:600;transition:transform 120ms var(--ease),opacity var(--fast)}
.btn:hover{opacity:.9}.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.actions small{color:var(--fg-dim);font-size:13px;max-width:44ch}

/* the printable letter: always white paper */
.sheet-wrap{margin:0 calc(-1*var(--gutter));padding:0 var(--gutter)}
.sheet{background:#fff;color:#16130f;border-radius:6px;padding:46px 50px;font-size:13.5px;line-height:1.55;
  box-shadow:0 0 0 1px rgba(22,19,15,.08),0 18px 44px -22px rgba(0,0,0,.4);max-width:794px}
.sheet p{margin:0 0 9px}
.sheet ul,.sheet ol{margin:0 0 9px;padding-left:20px}
.sheet li{margin:3px 0}
.sheet strong{font-weight:650}
.sheet .tofrom{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:14px}
.sheet .right{text-align:right}
.sheet [data-out="outCinemaDetails"]{white-space:pre-line}
.sheet .subject{font-weight:650;padding:9px 0;margin:4px 0 16px;border-top:1.5px solid #16130f;border-bottom:1px solid rgba(22,19,15,.2)}
.sheet .sec{font-weight:700;font-size:14px;margin:18px 0 6px;letter-spacing:-.005em}
.sheet .pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0 10px}
.sheet .figt{font-weight:650;font-size:12px;margin-bottom:6px}
.sheet .figc{font-size:11.5px;color:#5c5853;margin-top:6px;line-height:1.4}
.sheet .frame svg{width:100%;height:auto;border-radius:3px}
.sheet .photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px;background:#eee}
.sheet .req{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.sheet .req ul{margin:0}
.sheet .callout{border:1.5px solid #16130f;border-radius:6px;padding:10px 14px;margin:14px 0}
.sheet .callout ol{margin:4px 0 0}
.sheet .signoff{margin-top:18px}
.sheet [data-out],.sheet .screen-label,.sheet .screen-label-cap{background:#fbeee9;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
@media (max-width:640px){
  .sheet{padding:24px 20px;font-size:12.5px}
  .sheet .pair,.sheet .tofrom,.sheet .req{grid-template-columns:1fr}
  .sheet .right{text-align:left}
}

/* about */
.el{display:grid;grid-template-columns:110px 1fr;gap:10px 18px;margin:0;font-size:15.5px}
.el dt{font:400 13px/1.9 var(--mono);color:var(--fg-dim)}
.el dd{margin:0;display:flex;flex-wrap:wrap;gap:4px 14px;line-height:1.9}
.el a{text-decoration:none;border-bottom:1px solid var(--line-2)}
.el a:hover{border-bottom-color:var(--accent)}
@media (max-width:560px){.el{grid-template-columns:1fr;gap:2px}.el dd{margin-bottom:12px}}

/* ---------- search ---------- */
.sd{width:min(640px,calc(100vw - 24px));max-height:min(560px,calc(100dvh - 120px));margin:12vh auto auto;padding:0;border:1px solid var(--line-2);
  border-radius:16px;background:var(--surface);color:var(--fg);box-shadow:0 30px 80px -24px rgba(0,0,0,.45);overflow:hidden}
.sd[open]{display:flex;flex-direction:column}
.sd::backdrop{background:rgba(17,17,20,.32);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sh{display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;height:56px;border-bottom:1px solid var(--line);flex:none}
.sh svg{width:18px;height:18px;color:var(--fg-dim);flex:none}
.sh input{all:unset;flex:1;min-width:0;font-size:17px}
.sh input::placeholder{color:var(--fg-mute)}
.res{list-style:none;margin:0;padding:6px;overflow-y:auto;flex:1;overscroll-behavior:contain}
.res li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 12px;border-radius:10px;text-decoration:none}
.res li[aria-selected="true"] a{background:var(--tint-2)}
.res .rt{font-weight:500;line-height:1.35}
.res .rm{font-size:12.5px;color:var(--fg-dim);white-space:nowrap;align-self:start;padding-top:2px}
.res .rs{grid-column:1/-1;font-size:13.5px;color:var(--fg-dim);line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.res mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.res .rh{padding:10px 12px 4px;font:500 12px/1 var(--mono);color:var(--fg-dim)}
.res .none{padding:22px 12px;color:var(--fg-dim)}
.sf{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--fg-dim);flex:none}
.sf span{display:inline-flex;gap:4px;align-items:center}
@media (max-width:560px){.sd{margin-top:10px;max-height:calc(100dvh - 20px)}.sf{display:none}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important}
  .bar,.foot,.progress,dialog{display:none!important}
  main{padding:0;max-width:none}
  main.tool-letter > :not(.sheet-wrap){display:none!important}
  .sheet-wrap{margin:0;padding:0}
  .sheet{box-shadow:none;padding:0;border-radius:0;max-width:none;font-size:11.5px}
  .sheet [data-out],.sheet .screen-label,.sheet .screen-label-cap{background:none}
  .sheet .pair{grid-template-columns:1fr 1fr!important}
}
</style>

<script>const D=/*__DATA__*/null;</script>
<script>
(() => {
'use strict';

/* ---------------------------------------------------------------- basics */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const main = $('#main');
const E = D.entries;
const byId = new Map(E.map(e => [e.id, e]));
const SECTIONS = {
  articles: ['Articles', 'Long reads on cinema formats, reviews and technology.'],
  blogs: ['Blogs', 'Personal notes and experiences.'],
  lists: ['Lists', 'Sortable data on Indian cinemas and the movies shown in them.'],
  utilities: ['Utilities', 'Web based tools to help you visualise, calculate, find or create.'],
  photos: ['Photos', 'Photo sets.'],
};
const ONE = { articles: 'Article', blogs: 'Blog', lists: 'List', utilities: 'Utility', photos: 'Photos' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const day = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const dShort = iso => day(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const dLong = iso => day(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
const plain = h => String(h).replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '')
  .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
/* next frame, or a timer when frames are paused (hidden tab) — whichever comes first */
const soon = fn => { let done = false; const run = () => { if (!done) { done = true; fn(); } }; requestAnimationFrame(run); setTimeout(run, 50); };
const link = e => e.kind === 'external' ? e.url : '#/' + e.id;
const extAttr = e => e.kind === 'external' ? ' target="_blank" rel="noopener"' : '';
$('#yr').textContent = new Date().getFullYear();

const crumb = e => `<p class="crumb"><a href="#/${e.section}">${SECTIONS[e.section][0]}</a><i>/</i><span>${esc(e.category)}</span></p>`;
const icon = {
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>',
  print: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 9V4h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v6H7z"/></svg>',
};

/* ---------------------------------------------------------------- index views */
function group(list, key) {
  const m = new Map();
  for (const e of list) { const k = key(e); if (!m.has(k)) m.set(k, []); m.get(k).push(e); }
  return m;
}
function rows(list, meta) {
  return `<ol class="rows">${list.map(e => `<li><a class="row" href="${esc(link(e))}"${extAttr(e)}>
    <time datetime="${e.date}">${dShort(e.date)}</time>
    <span class="t">${esc(e.title)}${e.kind === 'external' ? ' <span class="ext">↗</span>' : ''}</span>
    <span class="m">${esc(meta(e))}</span></a></li>`).join('')}</ol>`;
}
function viewIndex(section) {
  const list = section ? E.filter(e => e.section === section) : E;
  const byCat = section === 'lists';
  const g = group(list, e => byCat ? e.category : e.date.slice(0, 4));
  const meta = e => !section ? ONE[e.section] : byCat ? `${e.count.toLocaleString()} rows` : e.category;
  const head = section
    ? `<header class="ph"><h1>${SECTIONS[section][0]}</h1><p class="sub">${SECTIONS[section][1]}</p></header>`
    : `<header class="home"><p class="lede">Articles, lists and tools about cinema technology — IMAX, Dolby Cinema, HDR, 3D and encoding.</p>
       <p class="lede-2">Not a typical personal website: the point is to publish information and ideas that add value, not a summary of me. <a href="#/about">More about me</a>.</p></header>`;
  const body = [...g].map(([k, l]) => `<section class="grp"><h2 class="gh">${esc(k)}<span>${l.length}</span></h2>${rows(l, meta)}</section>`).join('');
  return { html: head + (body || '<p class="empty">Nothing here yet.</p>'), title: section ? SECTIONS[section][0] : '' };
}

/* ---------------------------------------------------------------- post */
function neighbours(e) {
  const l = E.filter(x => x.section === e.section && x.kind !== 'external');
  const i = l.indexOf(e);
  return [l[i - 1], l[i + 1]];
}
function pn(e) {
  const [newer, older] = neighbours(e);
  if (!newer && !older) return '';
  return `<nav class="pn" aria-label="More ${SECTIONS[e.section][0].toLowerCase()}">
    ${newer ? `<a class="prev" href="#/${newer.id}"><small>← Newer</small><span>${esc(newer.title)}</span></a>` : ''}
    ${older ? `<a class="next" href="#/${older.id}"><small>Older →</small><span>${esc(older.title)}</span></a>` : ''}</nav>`;
}
function viewPost(e) {
  const p = D.posts[e.id];
  const gal = p.gallery ? `<div class="gallery">${p.gallery.map(([t, , c], i) =>
    `<button type="button" data-photo="${i}" aria-label="Open photo ${i + 1}${c ? ': ' + esc(c) : ''}"><span class="n">${i + 1}</span><img src="${esc(t)}" alt="${esc(c)}" loading="lazy" decoding="async" onerror="this.remove()"></button>`).join('')}</div>` : '';
  const html = `<article>
    <header class="ph">${crumb(e)}<h1>${esc(p.title)}</h1>
      <p class="meta"><time datetime="${e.date}">${dLong(e.date)}</time> · ${p.mins} min read</p></header>
    <div class="prose">${p.html}</div>${gal}${pn(e)}</article>`;
  return { html, title: p.title, progress: p.mins >= 3, after: () => {
    wrapTables(main);
    if (p.math) katex().then(() => window.renderMathInElement && renderMathInElement($('.prose', main), {
      delimiters: [{ left: '\\[', right: '\\]', display: true }, { left: '\\(', right: '\\)', display: false }], throwOnError: false }));
    if (p.gallery) bindGallery(p.gallery);
  } };
}
function wrapTables(root) {
  for (const t of $$('.prose table', root)) {
    if (t.parentElement.classList.contains('tw')) continue;
    const w = document.createElement('div'); w.className = 'tw'; t.before(w); w.append(t);
  }
}
let katexP;
function katex() {
  if (katexP) return katexP;
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/';
  const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = base + 'katex.min.css'; document.head.append(css);
  const js = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.append(s); });
  return katexP = js(base + 'katex.min.js').then(() => js(base + 'contrib/auto-render.min.js')).catch(() => {});
}

/* ---------------------------------------------------------------- lists */
const coll = new Intl.Collator('en', { numeric: true, sensitivity: 'base' });
const prepared = new Map();
function prep(id) {
  if (prepared.has(id)) return prepared.get(id);
  const [head, ...data] = D.lists[id].rows;
  const txt = data.map(r => r.map(plain));
  const hay = txt.map(r => r.join(' \u0001 ').toLowerCase());
  const share = re => head.map((_, c) => {
    const v = txt.map(r => r[c].trim()).filter(Boolean);
    return v.length > 0 && v.filter(x => re.test(x)).length / v.length >= .8;
  });
  const P = { head, data, txt, hay, num: share(/^[-+]?\d[\d,]*(\.\d+)?\s?%?$/), mono: share(/^\d{4}[.\-/]\d{1,2}[.\-/]\d{1,2}/) };
  prepared.set(id, P);
  return P;
}
function viewList(e, q0 = '') {
  const L = D.lists[e.id];
  const { head, data, txt, hay, num, mono } = prep(e.id);
  const wide = L.wide || head.length > 6;
  const stick = wide ? (num[0] && head.length > 1 ? 2 : 1) : 0;
  const st = { col: L.sort, dir: L.sort == null ? 0 : (L.order === 'desc' ? -1 : 1), q: q0.toLowerCase() };

  const html = `<header class="ph">${crumb(e)}<h1>${esc(L.title)}</h1>
      <p class="meta">${data.length.toLocaleString()} rows · updated ${dLong(e.date)}</p></header>
    ${L.intro ? `<div class="prose intro">${L.intro}</div>` : ''}
    <div class="tbar"><label class="filter">${icon.search}<input type="search" placeholder="Filter ${data.length.toLocaleString()} rows" aria-label="Filter rows" value="${esc(q0)}"></label><span class="count" aria-live="polite"></span></div>
    <div class="tw${wide ? ' scroll' : ' flow'}"><table class="data"><thead><tr>${head.map((h, c) =>
      `<th scope="col" class="${num[c] ? 'num ' : ''}${c < stick ? 's' + c + (stick === 1 ? ' solo' : '') : ''}"><button type="button" data-col="${c}">${h || '#'}<span class="ar"></span></button></th>`).join('')}</tr></thead><tbody></tbody></table></div>
    ${L.note ? `<div class="note">${L.note}</div>` : ''}`;

  const after = () => {
    const tbody = $('tbody', main), count = $('.count', main), table = $('table', main);
    let drawn = 0;
    const draw = () => {
      let idx = data.map((_, i) => i);
      if (st.q) { const terms = st.q.split(/\s+/); idx = idx.filter(i => terms.every(t => hay[i].includes(t))); }
      if (st.dir) idx.sort((a, b) => {
        const x = txt[a][st.col].trim(), y = txt[b][st.col].trim();
        if (!x || !y) return x ? -1 : y ? 1 : 0;
        return coll.compare(x, y) * st.dir;
      });
      let prev = null;
      const html = idx.length ? idx.map(i => {
        const r = data[i];
        const out = `<tr>${r.map((v, c) => {
          const rep = prev && v && prev[c] === v && c >= stick;
          const cls = [num[c] && 'num', mono[c] && 'mono', rep && 'rep', c < stick && 's' + c + (stick === 1 ? ' solo' : '')].filter(Boolean).join(' ');
          return `<td${cls ? ` class="${cls}"` : ''}>${v}</td>`;
        }).join('')}</tr>`;
        prev = r; return out;
      }) : [`<tr><td class="empty" colspan="${head.length}">No rows match “${esc(st.q)}”.</td></tr>`];
      // first screenful now, the rest on the next frame: big tables paint instantly
      const token = ++drawn;
      tbody.innerHTML = html.slice(0, 40).join('');
      if (html.length > 40) soon(() => { if (token === drawn && tbody.isConnected) tbody.insertAdjacentHTML('beforeend', html.slice(40).join('')); });
      count.textContent = st.q ? `${idx.length} of ${data.length.toLocaleString()}` : `${data.length.toLocaleString()} rows`;
      for (const th of $$('th', table)) {
        const c = +$('button', th).dataset.col, on = st.dir && c === st.col;
        on ? th.setAttribute('aria-sort', st.dir > 0 ? 'ascending' : 'descending') : th.removeAttribute('aria-sort');
        $('.ar', th).textContent = on ? (st.dir > 0 ? '↑' : '↓') : '';
      }
    };
    $('thead', main).addEventListener('click', ev => {
      const b = ev.target.closest('button[data-col]'); if (!b) return;
      const c = +b.dataset.col;
      if (c !== st.col) { st.col = c; st.dir = 1; } else st.dir = st.dir === 1 ? -1 : st.dir === -1 ? 0 : 1;
      draw();
    });
    $('.filter input', main).addEventListener('input', ev => { st.q = ev.target.value.trim().toLowerCase(); draw(); });
    draw();
    if (stick === 2) soon(() => table.style.setProperty('--c0', $('th.s0', table).offsetWidth + 'px'));
  };
  return { html, title: L.title, wide, after };
}

/* ---------------------------------------------------------------- tools */
function viewBitrate(e) {
  const T = D.tools[e.id];
  const unit = (n, u, l) => `<label class="unit"><input inputmode="decimal" name="${n}" placeholder="0" aria-label="${l}"><span>${u}</span></label>`;
  const html = `<header class="ph">${crumb(e)}<h1>${esc(T.title)}</h1></header>
    <div class="prose intro">${T.intro}</div>
    <form class="form" autocomplete="off" onsubmit="return false">
      <div><span class="fl">Size counted in</span>
        <div class="seg" role="radiogroup" aria-label="Size counted in">
          <label><input type="radio" name="base" value="1024" checked><span>1024-base<small>DCP servers, Linux, Windows</small></span></label>
          <label><input type="radio" name="base" value="1000"><span>1000-base<small>Apple &amp; Android</small></span></label>
        </div></div>
      <div><span class="fl">File size</span><div class="units">${unit('tb', 'TB', 'Terabytes')}${unit('gb', 'GB', 'Gigabytes')}${unit('mb', 'MB', 'Megabytes')}</div></div>
      <div><span class="fl">Runtime</span><div class="units">${unit('h', 'h', 'Hours')}${unit('m', 'min', 'Minutes')}${unit('s', 's', 'Seconds')}</div></div>
    </form>
    <output class="result idle" aria-live="polite"><b>0.00</b><span>Mbps</span></output>
    <p class="result-2">Enter a file size and a runtime.</p>
    <details class="work"><summary>Show working</summary><pre></pre></details>`;
  const after = () => {
    const f = $('form', main), out = $('.result', main), out2 = $('.result-2', main), pre = $('.work pre', main);
    const fmt = (n, d = 0) => n.toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d === 0 ? 2 : d });
    const calc = () => {
      const base = +f.base.value, n = k => parseFloat(f[k].value) || 0;
      const tb = n('tb'), gb = n('gb'), mb = n('mb'), h = n('h'), m = n('m'), s = n('s');
      if ((!tb && !gb && !mb) || (!h && !m && !s)) {
        out.classList.add('idle'); $('b', out).textContent = '0.00'; out2.textContent = 'Enter a file size and a runtime.'; pre.textContent = '—'; return;
      }
      const L = ['SIZE'];
      let totalMB = mb;
      if (tb) { L.push(`${fmt(tb)} TB × ${base} = ${fmt(tb * base)} GB`, `${fmt(tb * base)} GB × ${base} = ${fmt(tb * base * base)} MB`); totalMB += tb * base * base; }
      if (gb) { L.push(`${fmt(gb)} GB × ${base} = ${fmt(gb * base)} MB`); totalMB += gb * base; }
      const kb = totalMB * base, bytes = kb * base, bits = bytes * 8;
      L.push(`total = ${fmt(totalMB)} MB`, `${fmt(totalMB)} MB × ${base} = ${fmt(kb)} KB`, `${fmt(kb)} KB × ${base} = ${fmt(bytes)} bytes`, `${fmt(bytes)} bytes × 8 = ${fmt(bits)} bits`, '', 'RUNTIME');
      let secs = s;
      if (h) { L.push(`${fmt(h)} h × 3,600 = ${fmt(h * 3600)} s`); secs += h * 3600; }
      if (m) { L.push(`${fmt(m)} min × 60 = ${fmt(m * 60)} s`); secs += m * 60; }
      L.push(`total = ${fmt(secs)} s`, '', 'BITRATE');
      const bps = bits / secs, kbps = bps / 1000, mbps = kbps / 1000;
      L.push(`${fmt(bits)} bits ÷ ${fmt(secs)} s = ${fmt(bps, 2)} bps`, `${fmt(bps, 2)} bps ÷ 1,000 = ${fmt(kbps, 2)} kbps`, `${fmt(kbps, 2)} kbps ÷ 1,000 = ${fmt(mbps, 2)} Mbps`);
      out.classList.remove('idle'); $('b', out).textContent = fmt(mbps, 2);
      out2.textContent = `= ${fmt(Math.round(kbps))} kbps · ${fmt(totalMB, 0)} MB over ${fmt(secs, 0)} s, ${base}-base`;
      pre.textContent = L.join('\n');
    };
    f.addEventListener('input', calc); calc();
    f.tb.focus({ preventScroll: true });
  };
  return { html, title: T.title, after };
}

const frame = n => n === 0
  ? `<svg viewBox="0 0 370 200" role="img" aria-label="Scope 2.39:1 picture with black bars on a flat screen"><rect width="370" height="200" fill="#16130f"/><rect y="22.6" width="370" height="154.8" fill="#e6e0d4"/><g font-family="Figtree,Arial,sans-serif" text-anchor="middle"><text x="185" y="15.5" font-size="9" font-weight="600" fill="#b9b3a8" letter-spacing=".8">BLACK BAR</text><text x="185" y="96" font-size="14" font-weight="650" fill="#16130f">2.39:1 scope picture</text><text x="185" y="114" font-size="10.5" fill="#5c5853">top and bottom of the screen unused</text><text x="185" y="192.5" font-size="9" font-weight="600" fill="#b9b3a8" letter-spacing=".8">BLACK BAR</text></g></svg>`
  : `<svg viewBox="0 0 370 200" role="img" aria-label="Flat 1.85:1 picture filling the whole flat screen"><rect x="1" y="1" width="368" height="198" fill="#e6e0d4" stroke="#16130f" stroke-width="2"/><g font-family="Figtree,Arial,sans-serif" text-anchor="middle"><text x="185" y="96" font-size="14" font-weight="650" fill="#16130f">1.85:1 flat picture</text><text x="185" y="114" font-size="10.5" fill="#5c5853">fills 100% of the screen, zero black bars</text></g></svg>`;

function viewLetter(e) {
  const T = D.tools[e.id];
  const field = (id, label, ph, type = 'text', full = '') => `<div class="${full}"><label class="fl" for="${id}">${label}</label><div class="input">${type === 'area'
    ? `<textarea id="${id}" rows="3" placeholder="${ph}"></textarea>` : `<input id="${id}" type="${type}" placeholder="${ph}">`}</div></div>`;
  const html = `<header class="ph">${crumb(e)}<h1>${esc(T.title)}</h1><p class="meta"><time datetime="${e.date}">${dLong(e.date)}</time> · Cinema Technology Initiative</p></header>
    <div class="prose intro">${T.intro}</div>
    <form class="form grid2" autocomplete="on" onsubmit="return false">
      ${field('userName', 'Your name', 'e.g. Shrey Tyagi')}
      ${field('userPhone', 'Phone', 'e.g. +91 98765 43210', 'tel')}
      ${field('userEmail', 'Email', 'name@email.com', 'email')}
      <div>${field('screenType', 'Screen format <span style="font-weight:400">(optional)</span>', 'BIGPIX, PXL, PCX, EPIQ…').replace(/^<div class="">|<\/div>$/g, '')}<p class="hint">Typing BIGPIX makes the letter say “BIGPIX flat screen”.</p></div>
      ${field('cinemaDetails', 'Cinema name, mall or area, and city', 'PVR INOX Cinemas&#10;Elante Mall, Industrial Area Phase 1&#10;Chandigarh', 'area', 'full')}
    </form>
    <div class="actions"><button class="btn" type="button" id="print">${icon.print}Print or save as PDF</button>
      <small>In the print dialog choose “Save as PDF” and untick “Headers and footers” for a clean one-page letter.</small></div>
    <div class="sheet-wrap"><div class="sheet">${T.letter}</div></div>`;
  const after = () => {
    main.classList.add('tool-letter');
    for (const f of $$('.frame', main)) f.innerHTML = frame(+f.dataset.n);
    const v = id => $('#' + id, main).value.trim();
    const set = (k, t) => $$(`[data-out="${k}"]`, main).forEach(n => n.textContent = t);
    const upd = () => {
      const name = v('userName') || '[Your Name]';
      const contact = [v('userPhone'), v('userEmail')].filter(Boolean).join(' | ') || '[Your Phone / Email]';
      const scr = v('screenType').replace(/\bflat\s*screen\b/ig, '').replace(/\bflat\b/ig, '').replace(/\bscreen\b/ig, '').trim();
      set('outHeaderName', name); set('outFooterName', name);
      set('outHeaderContact', contact); set('outFooterContact', contact);
      set('outCinemaDetails', v('cinemaDetails') || '[Cinema Name, Mall/Area & City]');
      $$('.screen-label', main).forEach(n => n.textContent = scr ? scr + ' flat screen' : 'flat screen');
      $$('.screen-label-cap', main).forEach(n => n.textContent = scr ? scr + ' Flat Screen' : 'Flat Screen');
    };
    $('form', main).addEventListener('input', upd); upd();
    $('#print', main).addEventListener('click', () => window.print());
  };
  return { html, title: 'Request Infinity Vision', after };
}

  ['3D Clips And Trailers', 'UCnv-wyenxwz2LZtSRwVNWNg'], ['8K Clips And Trailers', 'UCc_lxgyKjvxO-lHHa03pUhw'], ['mp4dump', 'UCqIm5-PSK5YDFM_cAbdFqrA'], ['amateur singer', 'UCx56_WYLdDB3tEPycBCai_g']];
const SOCIAL = [['X', 'https://x.com/iamshreytyagi'], ['Instagram', 'https://instagram.com/iamshreytyagi'], ['Facebook', 'https://facebook.com/iamshreytyagi'],
  ['BeReal', 'https://BeRe.al/shreytyagi'], ['Reddit', 'https://reddit.com/user/shreytyagi'], ['Snapchat', 'https://snapchat.com/add/shreytyagi']];

function view404() {
  return { html: `<header class="ph"><h1>Not found</h1><p class="sub">That page isn’t here. <a href="#/">Go home</a> or <a href="#" data-open-search>search the site</a>.</p></header>`, title: 'Not found' };

/* ---------------------------------------------------------------- router */
const scrolls = new Map();
let current = null, clicked = false;
document.addEventListener('click', ev => {
  const a = ev.target.closest('a[href^="#/"]');
  if (a && !ev.metaKey && !ev.ctrlKey && !ev.shiftKey) clicked = true;
});
function route() {
  const h = location.hash;
  if (h && !h.startsWith('#/')) return false;
  if (current != null) scrolls.set(current, scrollY);
  const [path, qs] = h.slice(2).split('?');
  const id = decodeURIComponent(path).replace(/\.html$/, '').replace(/\/(index)?$/, '');
  const params = new URLSearchParams(qs || '');
  let v;
  if (!id) v = viewIndex();
  else if (SECTIONS[id]) v = viewIndex(id);
  else if (id === 'about') v = viewAbout();
  else {
    const e = byId.get(id);
    if (!e) v = view404();
    else if (e.kind === 'external') { location.href = e.url; return; }
    else if (e.kind === 'list') v = viewList(e, params.get('q') || '');
    else if (e.kind === 'tool') v = e.tool === 'bitrate' ? viewBitrate(e) : viewLetter(e);
    else v = viewPost(e);
  }
  main.className = v.wide ? 'is-wide' : '';
  document.body.classList.toggle('wide', !!v.wide);
  main.innerHTML = v.html;
  document.title = v.title ? `${v.title} — Shrey Tyagi` : 'Shrey Tyagi';
  $('.progress').hidden = !v.progress;
  const sec = id.split('/')[0];
  for (const a of $$('.nav a')) a.getAttribute('href') === '#/' + sec ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  v.after && v.after();
  const y = clicked ? 0 : (scrolls.get(id) || 0);
  scrollTo(0, y);
  if (clicked) main.focus({ preventScroll: true });
  clicked = false;
  current = id;
}
addEventListener('hashchange', route);
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
route();

/* ---------------------------------------------------------------- top bar */
const bar = $('.bar'), mq = matchMedia('(max-width: 820px)');
let lastY = scrollY, ticking = false;
const syncBar = () => {
  const y = scrollY;
  bar.classList.toggle('scrolled', y > 4);
  const hide = mq.matches && y > 140 && y > lastY && !document.querySelector('dialog[open]');
  if (mq.matches && Math.abs(y - lastY) > 4) bar.classList.toggle('hide', hide);
  if (!mq.matches) bar.classList.remove('hide');
  document.documentElement.style.setProperty('--stick', bar.classList.contains('hide') ? '0px' : bar.offsetHeight + 'px');
  lastY = y; ticking = false;
};
addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(syncBar); } }, { passive: true });
addEventListener('resize', syncBar); syncBar();
$('.skip').addEventListener('click', ev => { ev.preventDefault(); main.focus(); });

/* ---------------------------------------------------------------- theme */
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
const paintMeta = () => $('meta[name="theme-color"]').setAttribute('content', getComputedStyle(document.body).backgroundColor);
$('#theme').addEventListener('click', () => {
  const t = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('st-theme', t); } catch (e) {}
  paintMeta();
});
paintMeta();

/* ---------------------------------------------------------------- search */
const sd = $('#search'), q = $('#q'), res = $('#res');
let idx = null, sel = 0, hits = [];
function buildIndex() {
  return E.map(e => {
    let body = '';
    if (D.posts[e.id]) body = plain(D.posts[e.id].html);
    else if (D.lists[e.id]) body = plain(D.lists[e.id].intro) + ' ' + D.lists[e.id].rows.slice(1).map(r => r.map(plain).join(' · ')).join(' ¶ ');
    else if (D.tools[e.id]) body = plain(D.tools[e.id].intro + ' ' + (D.tools[e.id].letter || ''));
    body = body.replace(/\s+/g, ' ');
    return { e, title: (D.posts[e.id]?.title || e.title), t: e.title.toLowerCase() + ' ' + (D.posts[e.id]?.title || '').toLowerCase(),
      c: (e.category + ' ' + e.section).toLowerCase(), body, b: body.toLowerCase() };
  });
}
const mark = (s, terms) => {
  let h = esc(s);
  for (const t of terms) if (t) h = h.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
  return h;
};
function snippet(x, terms) {
  if (D.lists[x.e.id]) {
    const rowsTxt = x.body.split(' ¶ ').filter(r => terms.every(t => r.toLowerCase().includes(t)));
    if (rowsTxt.length) return `${rowsTxt.length} matching row${rowsTxt.length > 1 ? 's' : ''} — ${rowsTxt[0].slice(0, 120)}`;
  }
  const i = x.b.indexOf(terms[0]);
  if (i < 0) return '';
  const a = Math.max(0, i - 50);
  return (a ? '…' : '') + x.body.slice(a, i + 90).trim() + '…';
}
function search() {
  idx ||= buildIndex();
  const s = q.value.trim().toLowerCase(), terms = s.split(/\s+/).filter(Boolean);
  if (!terms.length) {
    hits = idx.slice(0, 8).map(x => ({ x, snip: '' }));
    res.innerHTML = '<li class="rh" role="presentation">Latest</li>' + hits.map((h, i) => item(h, i, [])).join('');
  } else {
    hits = [];
    for (const x of idx) {
      if (!terms.every(t => x.t.includes(t) || x.c.includes(t) || x.b.includes(t))) continue;
      let sc = 0;
      for (const t of terms) sc += x.t.startsWith(t) ? 100 : x.t.includes(t) ? 60 : x.c.includes(t) ? 25 : 8;
      hits.push({ x, sc, snip: terms.every(t => x.t.includes(t)) ? '' : snippet(x, terms) });
    }
    hits.sort((a, b) => b.sc - a.sc || b.x.e.date.localeCompare(a.x.e.date));
    hits = hits.slice(0, 30);
    res.innerHTML = hits.length ? hits.map((h, i) => item(h, i, terms)).join('') : `<li class="none" role="presentation">Nothing found for “${esc(q.value)}”.</li>`;
  }
  sel = 0; paintSel();
}
const item = (h, i, terms) => `<li role="option" id="r${i}" aria-selected="false"><a href="${esc(link(h.x.e) + (h.x.e.kind === 'list' && terms.length && h.snip ? '?q=' + encodeURIComponent(terms.join(' ')) : ''))}"${extAttr(h.x.e)}>
  <span class="rt">${mark(h.x.e.title, terms)}</span><span class="rm">${ONE[h.x.e.section]} · ${esc(h.x.e.category)}</span>
  ${h.snip ? `<span class="rs">${mark(h.snip, terms)}</span>` : ''}</a></li>`;
function paintSel() {
  $$('li[role="option"]', res).forEach((li, i) => li.setAttribute('aria-selected', i === sel));
  const cur = $('#r' + sel, res);
  q.setAttribute('aria-activedescendant', cur ? cur.id : '');
  cur && cur.scrollIntoView({ block: 'nearest' });
}
function openSearch() {
  if (sd.open) return;
  sd.showModal(); q.select(); search();
}
q.addEventListener('input', search);
q.addEventListener('keydown', ev => {
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    sel = Math.max(0, Math.min(hits.length - 1, sel + (ev.key === 'ArrowDown' ? 1 : -1))); paintSel();
  } else if (ev.key === 'Enter') {
    const a = $('#r' + sel + ' a', res); if (a) { ev.preventDefault(); clicked = true; a.click(); sd.close(); }
  }
});
res.addEventListener('click', ev => { if (ev.target.closest('a')) { clicked = true; sd.close(); } });
sd.addEventListener('click', ev => { if (ev.target === sd) sd.close(); });
document.addEventListener('click', ev => { if (ev.target.closest('[data-open-search]')) { ev.preventDefault(); openSearch(); } });
document.addEventListener('keydown', ev => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  if ((ev.key === 'k' && (ev.metaKey || ev.ctrlKey)) || (ev.key === '/' && !typing && !ev.metaKey && !ev.ctrlKey)) {
    ev.preventDefault(); openSearch();
  }
});

/* ---------------------------------------------------------------- lightbox */
const lb = $('#lb'), lbImg = $('#lb-img'), lbN = $('#lb-n');
let gal = [], gi = 0;
const show = i => { gi = (i + gal.length) % gal.length; lbImg.src = gal[gi][1]; lbImg.alt = gal[gi][2] || `Photo ${gi + 1}`; lbN.textContent = `${gi + 1} / ${gal.length}`; };
function bindGallery(g) {
  gal = g;
  $('.gallery', main).addEventListener('click', ev => { const b = ev.target.closest('[data-photo]'); if (b) { show(+b.dataset.photo); lb.showModal(); } });
}
$('.prev', lb).addEventListener('click', () => show(gi - 1));
$('.next', lb).addEventListener('click', () => show(gi + 1));
$('[data-close]', lb).addEventListener('click', () => lb.close());
lb.addEventListener('keydown', ev => { if (ev.key === 'ArrowLeft') show(gi - 1); if (ev.key === 'ArrowRight') show(gi + 1); });
lb.addEventListener('close', () => { lbImg.removeAttribute('src'); });
})();
</script>
